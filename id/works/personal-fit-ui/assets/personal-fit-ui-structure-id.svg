<path d="M 935 725 H 985" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<text x="66" y="539" font-size="18.0" font-weight="700" fill="#646464"><tspan x="66" dy="0">MASUKAN</tspan></text>
<text x="66" y="579" font-size="25.62" font-weight="700" fill="#202020"><tspan x="66" dy="0">Informasi tentang</tspan><tspan x="66" dy="34.59">karakteristik kognitif</tspan><tspan x="66" dy="34.59">pengguna</tspan></text>
<text x="66" y="695.2" font-size="21.0" font-weight="400" fill="#202020"><tspan x="66" dy="0">Beban mengingat dan</tspan><tspan x="66" dy="28.35">menggunakan informasi</tspan></text>
<text x="66" y="758.5500000000001" font-size="21.0" font-weight="400" fill="#202020"><tspan x="66" dy="0">Perhatian dan pemahaman</tspan><tspan x="66" dy="28.35">penjelasan</tspan></text>
<text x="66" y="833.9000000000001" font-size="18.18" font-weight="400" fill="#646464"><tspan x="66" dy="0">PoC juga mencakup karakteristik</tspan><tspan x="66" dy="24.55">sensorik dan fisik</tspan></text>
<text x="66" y="894.9000000000001" font-size="20.0" font-weight="400" fill="#646464"><tspan x="66" dy="0">Masukan: persona fiktif</tspan></text>
<text x="494" y="539" font-size="18.0" font-weight="700" fill="#646464"><tspan x="494" dy="0">PROSES / PEMBUATAN DAN VALIDASI</tspan></text>
<text x="494" y="580" font-size="30.0" font-weight="700" fill="#202020"><tspan x="494" dy="0">AI generatif</tspan></text>
<text x="494" y="632" font-size="23.0" font-weight="400" fill="#202020"><tspan x="494" dy="0">Memadukan informasi pribadi</tspan><tspan x="494" dy="31.05">dan pengetahuan desain untuk</tspan><tspan x="494" dy="31.05">mengusulkan antarmuka dalam</tspan><tspan x="494" dy="31.05">batas yang diizinkan</tspan></text>
<text x="494" y="774.15" font-size="17.42" font-weight="400" fill="#646464"><tspan x="494" dy="0">Menghitung nilai yang ditentukan oleh rumus</tspan></text>
<text x="682" y="819.15" font-size="28.0" font-weight="400" fill="#202020"><tspan x="682" dy="0">⇅</tspan></text>
<rect x="490" y="842.15" width="420" height="95" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="512" y="869.15" font-size="21.0" font-weight="700" fill="#202020"><tspan x="512" dy="0">Tahap terpisah: memeriksa</tspan><tspan x="512" dy="28.35">persyaratan yang ditetapkan</tspan></text>
<text x="1021" y="539" font-size="18.0" font-weight="700" fill="#646464"><tspan x="1021" dy="0">KELUARAN</tspan></text>
<text x="1021" y="579" font-size="21.68" font-weight="700" fill="#202020"><tspan x="1021" dy="0">Antarmuka yang disesuaikan</tspan></text>
<text x="1021" y="629" font-size="23.48" font-weight="700" fill="#202020"><tspan x="1021" dy="0">+ Alasan dan bukti</tspan><tspan x="1021" dy="31.7">yang mendasari perubahan</tspan></text>
<rect x="1021" y="730.4" width="311" height="102" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1035" y="744.4" width="90" height="72" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1140" y="744.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1140" y="770.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1140" y="796.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<text x="1021" y="873.4" font-size="17.08" font-weight="400" fill="#646464"><tspan x="1021" dy="0">Menentukan tata letak, penyajian,</tspan><tspan x="1021" dy="23.06">dan pilihan kata</tspan></text>
