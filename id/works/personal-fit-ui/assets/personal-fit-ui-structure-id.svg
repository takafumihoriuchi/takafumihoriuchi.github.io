<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc" xml:lang="id"><title id="title">Masukan pribadi dan dua jenis pengetahuan desain</title><desc id="desc">Diagram konsep sistem yang diusulkan. Karakteristik kognitif dipadukan dengan aturan dasar antarmuka dan rekomendasi berdasarkan karakteristik manusia. AI generatif mengusulkan antarmuka, tahap terpisah memvalidasinya, lalu keluarannya mencakup antarmuka dan alasan perubahan.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="1400" height="1080" fill="white" /><text x="40" y="42" font-size="22.0" font-weight="700" fill="#202020"><tspan x="40" dy="0">Pengetahuan yang digunakan AI, disiapkan oleh desainer</tspan></text>
<rect x="40" y="65" width="635" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="705" y="65" width="655" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="66" y="103" font-size="18.0" font-weight="700" fill="#646464"><tspan x="66" dy="0">Pengetahuan A</tspan></text>
<text x="66" y="138" font-size="28.0" font-weight="700" fill="#202020"><tspan x="66" dy="0">Persyaratan dasar antarmuka</tspan></text>
<text x="66" y="188" font-size="20.0" font-weight="700" fill="#202020"><tspan x="66" dy="0">Prinsip desain</tspan></text>
<text x="66" y="214" font-size="20.68" font-weight="400" fill="#202020"><tspan x="66" dy="0">Konsistensi · Umpan balik · Pengelompokan informasi</tspan></text>
<text x="66" y="256" font-size="20.0" font-weight="700" fill="#202020"><tspan x="66" dy="0">Persyaratan</tspan></text>
<text x="66" y="282" font-size="21.0" font-weight="400" fill="#202020"><tspan x="66" dy="0">Keselamatan · Aksesibilitas · Batasan interaksi</tspan></text>
<text x="66" y="323" font-size="18.83" font-weight="400" fill="#646464"><tspan x="66" dy="0">Tentukan kapan persyaratan berlaku dan cara memeriksanya</tspan></text>
<text x="731" y="103" font-size="18.0" font-weight="700" fill="#646464"><tspan x="731" dy="0">Pengetahuan B</tspan></text>
<text x="731" y="138" font-size="26.0" font-weight="700" fill="#202020"><tspan x="731" dy="0">Rekomendasi antarmuka berdasarkan</tspan><tspan x="731" dy="35.1">karakteristik manusia</tspan></text>
<text x="731" y="211" font-size="20.0" font-weight="400" fill="#202020"><tspan x="731" dy="0">Penelitian tentang karakteristik manusia</tspan></text>
<text x="731" y="244" font-size="18.0" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="275" font-size="20.0" font-weight="400" fill="#202020"><tspan x="731" dy="0">Prinsip penyajian informasi</tspan></text>
<text x="731" y="308" font-size="18.0" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="339" font-size="20.0" font-weight="400" fill="#202020"><tspan x="731" dy="0">Rekomendasi antarmuka untuk karakteristik tersebut</tspan></text>
<text x="731" y="399" font-size="19.0" font-weight="400" fill="#646464"><tspan x="731" dy="0">Pisahkan temuan penelitian dari pertimbangan desain</tspan></text>
<rect x="40" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="468" y="500" width="464" height="490" rx="12" fill="#fff" stroke="#303030" stroke-width="1.5" />
<rect x="995" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5" />
<path d="M 357 425 V 462 H 600 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 1032 425 V 462 H 800 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
