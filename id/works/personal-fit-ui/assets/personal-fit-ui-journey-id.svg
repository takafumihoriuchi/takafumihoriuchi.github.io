<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc" xml:lang="id"><title id="title">Menyiapkan antarmuka sebelum berkendara pertama kali</title><desc id="desc">Konsep masa depan. Lima tahap: memulai penyiapan saat mobil berhenti, wawancara, pemeriksaan pemahaman, usulan dan uji coba, lalu mulai memakai. Setiap tahap menunjukkan tindakan pengguna dan respons AI.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="1200" height="1220" fill="white" /><text x="40" y="55" font-size="33.0" font-weight="700" fill="#202020"><tspan x="40" dy="0">Menyiapkan antarmuka sebelum berkendara pertama kali</tspan></text>
<text x="40" y="99" font-size="21.0" font-weight="400" fill="#646464"><tspan x="40" dy="0">Konsep masa depan / Penyiapan melalui percakapan belum diterapkan dalam PoC</tspan></text>
<text x="215" y="160" font-size="22.0" font-weight="700" fill="#202020"><tspan x="215" dy="0">Tindakan dan pikiran pengguna</tspan></text>
<text x="697" y="160" font-size="22.0" font-weight="700" fill="#202020"><tspan x="697" dy="0">Respons AI dan sistem</tspan></text>
<rect x="40" y="190" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="225" font-size="22.0" font-weight="700" fill="#202020"><tspan x="62" dy="0">01</tspan></text>
<text x="62" y="262" font-size="18.0" font-weight="700" fill="#202020"><tspan x="62" dy="0">Pertama kali</tspan><tspan x="62" dy="24.3">masuk mobil</tspan></text>
<text x="215" y="228" font-size="22.0" font-weight="400" fill="#202020"><tspan x="215" dy="0">Memulai penyiapan saat mobil berhenti</tspan></text>
<text x="215" y="276" font-size="21.0" font-weight="400" fill="#646464"><tspan x="215" dy="0">“Saya ingin ini mudah digunakan.”</tspan></text>
<text x="697" y="228" font-size="22.0" font-weight="400" fill="#202020"><tspan x="697" dy="0">Menjelaskan tujuan dan menanyakan</tspan><tspan x="697" dy="29.7">apakah pengguna ingin memulai</tspan></text>
<text x="697" y="284" font-size="21.0" font-weight="400" fill="#202020"><tspan x="697" dy="0">Mengizinkan pengguna memulai nanti</tspan></text>
<path d="M 85 339 V 356" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="360" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="395" font-size="22.0" font-weight="700" fill="#202020"><tspan x="62" dy="0">02</tspan></text>
<text x="62" y="432" font-size="18.0" font-weight="700" fill="#202020"><tspan x="62" dy="0">Wawancara</tspan></text>
<text x="215" y="398" font-size="22.0" font-weight="400" fill="#202020"><tspan x="215" dy="0">Menceritakan kesulitan sehari-hari</tspan></text>
<text x="215" y="446" font-size="21.0" font-weight="400" fill="#646464"><tspan x="215" dy="0">“Saya lupa petunjuk sebelumnya</tspan><tspan x="215" dy="28.35">ketika petunjuk berikutnya muncul.”</tspan></text>
<text x="697" y="398" font-size="22.0" font-weight="400" fill="#202020"><tspan x="697" dy="0">Menanyakan situasi yang konkret</tspan></text>
<text x="697" y="454" font-size="18.06" font-weight="400" fill="#202020"><tspan x="697" dy="0">Mengidentifikasi beban ingatan dan perhatian</tspan></text>
<path d="M 85 509 V 526" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="530" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="565" font-size="22.0" font-weight="700" fill="#202020"><tspan x="62" dy="0">03</tspan></text>
<text x="62" y="602" font-size="18.0" font-weight="700" fill="#202020"><tspan x="62" dy="0">Memeriksa</tspan><tspan x="62" dy="24.3">pemahaman</tspan></text>
<text x="215" y="568" font-size="19.03" font-weight="400" fill="#202020"><tspan x="215" dy="0">Mengonfirmasi atau mengoreksi penafsiran AI</tspan></text>
<text x="215" y="616" font-size="20.98" font-weight="400" fill="#646464"><tspan x="215" dy="0">“Bagian ini benar. Bagian itu berbeda.”</tspan></text>
<text x="697" y="568" font-size="22.0" font-weight="400" fill="#202020"><tspan x="697" dy="0">Merangkum penuturan pengguna</tspan></text>
<text x="697" y="624" font-size="21.0" font-weight="400" fill="#202020"><tspan x="697" dy="0">Memisahkan laporan pribadi dari</tspan><tspan x="697" dy="28.35">hasil pengukuran</tspan></text>
<path d="M 85 679 V 696" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="700" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="735" font-size="22.0" font-weight="700" fill="#202020"><tspan x="62" dy="0">04</tspan></text>
<text x="62" y="772" font-size="18.0" font-weight="700" fill="#202020"><tspan x="62" dy="0">Usulan dan</tspan><tspan x="62" dy="24.3">uji coba</tspan></text>
<text x="215" y="738" font-size="22.0" font-weight="400" fill="#202020"><tspan x="215" dy="0">Mencoba antarmuka saat mobil berhenti</tspan></text>
<text x="215" y="786" font-size="21.0" font-weight="400" fill="#646464"><tspan x="215" dy="0">“Informasi yang tetap di layar</tspan><tspan x="215" dy="28.35">membantu saya.”</tspan></text>
<text x="697" y="738" font-size="22.0" font-weight="400" fill="#202020"><tspan x="697" dy="0">Menampilkan antarmuka beserta</tspan><tspan x="697" dy="29.7">alasan perubahannya</tspan></text>
<text x="697" y="794" font-size="21.0" font-weight="400" fill="#202020"><tspan x="697" dy="0">Mengizinkan penyesuaian atau</tspan><tspan x="697" dy="28.35">pemulihan antarmuka semula</tspan></text>
<path d="M 85 849 V 866" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="870" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="905" font-size="22.0" font-weight="700" fill="#202020"><tspan x="62" dy="0">05</tspan></text>
<text x="62" y="942" font-size="18.0" font-weight="700" fill="#202020"><tspan x="62" dy="0">Mulai memakai</tspan></text>
<text x="215" y="908" font-size="21.53" font-weight="400" fill="#202020"><tspan x="215" dy="0">Mulai memakai antarmuka yang disetujui</tspan></text>
<text x="215" y="956" font-size="20.45" font-weight="400" fill="#646464"><tspan x="215" dy="0">“Saya akan mulai dengan pengaturan ini.”</tspan></text>
<text x="697" y="908" font-size="22.0" font-weight="400" fill="#202020"><tspan x="697" dy="0">Menyimpan antarmuka awal</tspan></text>
<text x="697" y="964" font-size="21.0" font-weight="400" fill="#202020"><tspan x="697" dy="0">Mempertahankan struktur dasarnya</tspan><tspan x="697" dy="28.35">selama berkendara</tspan></text>
<text x="40" y="1103" font-size="21.9" font-weight="700" fill="#202020"><tspan x="40" dy="0">Mengubah percakapan menjadi informasi pribadi yang dapat dikonfirmasi dan dikoreksi pengguna.</tspan></text>
<text x="40" y="1148" font-size="21.0" font-weight="400" fill="#646464"><tspan x="40" dy="0">Pisahkan dari pengukuran kognitif dan diagnosis; nilai hal lain secara terpisah jika diperlukan.</tspan></text></svg>