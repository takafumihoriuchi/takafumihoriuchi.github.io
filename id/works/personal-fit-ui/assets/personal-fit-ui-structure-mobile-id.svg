<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1641" viewBox="0 0 480 1641" role="img" aria-labelledby="title desc" xml:lang="id"><title id="title">Menghasilkan antarmuka dari informasi pribadi</title><desc id="desc">Diagram konsep untuk layar seluler, dibaca dari atas ke bawah: masukan pribadi; pengetahuan A dan B; AI generatif dan validasi terpisah; antarmuka yang disesuaikan beserta alasan perubahan.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="480" height="1641" fill="white" /><rect x="24" y="26" width="402" height="222" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="62" font-size="18.0" font-weight="700" fill="#202020"><tspan x="48" dy="0">MASUKAN</tspan></text>
<text x="48" y="95" font-size="25.0" font-weight="700" fill="#202020"><tspan x="48" dy="0">Informasi tentang</tspan></text>
<text x="48" y="120" font-size="21.11" font-weight="700" fill="#202020"><tspan x="48" dy="0">karakteristik kognitif pengguna</tspan></text>
<text x="48" y="164" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48" dy="0">PoC juga mencakup karakteristik</tspan><tspan x="48" dy="27.0">sensorik dan fisik</tspan></text>
<text x="48" y="224" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48" dy="0">Masukan: persona fiktif</tspan></text>
<text x="24" y="284" font-size="23.0" font-weight="700" fill="#202020"><tspan x="24" dy="0">Pengetahuan yang digunakan AI</tspan></text>
<rect x="24" y="329" width="402" height="266.75" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="365" font-size="18.0" font-weight="700" fill="#202020"><tspan x="48" dy="0">Pengetahuan A</tspan></text>
<text x="48" y="400" font-size="25.0" font-weight="700" fill="#202020"><tspan x="48" dy="0">Prinsip dan persyaratan</tspan><tspan x="48" dy="33.75">dasar antarmuka</tspan></text>
<text x="48" y="476.75" font-size="15.96" font-weight="400" fill="#202020"><tspan x="48" dy="0">Konsistensi · Umpan balik · Pengelompokan</tspan></text>
<text x="48" y="510.75" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48" dy="0">Keselamatan · Aksesibilitas</tspan></text>
<text x="48" y="544.75" font-size="19.25" font-weight="400" fill="#202020"><tspan x="48" dy="0">Kapan persyaratan berlaku dan cara</tspan><tspan x="48" dy="25.99">memeriksanya</tspan></text>
<rect x="24" y="631.75" width="402" height="329.5" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="667.75" font-size="18.0" font-weight="700" fill="#202020"><tspan x="48" dy="0">Pengetahuan B</tspan></text>
<text x="48" y="702.75" font-size="25.0" font-weight="700" fill="#202020"><tspan x="48" dy="0">Rekomendasi antarmuka</tspan><tspan x="48" dy="33.75">berdasarkan karakteristik</tspan><tspan x="48" dy="33.75">manusia</tspan></text>
<text x="48" y="813.25" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48" dy="0">Temuan penelitian → Prinsip</tspan><tspan x="48" dy="27.0">penyajian informasi</tspan></text>
<text x="48" y="872.25" font-size="19.83" font-weight="400" fill="#202020"><tspan x="48" dy="0">→ Antarmuka yang direkomendasikan</tspan></text>
<text x="48" y="910.25" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48" dy="0">Pisahkan temuan penelitian dari</tspan><tspan x="48" dy="27.0">pertimbangan desain</tspan></text>
<rect x="24" y="997.25" width="402" height="369.4000000000001" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="1033.25" font-size="18.0" font-weight="700" fill="#202020"><tspan x="48" dy="0">PROSES / PEMBUATAN DAN</tspan><tspan x="48" dy="24.3">VALIDASI</tspan></text>
<text x="48" y="1092.55" font-size="28.0" font-weight="700" fill="#202020"><tspan x="48" dy="0">AI generatif</tspan></text>
<text x="48" y="1139.55" font-size="22.0" font-weight="400" fill="#202020"><tspan x="48" dy="0">Mengusulkan antarmuka dari</tspan><tspan x="48" dy="29.7">informasi pribadi dan</tspan><tspan x="48" dy="29.7">pengetahuan desain</tspan></text>
<text x="48" y="1239.95" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48" dy="0">Menghitung nilai yang ditentukan</tspan><tspan x="48" dy="27.0">oleh rumus</tspan></text>
<text x="48" y="1310.95" font-size="22.0" font-weight="700" fill="#202020"><tspan x="48" dy="0">Tahap terpisah: memeriksa</tspan><tspan x="48" dy="29.7">persyaratan</tspan></text>
<rect x="24" y="1402.65" width="402" height="172.04999999999995" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="1438.65" font-size="18.0" font-weight="700" fill="#202020"><tspan x="48" dy="0">KELUARAN</tspan></text>
<text x="48" y="1473.65" font-size="25.17" font-weight="700" fill="#202020"><tspan x="48" dy="0">Antarmuka yang disesuaikan</tspan></text>
<text x="48" y="1516.65" font-size="23.0" font-weight="700" fill="#202020"><tspan x="48" dy="0">+ Alasan dan bukti yang</tspan><tspan x="48" dy="31.05">mendasari perubahan</tspan></text>
<path d="M 426 111 H 458 V 1092.25 H 434" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<path d="M 24 404 H 10 V 977.25 H 160 V 990.25" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 226 961.25 V 990.25" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 226 1366.65 V 1395.65" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<text x="24" y="1610.7" font-size="15.1" font-weight="400" fill="#646464"><tspan x="24" dy="0">Utuh: alur proses · Putus-putus: rujukan pengetahuan</tspan></text></svg>