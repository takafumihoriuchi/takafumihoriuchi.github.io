<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1641" viewBox="0 0 480 1641" role="img" aria-labelledby="title desc"><title id="title">Generar una interfaz a partir de información personal</title><desc id="desc">Diagrama conceptual para móviles, de arriba abajo: información personal; conjuntos de conocimientos A y B; IA generativa y validación independiente; una interfaz adaptada con los motivos de los cambios.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="480" height="1641" fill="white"/><rect x="24" y="26" width="402" height="222" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="62" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">ENTRADA</tspan></text>
<text x="48" y="95" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">Información sobre las</tspan></text>
<text x="48" y="120" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">características cognitivas</tspan></text>
<text x="48" y="164" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">La prueba de concepto también incluye</tspan><tspan x="48" dy="27">características sensoriales y físicas</tspan></text>
<text x="48" y="224" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Datos: perfiles ficticios</tspan></text>
<text x="24" y="284" font-size="23" font-weight="700" fill="#202020"><tspan x="24" dy="0">Conocimientos que utiliza la IA</tspan></text>
<rect x="24" y="329" width="402" height="266.75" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="365" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">Conocimientos A</tspan></text>
<text x="48" y="400" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">Principios y requisitos</tspan><tspan x="48" dy="33.75">básicos de interfaz</tspan></text>
<text x="48" y="476.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Coherencia · Respuesta · Agrupación</tspan></text>
<text x="48" y="510.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Seguridad · Accesibilidad</tspan></text>
<text x="48" y="544.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Cuándo se aplican los requisitos y</tspan><tspan x="48" dy="27">cómo verificarlos</tspan></text>
<rect x="24" y="631.75" width="402" height="329.5" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="667.75" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">Conocimientos B</tspan></text>
<text x="48" y="702.75" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">Recomendaciones de interfaz</tspan><tspan x="48" dy="33.75">según las características</tspan><tspan x="48" dy="33.75">humanas</tspan></text>
<text x="48" y="813.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Hallazgos científicos → Principios de</tspan><tspan x="48" dy="27">presentación</tspan></text>
<text x="48" y="872.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">→ Interfaces recomendadas</tspan></text>
<text x="48" y="910.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Separar hallazgos científicos de</tspan><tspan x="48" dy="27">decisiones de diseño</tspan></text>
<rect x="24" y="997.25" width="402" height="369.4000000000001" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="1033.25" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">PROCESO / GENERACIÓN Y</tspan><tspan x="48" dy="24.3">VALIDACIÓN</tspan></text>
<text x="48" y="1092.55" font-size="28" font-weight="700" fill="#202020"><tspan x="48" dy="0">IA generativa</tspan></text>
<text x="48" y="1139.55" font-size="22" font-weight="400" fill="#202020"><tspan x="48" dy="0">Proponer una interfaz con</tspan><tspan x="48" dy="29.7">información personal y</tspan><tspan x="48" dy="29.7">conocimientos de diseño</tspan></text>
<text x="48" y="1239.95" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Calcular los valores definidos por</tspan><tspan x="48" dy="27">fórmulas</tspan></text>
<text x="48" y="1310.95" font-size="22" font-weight="700" fill="#202020"><tspan x="48" dy="0">Etapa independiente: verificar los</tspan><tspan x="48" dy="29.7">requisitos</tspan></text>
<rect x="24" y="1402.65" width="402" height="172.04999999999995" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="1438.65" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">SALIDA</tspan></text>
<text x="48" y="1473.65" font-size="27" font-weight="700" fill="#202020"><tspan x="48" dy="0">Una interfaz adaptada</tspan></text>
<text x="48" y="1516.65" font-size="23" font-weight="700" fill="#202020"><tspan x="48" dy="0">+ Motivos y fundamentos de los</tspan><tspan x="48" dy="31.05">cambios</tspan></text>
