<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc"><title id="title">Configurar la interfaz antes del primer trayecto</title><desc id="desc">Concepto futuro. Cinco etapas: iniciar la configuración con el vehículo detenido, entrevista, comprobar la interpretación, propuesta y prueba, y comenzar el uso. Cada etapa muestra las acciones del usuario y la respuesta de la IA.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="1200" height="1220" fill="white"/><text x="40" y="55" font-size="33" font-weight="700" fill="#202020"><tspan x="40" dy="0">Configurar la interfaz antes del primer trayecto</tspan></text>
<text x="40" y="99" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">Concepto futuro / La configuración conversacional no está implementada en la prueba de concepto</tspan></text>
<text x="215" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="215" dy="0">Acciones y pensamientos del usuario</tspan></text>
<text x="697" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="697" dy="0">Respuestas de la IA y del sistema</tspan></text>
<rect x="40" y="190" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="225" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">01</tspan></text>
<text x="62" y="262" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Primer uso del</tspan><tspan x="62" dy="24.3">coche</tspan></text>
<text x="215" y="228" font-size="21.25" font-weight="400" fill="#202020"><tspan x="215" dy="0">Iniciar la configuración con el vehículo detenido</tspan></text>
<text x="215" y="276" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Me gustaría que esto fuera fácil de usar».</tspan></text>
<text x="697" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Explicar el propósito y preguntar si desea</tspan><tspan x="697" dy="29.7">empezar</tspan></text>
<text x="697" y="284" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Permitir que el usuario empiece más tarde</tspan></text>
<path d="M 85 339 V 356" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="360" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="395" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">02</tspan></text>
<text x="62" y="432" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Entrevista</tspan></text>
<text x="215" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Describir dificultades cotidianas</tspan></text>
<text x="215" y="446" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Olvido las instrucciones anteriores cuando</tspan><tspan x="215" dy="28.35">llegan las siguientes».</tspan></text>
<text x="697" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Preguntar por situaciones concretas</tspan></text>
<text x="697" y="454" font-size="20.5" font-weight="400" fill="#202020"><tspan x="697" dy="0">Identificar las exigencias de memoria y atención</tspan></text>
<path d="M 85 509 V 526" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="530" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="565" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">03</tspan></text>
<text x="62" y="602" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Comprobar la</tspan><tspan x="62" dy="24.3">interpretación</tspan></text>
<text x="215" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Confirmar o corregir la interpretación de la IA</tspan></text>
<text x="215" y="616" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Esta parte es correcta. Esa otra es diferente».</tspan></text>
<text x="697" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Resumir lo que ha dicho el usuario</tspan></text>
<text x="697" y="624" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Distinguir lo declarado por el usuario de las</tspan><tspan x="697" dy="28.35">mediciones</tspan></text>
<path d="M 85 679 V 696" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="700" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="735" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">04</tspan></text>
<text x="62" y="772" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Propuesta y</tspan><tspan x="62" dy="24.3">prueba</tspan></text>
<text x="215" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Probar la interfaz con el vehículo detenido</tspan></text>
<text x="215" y="786" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Me ayuda que la información permanezca en</tspan><tspan x="215" dy="28.35">pantalla».</tspan></text>
<text x="697" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Presentar la interfaz y los motivos de los</tspan><tspan x="697" dy="29.7">cambios</tspan></text>
<text x="697" y="794" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Permitir ajustes o restaurar la interfaz original</tspan></text>
<path d="M 85 849 V 866" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="870" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="905" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">05</tspan></text>
<text x="62" y="942" font-size="16.25" font-weight="700" fill="#202020"><tspan x="62" dy="0">Comenzar el uso</tspan></text>
<text x="215" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Comenzar a usar la interfaz confirmada</tspan></text>
<text x="215" y="956" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Probaré a empezar con esta configuración».</tspan></text>
<text x="697" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Guardar la interfaz inicial</tspan></text>
<text x="697" y="964" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Mantener su estructura básica durante la</tspan><tspan x="697" dy="28.35">conducción</tspan></text>
<text x="40" y="1103" font-size="25" font-weight="700" fill="#202020"><tspan x="40" dy="0">Convertir la conversación en información personal que el usuario pueda confirmar y corregir.</tspan></text>
<text x="40" y="1148" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">Separarla de las mediciones y diagnósticos cognitivos; evaluar otros aspectos según sea necesario.</tspan></text></svg>