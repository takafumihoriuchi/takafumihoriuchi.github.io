<text x="66" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">EINGABE</tspan></text>
<text x="66" y="579" font-size="25.5" font-weight="700" fill="#202020"><tspan x="66" dy="0">Angaben zu den</tspan><tspan x="66" dy="34.425000000000004">kognitiven Eigenschaften</tspan><tspan x="66" dy="34.425000000000004">der Person</tspan></text>
<text x="66" y="695.2" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Anforderungen an das Behalten</tspan><tspan x="66" dy="28.35">und Nutzen von Informationen</tspan></text>
<text x="66" y="758.5500000000001" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Aufmerksamkeit und</tspan><tspan x="66" dy="28.35">Verstehen von Erklärungen</tspan></text>
<text x="66" y="833.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">Im PoC auch: sensorische</tspan><tspan x="66" dy="27.0">und körperliche Merkmale</tspan></text>
<text x="66" y="894.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">Eingaben: fiktive Personas</tspan></text>
<text x="494" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="494" dy="0">ABLAUF / ERZEUGUNG UND PRÜFUNG</tspan></text>
<text x="494" y="580" font-size="30" font-weight="700" fill="#202020"><tspan x="494" dy="0">Generative KI</tspan></text>
<text x="494" y="632" font-size="23" font-weight="400" fill="#202020"><tspan x="494" dy="0">Individuelle Angaben mit</tspan><tspan x="494" dy="31.05">Gestaltungswissen verknüpfen,</tspan><tspan x="494" dy="31.05">um innerhalb der zulässigen Grenzen</tspan><tspan x="494" dy="31.05">eine Oberfläche vorzuschlagen</tspan></text>
<text x="494" y="774.15" font-size="21" font-weight="400" fill="#646464"><tspan x="494" dy="0">Durch Formeln festgelegte Werte berechnen</tspan></text>
<text x="682" y="819.15" font-size="28" font-weight="400" fill="#202020"><tspan x="682" dy="0">⇅</tspan></text>
<rect x="490" y="842.15" width="420" height="95" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="512" y="869.15" font-size="21" font-weight="700" fill="#202020"><tspan x="512" dy="0">Gesonderter Schritt: die festgelegten</tspan><tspan x="512" dy="28.35">Anforderungen prüfen</tspan></text>
<text x="1021" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="1021" dy="0">AUSGABE</tspan></text>
<text x="1021" y="579" font-size="28" font-weight="700" fill="#202020"><tspan x="1021" dy="0">Individuell angepasste</tspan><tspan x="1021" dy="37.800000000000004">Oberfläche</tspan></text>
<text x="1021" y="666" font-size="24" font-weight="700" fill="#202020"><tspan x="1021" dy="0">+ Gründe und Belege</tspan><tspan x="1021" dy="32.400000000000006">für die Änderungen</tspan></text>
