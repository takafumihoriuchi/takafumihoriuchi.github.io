<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc" lang="de"><title id="title">Individuelle Angaben und zwei Arten von Gestaltungswissen</title><desc id="desc">Konzeptdiagramm des vorgeschlagenen Systems. Kognitive Eigenschaften werden mit grundlegenden Regeln für die Oberfläche und Empfehlungen auf Basis menschlicher Eigenschaften verknüpft. Generative KI schlägt eine Oberfläche vor, die in einem gesonderten Schritt geprüft wird. Das Ergebnis umfasst die Oberfläche und die Gründe für die Änderungen.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="1400" height="1080" fill="white" /><text x="40" y="42" font-size="22" font-weight="700" fill="#202020"><tspan x="40" dy="0">Vom Designer aufbereitetes Wissen für die KI</tspan></text>
<rect x="40" y="65" width="635" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="705" y="65" width="655" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="66" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">Wissen A</tspan></text>
<text x="66" y="138" font-size="28" font-weight="700" fill="#202020"><tspan x="66" dy="0">Grundanforderungen an die Oberfläche</tspan></text>
<text x="66" y="188" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">Gestaltungsprinzipien</tspan></text>
<text x="66" y="214" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Konsistenz · Rückmeldung · Informationsgruppierung</tspan></text>
<text x="66" y="256" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">Anforderungen</tspan></text>
<text x="66" y="282" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Sicherheit · Barrierefreiheit · Bedienbeschränkungen</tspan></text>
<text x="66" y="323" font-size="19" font-weight="400" fill="#646464"><tspan x="66" dy="0">Geltungsbedingungen und Prüfverfahren festlegen</tspan></text>
<text x="731" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="731" dy="0">Wissen B</tspan></text>
<text x="731" y="138" font-size="26" font-weight="700" fill="#202020"><tspan x="731" dy="0">Empfehlungen für die Oberfläche</tspan><tspan x="731" dy="35.1">auf Basis menschlicher Eigenschaften</tspan></text>
<text x="731" y="211.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Forschung zu menschlichen Eigenschaften</tspan></text>
<text x="731" y="233.1" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="259.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Prinzipien der Informationsdarstellung</tspan></text>
<text x="731" y="283.1" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="307.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Empfehlungen für eine darauf abgestimmte Oberfläche</tspan></text>
<text x="731" y="399" font-size="19" font-weight="400" fill="#646464"><tspan x="731" dy="0">Forschungsergebnisse von Gestaltungsentscheidungen trennen</tspan></text>
