<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1641" viewBox="0 0 480 1641" role="img" aria-labelledby="title desc" lang="de"><title id="title">Eine Oberfläche aus individuellen Angaben erzeugen</title><desc id="desc">Konzeptdiagramm für Mobilgeräte, von oben nach unten zu lesen: individuelle Eingaben; Wissensbestände A und B; generative KI und gesonderte Prüfung; eine individuell angepasste Oberfläche mit Gründen für die Änderungen.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="480" height="1641" fill="white" /><rect x="24" y="26" width="402" height="222" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="62" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">EINGABE</tspan></text>
<text x="48" y="95" font-size="24" font-weight="700" fill="#202020"><tspan x="48" dy="0">Angaben zu den kognitiven</tspan></text>
<text x="48" y="126" font-size="24" font-weight="700" fill="#202020"><tspan x="48" dy="0">Eigenschaften der Person</tspan></text>
<text x="48" y="164" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Der PoC berücksichtigt auch</tspan><tspan x="48" dy="27.0">sensorische und körperliche Merkmale</tspan></text>
<text x="48" y="224" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Eingaben: fiktive Personas</tspan></text>
<text x="24" y="284" font-size="23" font-weight="700" fill="#202020"><tspan x="24" dy="0">Wissen für die KI</tspan></text>
<rect x="24" y="329" width="402" height="266.75" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="365" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">Wissen A</tspan></text>
<text x="48" y="400" font-size="23.5" font-weight="700" fill="#202020"><tspan x="48" dy="0">Grundprinzipien der Oberfläche</tspan><tspan x="48" dy="31.725">und Anforderungen</tspan></text>
<text x="48" y="476.75" font-size="19" font-weight="400" fill="#202020"><tspan x="48" dy="0">Konsistenz · Rückmeldung · Gruppierung</tspan></text>
<text x="48" y="510.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Sicherheit · Barrierefreiheit</tspan></text>
<text x="48" y="544.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Wann Anforderungen gelten und</tspan><tspan x="48" dy="27.0">wie sie zu prüfen sind</tspan></text>
<rect x="24" y="631.75" width="402" height="329.5" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="667.75" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">Wissen B</tspan></text>
<text x="48" y="702.75" font-size="24" font-weight="700" fill="#202020"><tspan x="48" dy="0">Empfehlungen für Oberflächen</tspan><tspan x="48" dy="32.400000000000006">auf Basis menschlicher</tspan><tspan x="48" dy="32.400000000000006">Eigenschaften</tspan></text>
<text x="48" y="813.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Forschungsergebnisse → Prinzipien</tspan><tspan x="48" dy="27.0">der Darstellung</tspan></text>
<text x="48" y="872.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">→ Empfohlene Oberflächen</tspan></text>
<text x="48" y="910.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Forschungsergebnisse und</tspan><tspan x="48" dy="27.0">Gestaltungsentscheidungen trennen</tspan></text>
<rect x="24" y="997.25" width="402" height="369.4000000000001" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="1033.25" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">ABLAUF / ERZEUGUNG UND</tspan><tspan x="48" dy="24.3">PRÜFUNG</tspan></text>
<text x="48" y="1092.55" font-size="28" font-weight="700" fill="#202020"><tspan x="48" dy="0">Generative KI</tspan></text>
<text x="48" y="1139.55" font-size="22" font-weight="400" fill="#202020"><tspan x="48" dy="0">Mit individuellen Angaben und</tspan><tspan x="48" dy="29.700000000000003">Gestaltungswissen eine</tspan><tspan x="48" dy="29.700000000000003">Oberfläche vorschlagen</tspan></text>
<text x="48" y="1239.95" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Durch Formeln festgelegte</tspan><tspan x="48" dy="27.0">Werte berechnen</tspan></text>
<text x="48" y="1310.95" font-size="22" font-weight="700" fill="#202020"><tspan x="48" dy="0">Gesonderter Schritt:</tspan><tspan x="48" dy="29.700000000000003">Anforderungen prüfen</tspan></text>
<rect x="24" y="1402.65" width="402" height="172.04999999999995" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="1438.65" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">AUSGABE</tspan></text>
<text x="48" y="1468" font-size="23" font-weight="700" fill="#202020"><tspan x="48" dy="0">Individuell angepasste</tspan><tspan x="48" dy="31.05">Oberfläche</tspan></text>
<text x="48" y="1530" font-size="23" font-weight="700" fill="#202020"><tspan x="48" dy="0">+ Gründe und Belege</tspan><tspan x="48" dy="31.05">für die Änderungen</tspan></text>
