<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc" lang="de"><title id="title">Die Oberfläche vor der ersten Fahrt einrichten</title><desc id="desc">Zukunftskonzept mit fünf Phasen: Einrichtung im stehenden Fahrzeug beginnen, Gespräch, Verständnis prüfen, Vorschlag und Erprobung, Nutzung beginnen. Jede Phase zeigt die Handlungen der nutzenden Person und die Reaktion der KI.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="1200" height="1220" fill="white" /><text x="40" y="55" font-size="33" font-weight="700" fill="#202020"><tspan x="40" dy="0">Die Oberfläche vor der ersten Fahrt einrichten</tspan></text>
<text x="40" y="99" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">Zukunftskonzept / Die Einrichtung im Dialog ist im PoC nicht umgesetzt</tspan></text>
<text x="215" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="215" dy="0">Handlungen und Gedanken der Person</tspan></text>
<text x="697" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="697" dy="0">Reaktionen von KI und System</tspan></text>
<rect x="40" y="190" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="225" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">01</tspan></text>
<text x="62" y="262" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Erstmals</tspan><tspan x="62" dy="24.3">im Fahrzeug</tspan></text>
<text x="215" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Einrichtung im stehenden Fahrzeug starten</tspan></text>
<text x="215" y="276" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">„Ich möchte es einfach bedienen können.“</tspan></text>
<text x="697" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Zweck erklären und fragen,</tspan><tspan x="697" dy="29.700000000000003">ob die Einrichtung beginnen soll</tspan></text>
<text x="697" y="284" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Einen späteren Start ermöglichen</tspan></text>
<path d="M 85 339 V 356" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="360" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="395" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">02</tspan></text>
<text x="62" y="432" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Gespräch</tspan></text>
<text x="215" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Schwierigkeiten im Alltag schildern</tspan></text>
<text x="215" y="446" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">„Bei neuen Anweisungen vergesse ich</tspan><tspan x="215" dy="28.35">die vorherigen.“</tspan></text>
<text x="697" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Nach konkreten Situationen fragen</tspan></text>
<text x="697" y="454" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Anforderungen an Gedächtnis</tspan><tspan x="697" dy="28.35">und Aufmerksamkeit erfassen</tspan></text>
<path d="M 85 509 V 526" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="530" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="565" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">03</tspan></text>
<text x="62" y="602" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Verständnis</tspan><tspan x="62" dy="24.3">prüfen</tspan></text>
<text x="215" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Deutung der KI bestätigen oder korrigieren</tspan></text>
<text x="215" y="616" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">„Das hier stimmt. Dort ist es anders.“</tspan></text>
<text x="697" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Aussagen der Person zusammenfassen</tspan></text>
<text x="697" y="624" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Selbstauskünfte und Messungen</tspan><tspan x="697" dy="28.35">getrennt halten</tspan></text>
<path d="M 85 679 V 696" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="700" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="735" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">04</tspan></text>
<text x="62" y="772" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Vorschlag und</tspan><tspan x="62" dy="24.3">Erprobung</tspan></text>
<text x="215" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Oberfläche im stehenden Fahrzeug testen</tspan></text>
<text x="215" y="786" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">„Es hilft, wenn die Informationen</tspan><tspan x="215" dy="28.35">auf dem Bildschirm bleiben.“</tspan></text>
<text x="697" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Oberfläche vorstellen und</tspan><tspan x="697" dy="29.700000000000003">die Änderungen begründen</tspan></text>
<text x="697" y="794" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Anpassungen oder die Wiederherstellung</tspan><tspan x="697" dy="28.35">der ursprünglichen Oberfläche ermöglichen</tspan></text>
<path d="M 85 849 V 866" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="870" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="905" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">05</tspan></text>
<text x="62" y="942" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Nutzung</tspan><tspan x="62" dy="24.3">beginnen</tspan></text>
<text x="215" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Die bestätigte Oberfläche nutzen</tspan></text>
<text x="215" y="956" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">„Ich probiere es erst einmal damit.“</tspan></text>
<text x="697" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Anfängliche Oberfläche speichern</tspan></text>
<text x="697" y="964" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Grundstruktur während der Fahrt</tspan><tspan x="697" dy="28.35">unverändert lassen</tspan></text>
<text x="40" y="1103" font-size="25" font-weight="700" fill="#202020"><tspan x="40" dy="0">Das Gespräch liefert individuelle Angaben, die die Person bestätigen und korrigieren kann.</tspan></text>
<text x="40" y="1148" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">Von kognitiven Messungen und Diagnosen trennen; weitere Aspekte bei Bedarf erfassen.</tspan></text></svg>