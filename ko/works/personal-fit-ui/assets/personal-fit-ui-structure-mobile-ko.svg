<svg xml:lang="ko" xmlns="http://www.w3.org/2000/svg" width="480" height="1641" viewBox="0 0 480 1641" role="img" aria-labelledby="title desc"><title id="title">개인 정보로 인터페이스 생성하기</title><desc id="desc">위에서 아래로 읽는 모바일 개념도. 개인 입력, 지식 A와 B, 생성형 AI와 별도 검증, 개인에게 맞춘 인터페이스와 변경 이유의 순서다.</desc><style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="480" height="1641" fill="white"/><rect x="24" y="26" width="402" height="222" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="62" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">입력</tspan></text>
<text x="48" y="95" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">사용자의</tspan></text>
<text x="48" y="120" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">인지 특성에 관한 정보</tspan></text>
<text x="48" y="164" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">PoC에는 감각·신체</tspan><tspan x="48" dy="27">특성도 포함</tspan></text>
<text x="48" y="224" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">입력: 가상 페르소나</tspan></text>
<text x="24" y="284" font-size="23" font-weight="700" fill="#202020"><tspan x="24" dy="0">AI가 참조하는 지식</tspan></text>
<rect x="24" y="329" width="402" height="266.75" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="365" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">지식 A</tspan></text>
<text x="48" y="400" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">인터페이스의</tspan><tspan x="48" dy="33.75">기본 원칙과 요구사항</tspan></text>
<text x="48" y="476.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">일관성 · 피드백 · 정보 묶기</tspan></text>
<text x="48" y="510.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">안전성 · 접근성</tspan></text>
<text x="48" y="544.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">요구사항의 적용 상황과</tspan><tspan x="48" dy="27">검사 방법</tspan></text>
<rect x="24" y="631.75" width="402" height="329.5" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="667.75" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">지식 B</tspan></text>
<text x="48" y="702.75" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">사람의 특성에 따른</tspan><tspan x="48" dy="33.75">인터페이스 권장사항</tspan></text>
<text x="48" y="813.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">연구 결과 → 정보 제시 원칙</tspan></text>
<text x="48" y="872.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">→ 인터페이스 권장사항</tspan></text>
<text x="48" y="910.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">연구 결과와 설계 판단 구분</tspan></text>
<rect x="24" y="997.25" width="402" height="369.4000000000001" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="1033.25" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">처리 / 생성과 검증</tspan></text>
<text x="48" y="1092.55" font-size="28" font-weight="700" fill="#202020"><tspan x="48" dy="0">생성형 AI</tspan></text>
<text x="48" y="1139.55" font-size="22" font-weight="400" fill="#202020"><tspan x="48" dy="0">개인 정보와 설계 지식으로</tspan><tspan x="48" dy="29.7">인터페이스 제안</tspan></text>
<text x="48" y="1239.95" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">수식으로 정해지는 값은 계산</tspan></text>
<text x="48" y="1310.95" font-size="22" font-weight="700" fill="#202020"><tspan x="48" dy="0">별도 단계: 요구사항 검사</tspan></text>
<rect x="24" y="1402.65" width="402" height="172.04999999999995" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="1438.65" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">출력</tspan></text>
<text x="48" y="1473.65" font-size="27" font-weight="700" fill="#202020"><tspan x="48" dy="0">개인에게 맞춘 UI</tspan></text>
<text x="48" y="1516.65" font-size="23" font-weight="700" fill="#202020"><tspan x="48" dy="0">+ 변경 이유와 근거</tspan></text>
<path d="M 426 111 H 458 V 1092.25 H 434" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 24 404 H 10 V 977.25 H 160 V 990.25" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 226 961.25 V 990.25" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 226 1366.65 V 1395.65" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="24" y="1610.7" font-size="18" font-weight="400" fill="#646464"><tspan x="24" dy="0">실선: 처리 흐름 · 점선: 지식 참조</tspan></text></svg>