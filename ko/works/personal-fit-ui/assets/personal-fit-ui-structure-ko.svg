<svg xml:lang="ko" xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc"><title id="title">개인 정보와 두 종류의 설계 지식</title><desc id="desc">인지 특성, 기본 인터페이스 규칙, 사람의 특성에 따른 권장사항을 결합한다. 생성형 AI가 인터페이스를 제안하고 별도 단계에서 검증한다. 출력에는 인터페이스와 변경 이유가 포함된다.</desc><style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="1400" height="1080" fill="white"/><text x="40" y="42" font-size="22" font-weight="700" fill="#202020"><tspan x="40" dy="0">설계자가 준비하고 AI가 참조하는 지식</tspan></text>
<rect x="40" y="65" width="635" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="705" y="65" width="655" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="66" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">지식 A</tspan></text>
<text x="66" y="138" font-size="28" font-weight="700" fill="#202020"><tspan x="66" dy="0">인터페이스의 기본 요구사항</tspan></text>
<text x="66" y="188" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">설계 원칙</tspan></text>
<text x="66" y="214" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">일관성 · 피드백 · 정보 묶기</tspan></text>
<text x="66" y="256" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">요구사항</tspan></text>
<text x="66" y="282" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">안전성 · 접근성 · 조작 제한</tspan></text>
<text x="66" y="323" font-size="19" font-weight="400" fill="#646464"><tspan x="66" dy="0">적용 상황과 검사 방법 정의</tspan></text>
<text x="731" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="731" dy="0">지식 B</tspan></text>
<text x="731" y="138" font-size="26" font-weight="700" fill="#202020"><tspan x="731" dy="0">사람의 특성에 따른</tspan><tspan x="731" dy="35.1">인터페이스 권장사항</tspan></text>
<text x="731" y="211.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">사람의 특성에 관한 연구</tspan></text>
<text x="731" y="244" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="275" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">정보 제시 원칙</tspan></text>
<text x="731" y="308" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="339" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">특성에 맞는 인터페이스 권장사항</tspan></text>
<text x="731" y="399" font-size="19" font-weight="400" fill="#646464"><tspan x="731" dy="0">연구 결과와 설계 판단 구분</tspan></text>
<rect x="40" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="468" y="500" width="464" height="490" rx="12" fill="#fff" stroke="#303030" stroke-width="1.5"/>
<rect x="995" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5"/>
<path d="M 357 425 V 462 H 600 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 1032 425 V 462 H 800 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 408 725 H 458" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 935 725 H 985" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="66" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">입력</tspan></text>
<text x="66" y="579" font-size="26" font-weight="700" fill="#202020"><tspan x="66" dy="0">사용자의</tspan><tspan x="66" dy="35.1">인지 특성에</tspan><tspan x="66" dy="35.1">관한 정보</tspan></text>
<text x="66" y="695.2" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">정보를 기억하고</tspan><tspan x="66" dy="28.35">활용하는 데 드는 부담</tspan></text>
<text x="66" y="758.5500000000001" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">주의와 설명의 이해</tspan></text>
<text x="66" y="833.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">PoC에는 감각·신체</tspan><tspan x="66" dy="27">특성도 포함</tspan></text>
<text x="66" y="894.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">입력: 가상 페르소나</tspan></text>
<text x="494" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="494" dy="0">처리 / 생성과 검증</tspan></text>
<text x="494" y="580" font-size="30" font-weight="700" fill="#202020"><tspan x="494" dy="0">생성형 AI</tspan></text>
<text x="494" y="632" font-size="23" font-weight="400" fill="#202020"><tspan x="494" dy="0">개인 정보와 설계 지식을</tspan><tspan x="494" dy="31.05">결합해 허용된 범위에서</tspan><tspan x="494" dy="31.05">인터페이스 제안</tspan></text>
<text x="494" y="774.15" font-size="21" font-weight="400" fill="#646464"><tspan x="494" dy="0">수식으로 정해지는 값은 계산</tspan></text>
<text x="682" y="819.15" font-size="28" font-weight="400" fill="#202020"><tspan x="682" dy="0">⇅</tspan></text>
<rect x="490" y="842.15" width="420" height="95" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="512" y="869.15" font-size="21" font-weight="700" fill="#202020"><tspan x="512" dy="0">별도 단계: 정의한</tspan><tspan x="512" dy="28.35">요구사항 검사</tspan></text>
<text x="1021" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="1021" dy="0">출력</tspan></text>
<text x="1021" y="579" font-size="28" font-weight="700" fill="#202020"><tspan x="1021" dy="0">개인에게 맞춘 UI</tspan></text>
<text x="1021" y="629" font-size="24" font-weight="700" fill="#202020"><tspan x="1021" dy="0">+ 변경 이유와 근거</tspan></text>
<rect x="1021" y="730.4" width="311" height="102" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1035" y="744.4" width="90" height="72" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1140" y="744.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1140" y="770.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1140" y="796.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="1021" y="873.4" font-size="20" font-weight="400" fill="#646464"><tspan x="1021" dy="0">배치 · 정보 제시 ·</tspan><tspan x="1021" dy="27">표현 구체화</tspan></text>
<path d="M 40 1038 H 86" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="103" y="1045" font-size="19" font-weight="400" fill="#202020"><tspan x="103" dy="0">처리 흐름</tspan></text>
<path d="M 310 1038 H 356" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="374" y="1045" font-size="19" font-weight="400" fill="#202020"><tspan x="374" dy="0">지식 참조</tspan></text></svg>