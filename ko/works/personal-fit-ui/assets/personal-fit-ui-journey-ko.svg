<svg xml:lang="ko" xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc"><title id="title">첫 운전 전 인터페이스 설정</title><desc id="desc">미래 구상. 정차 중 설정 시작, 인터뷰, 이해 확인, 제안과 시험 사용, 이용 시작의 다섯 단계에서 사용자 행동과 AI 반응을 보여 준다.</desc><style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="1200" height="1220" fill="white"/><text x="40" y="55" font-size="33" font-weight="700" fill="#202020"><tspan x="40" dy="0">첫 운전 전 인터페이스 설정</tspan></text>
<text x="40" y="99" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">미래 구상 / 대화형 설정은 PoC에 미구현</tspan></text>
<text x="215" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="215" dy="0">사용자의 행동과 생각</tspan></text>
<text x="697" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="697" dy="0">AI와 시스템의 반응</tspan></text>
<rect x="40" y="190" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="225" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">01</tspan></text>
<text x="62" y="262" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">첫 승차</tspan></text>
<text x="215" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">정차 중 설정 시작</tspan></text>
<text x="215" y="276" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“쓰기 편하게 맞추고 싶어요.”</tspan></text>
<text x="697" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">목적을 설명하고 시작 여부 확인</tspan></text>
<text x="697" y="284" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">나중에 시작할 수도 있음</tspan></text>
<path d="M 85 339 V 356" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="40" y="360" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="395" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">02</tspan></text>
<text x="62" y="432" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">인터뷰</tspan></text>
<text x="215" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">평소 불편한 점 설명</tspan></text>
<text x="215" y="446" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“다음 안내가 나오면</tspan><tspan x="215" dy="28.35">이전 내용을 잊어버려요.”</tspan></text>
<text x="697" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">구체적인 상황 질문</tspan></text>
<text x="697" y="454" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">기억과 주의에 드는 부담 파악</tspan></text>
<path d="M 85 509 V 526" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="40" y="530" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="565" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">03</tspan></text>
<text x="62" y="602" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">이해 확인</tspan></text>
<text x="215" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">AI의 해석을 확인하거나 수정</tspan></text>
<text x="215" y="616" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“여기는 맞고, 여기는 달라요.”</tspan></text>
<text x="697" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">사용자가 말한 내용 요약</tspan></text>
<text x="697" y="624" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">자기 보고와 측정값 구분</tspan></text>
<path d="M 85 679 V 696" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="40" y="700" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="735" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">04</tspan></text>
<text x="62" y="772" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">제안과</tspan><tspan x="62" dy="24.3">시험 사용</tspan></text>
<text x="215" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">정차 중 인터페이스 사용</tspan></text>
<text x="215" y="786" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“정보가 화면에 남아</tspan><tspan x="215" dy="28.35">있으면 편해요.”</tspan></text>
<text x="697" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">인터페이스와 변경 이유 제시</tspan></text>
<text x="697" y="794" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">조정하거나 원래 UI로 복원</tspan></text>
<path d="M 85 849 V 866" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="40" y="870" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="905" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">05</tspan></text>
<text x="62" y="942" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">이용 시작</tspan></text>
<text x="215" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">확인한 인터페이스 사용 시작</tspan></text>
<text x="215" y="956" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“이 설정으로 시작해 볼게요.”</tspan></text>
<text x="697" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">초기 인터페이스 저장</tspan></text>
<text x="697" y="964" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">주행 중에는 기본 구성 유지</tspan></text>
<text x="40" y="1103" font-size="25" font-weight="700" fill="#202020"><tspan x="40" dy="0">대화를 사용자가 확인하고 바로잡을 수 있는 개인 정보로 정리한다.</tspan></text>
<text x="40" y="1148" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">인지 기능의 측정값·진단과 구분하고, 다른 항목은 필요에 따라 별도로 평가한다.</tspan></text></svg>