<path d="M 226 1366.65 V 1395.65" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<text x="24" y="1610.7" font-size="18" font-weight="400" fill="#646464"><tspan x="24" dy="0">实线：处理流程 · 虚线：知识参照</tspan></text></svg>