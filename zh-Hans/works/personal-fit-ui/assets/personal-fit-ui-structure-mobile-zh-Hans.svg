<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1641" viewBox="0 0 480 1641" role="img" aria-labelledby="title desc" xml:lang="zh-Hans"><title id="title">由个人信息生成界面</title><desc id="desc">移动端概念图，从上到下依次为个人输入、知识 A 与 B、生成式 AI 与独立核查、定制界面及变更理由。</desc><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="480" height="1641" fill="white"/><rect x="24" y="26" width="402" height="222" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="62" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">输入</tspan></text>
<text x="48" y="95" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">使用者的</tspan></text>
<text x="48" y="120" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">认知特性信息</tspan></text>
<text x="48" y="164" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">本 PoC 也包含感官与身体特性</tspan></text>
<text x="48" y="224" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">输入：虚构人物画像</tspan></text>
<text x="24" y="284" font-size="23" font-weight="700" fill="#202020"><tspan x="24" dy="0">供 AI 参照的知识</tspan></text>
<rect x="24" y="329" width="402" height="266.75" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="365" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">知识 A</tspan></text>
<text x="48" y="400" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">界面的基本原则与要求</tspan></text>
<text x="48" y="476.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">一致性 · 操作反馈 · 信息分组</tspan></text>
<text x="48" y="510.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">安全性 · 无障碍</tspan></text>
<text x="48" y="544.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">要求的适用条件与检查方法</tspan></text>
<rect x="24" y="631.75" width="402" height="329.5" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="667.75" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">知识 B</tspan></text>
<text x="48" y="702.75" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">基于个人特性的</tspan><tspan x="48" dy="33.75">界面设计建议</tspan></text>
<text x="48" y="813.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">研究结论 → 信息呈现原则</tspan></text>
<text x="48" y="872.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">→ 界面设计建议</tspan></text>
<text x="48" y="910.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">区分研究结论与设计判断</tspan></text>
<rect x="24" y="997.25" width="402" height="369.4000000000001" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="1033.25" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">处理：生成与核查</tspan></text>
<text x="48" y="1092.55" font-size="28" font-weight="700" fill="#202020"><tspan x="48" dy="0">生成式 AI</tspan></text>
<text x="48" y="1139.55" font-size="22" font-weight="400" fill="#202020"><tspan x="48" dy="0">结合个人信息与设计知识，</tspan><tspan x="48" dy="29.700000000000003">提出界面方案</tspan></text>
<text x="48" y="1239.95" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">由公式确定的值直接计算</tspan></text>
<text x="48" y="1310.95" font-size="22" font-weight="700" fill="#202020"><tspan x="48" dy="0">独立步骤：核查要求</tspan></text>
<rect x="24" y="1402.65" width="402" height="172.04999999999995" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="1438.65" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">输出</tspan></text>
<text x="48" y="1473.65" font-size="27" font-weight="700" fill="#202020"><tspan x="48" dy="0">适合该人物画像的界面</tspan></text>
<text x="48" y="1516.65" font-size="23" font-weight="700" fill="#202020"><tspan x="48" dy="0">＋ 变更理由与依据</tspan></text>
