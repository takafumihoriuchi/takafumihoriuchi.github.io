<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc" xml:lang="zh-Hans"><title id="title">首次驾驶前，设置适合自己的界面</title><desc id="desc">未来构想，包含五个阶段：停车时开始设置、访谈、确认理解、方案与试用、开始使用。每一阶段分别呈现使用者的行动与 AI 的响应。</desc><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="1200" height="1220" fill="white"/><text x="40" y="55" font-size="33" font-weight="700" fill="#202020"><tspan x="40" dy="0">首次驾驶前，设置适合自己的界面</tspan></text>
<text x="40" y="99" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">未来构想／通过对话完成初始设置，尚未在本 PoC 中实现</tspan></text>
<text x="215" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="215" dy="0">使用者的行动与想法</tspan></text>
<text x="697" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="697" dy="0">AI 与系统的响应</tspan></text>
<rect x="40" y="190" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="225" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">01</tspan></text>
<text x="62" y="262" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">初次上车</tspan></text>
<text x="215" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">停车时开始设置</tspan></text>
<text x="215" y="276" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“我想先把它调到用着顺手。”</tspan></text>
<text x="697" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">解释目的，询问是否开始</tspan></text>
<text x="697" y="284" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">允许使用者稍后再开始</tspan></text>
<path d="M 85 339 V 356" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="360" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="395" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">02</tspan></text>
<text x="62" y="432" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">访谈</tspan></text>
<text x="215" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">描述日常使用困难</tspan></text>
<text x="215" y="446" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“新提示来了，我就忘了上一条。”</tspan></text>
<text x="697" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">询问具体情境</tspan></text>
<text x="697" y="454" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">梳理记忆与注意力方面的负担</tspan></text>
<path d="M 85 509 V 526" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="530" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="565" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">03</tspan></text>
<text x="62" y="602" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">确认理解</tspan></text>
<text x="215" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">确认或纠正 AI 的理解</tspan></text>
<text x="215" y="616" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“这一点对，但那一点不一样。”</tspan></text>
<text x="697" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">复述使用者表达的内容</tspan></text>
<text x="697" y="624" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">将自述与测量结果分开处理</tspan></text>
<path d="M 85 679 V 696" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="700" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="735" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">04</tspan></text>
<text x="62" y="772" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">方案与试用</tspan></text>
<text x="215" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">停车时试用界面</tspan></text>
<text x="215" y="786" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“信息留在屏幕上会有帮助。”</tspan></text>
<text x="697" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">呈现界面与变更理由</tspan></text>
<text x="697" y="794" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">允许调整，或恢复原界面</tspan></text>
<path d="M 85 849 V 866" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="870" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="905" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">05</tspan></text>
<text x="62" y="942" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">开始使用</tspan></text>
<text x="215" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">开始使用已确认的界面</tspan></text>
<text x="215" y="956" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“我就先从这个设置开始试试。”</tspan></text>
<text x="697" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">保存初始界面</tspan></text>
<text x="697" y="964" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">行驶时保持基本结构一致</tspan></text>
<text x="40" y="1103" font-size="25" font-weight="700" fill="#202020"><tspan x="40" dy="0">将对话整理为使用者能够确认、纠正的个人信息。</tspan></text>
<text x="40" y="1148" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">与认知功能测量和诊断分开处理；需要确认的其他项目另行评估。</tspan></text></svg>