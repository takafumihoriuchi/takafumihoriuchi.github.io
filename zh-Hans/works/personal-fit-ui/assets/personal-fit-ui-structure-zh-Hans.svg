<text x="66" y="579" font-size="26" font-weight="700" fill="#202020"><tspan x="66" dy="0">使用者的</tspan><tspan x="66" dy="35.1">认知特性信息</tspan></text>
<text x="66" y="695.2" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">保持和使用信息</tspan><tspan x="66" dy="28.35">所需的负担</tspan></text>
<text x="66" y="758.5500000000001" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">注意力分配</tspan><tspan x="66" dy="28.35">与说明理解</tspan></text>
<text x="66" y="833.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">本 PoC 也包含感官</tspan><tspan x="66" dy="27.0">与身体特性</tspan></text>
<text x="66" y="894.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">输入：虚构人物画像</tspan></text>
