<text x="494" y="580" font-size="30" font-weight="700" fill="#202020"><tspan x="494" dy="0">生成式 AI</tspan></text>
<text x="494" y="632" font-size="23" font-weight="400" fill="#202020"><tspan x="494" dy="0">结合个人信息与设计知识，</tspan><tspan x="494" dy="31.05">在允许的范围内</tspan><tspan x="494" dy="31.05">提出界面方案</tspan></text>
<text x="494" y="774.15" font-size="21" font-weight="400" fill="#646464"><tspan x="494" dy="0">由公式确定的值直接计算</tspan></text>
