<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc" xml:lang="zh-Hans"><title id="title">个人信息与两类设计知识</title><desc id="desc">系统概念图：将认知特性与界面基本规则、基于个人特性的设计建议结合。生成式 AI 提出界面方案，独立步骤核查要求，输出定制界面及变更理由。</desc><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="1400" height="1080" fill="white"/><text x="40" y="42" font-size="22" font-weight="700" fill="#202020"><tspan x="40" dy="0">设计者预先整理，供 AI 参照的知识</tspan></text>
<rect x="40" y="65" width="635" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="705" y="65" width="655" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="66" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">知识 A</tspan></text>
<text x="66" y="138" font-size="28" font-weight="700" fill="#202020"><tspan x="66" dy="0">界面的基本要求</tspan></text>
<text x="66" y="188" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">设计原则</tspan></text>
<text x="66" y="214" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">一致性 · 操作反馈 · 信息分组</tspan></text>
<text x="66" y="256" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">必须满足的要求</tspan></text>
<text x="66" y="282" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">安全性 · 无障碍 · 操作限制</tspan></text>
<text x="66" y="323" font-size="19" font-weight="400" fill="#646464"><tspan x="66" dy="0">定义要求的适用条件与检查方法</tspan></text>
<text x="731" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="731" dy="0">知识 B</tspan></text>
<text x="731" y="138" font-size="26" font-weight="700" fill="#202020"><tspan x="731" dy="0">基于个人特性的界面设计建议</tspan></text>
<text x="731" y="211.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">关于个人特性的研究</tspan></text>
<text x="731" y="233.1" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="253.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">信息呈现原则</tspan></text>
<text x="731" y="275.1" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="295.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">适应该类特性的界面建议</tspan></text>
<text x="731" y="399" font-size="19" font-weight="400" fill="#646464"><tspan x="731" dy="0">区分研究结论与设计判断</tspan></text>
