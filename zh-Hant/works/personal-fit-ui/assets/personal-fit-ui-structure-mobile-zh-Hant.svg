<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1641" viewBox="0 0 480 1641" role="img" aria-labelledby="title desc" xml:lang="zh-Hant"><title id="title">根據個人資訊生成介面</title><desc id="desc">行動版概念圖，由上至下依序為個人輸入、知識 A 與 B、生成式 AI 與獨立檢查，以及個人化介面與變更理由。</desc><style>text{font-family:Arial,"PingFang TC","Microsoft JhengHei",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="480" height="1641" fill="white"/><rect x="24" y="26" width="402" height="222" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="62" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">輸入</tspan></text>
<text x="48" y="95" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">使用者的</tspan></text>
<text x="48" y="120" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">認知特質資訊</tspan></text>
<text x="48" y="164" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">本 PoC 也涵蓋感官與身體特質</tspan></text>
<text x="48" y="224" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">輸入：虛構人物誌</tspan></text>
<text x="24" y="284" font-size="23" font-weight="700" fill="#202020"><tspan x="24" dy="0">供 AI 參照的知識</tspan></text>
<rect x="24" y="329" width="402" height="266.75" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="365" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">知識 A</tspan></text>
<text x="48" y="400" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">介面的基本原則與需求</tspan></text>
<text x="48" y="476.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">一致性・操作回饋・資訊分組</tspan></text>
<text x="48" y="510.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">安全性・無障礙</tspan></text>
<text x="48" y="544.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">需求的適用條件與檢查方式</tspan></text>
<rect x="24" y="631.75" width="402" height="329.5" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="667.75" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">知識 B</tspan></text>
<text x="48" y="702.75" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">根據個人特質</tspan><tspan x="48" dy="33.75">提出介面建議</tspan></text>
<text x="48" y="813.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">研究證據 → 資訊呈現原則</tspan></text>
<text x="48" y="872.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">→ 介面設計建議</tspan></text>
<text x="48" y="910.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">區分研究證據與設計判斷</tspan></text>
<rect x="24" y="997.25" width="402" height="369.4000000000001" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="1033.25" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">處理：生成與檢查</tspan></text>
<text x="48" y="1092.55" font-size="28" font-weight="700" fill="#202020"><tspan x="48" dy="0">生成式 AI</tspan></text>
<text x="48" y="1139.55" font-size="22" font-weight="400" fill="#202020"><tspan x="48" dy="0">結合個人資訊與設計知識，</tspan><tspan x="48" dy="29.700000000000003">提出介面方案</tspan></text>
<text x="48" y="1239.95" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">可由公式確定的值直接計算</tspan></text>
<text x="48" y="1310.95" font-size="22" font-weight="700" fill="#202020"><tspan x="48" dy="0">獨立步驟：檢查需求</tspan></text>
<rect x="24" y="1402.65" width="402" height="172.04999999999995" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="1438.65" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">輸出</tspan></text>
<text x="48" y="1473.65" font-size="27" font-weight="700" fill="#202020"><tspan x="48" dy="0">適合該人物誌的介面</tspan></text>
<text x="48" y="1516.65" font-size="23" font-weight="700" fill="#202020"><tspan x="48" dy="0">＋ 變更理由與依據</tspan></text>
<path d="M 426 111 H 458 V 1092.25 H 434" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 24 404 H 10 V 977.25 H 160 V 990.25" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 226 961.25 V 990.25" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 226 1366.65 V 1395.65" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<text x="24" y="1610.7" font-size="18" font-weight="400" fill="#646464"><tspan x="24" dy="0">實線：處理流程・虛線：知識參照</tspan></text></svg>