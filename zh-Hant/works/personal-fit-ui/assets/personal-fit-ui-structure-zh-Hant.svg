<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc" xml:lang="zh-Hant"><title id="title">個人資訊與兩類設計知識</title><desc id="desc">系統概念圖：結合認知特質、介面基本規則與根據特質提出的設計建議。生成式 AI 提出介面，獨立步驟檢查需求，輸出個人化介面與變更理由。</desc><style>text{font-family:Arial,"PingFang TC","Microsoft JhengHei",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="1400" height="1080" fill="white"/><text x="40" y="42" font-size="22" font-weight="700" fill="#202020"><tspan x="40" dy="0">由設計者預先準備，供 AI 參照的知識</tspan></text>
<rect x="40" y="65" width="635" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="705" y="65" width="655" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="66" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">知識 A</tspan></text>
<text x="66" y="138" font-size="28" font-weight="700" fill="#202020"><tspan x="66" dy="0">介面的基本需求</tspan></text>
<text x="66" y="188" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">設計原則</tspan></text>
<text x="66" y="214" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">一致性・操作回饋・資訊分組</tspan></text>
<text x="66" y="256" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">必須滿足的需求</tspan></text>
<text x="66" y="282" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">安全性・無障礙・操作限制</tspan></text>
<text x="66" y="323" font-size="19" font-weight="400" fill="#646464"><tspan x="66" dy="0">定義適用條件與檢查方式</tspan></text>
<text x="731" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="731" dy="0">知識 B</tspan></text>
<text x="731" y="138" font-size="26" font-weight="700" fill="#202020"><tspan x="731" dy="0">根據個人特質提出介面建議</tspan></text>
<text x="731" y="211.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">對人類特質的研究</tspan></text>
<text x="731" y="233.1" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="253.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">資訊呈現原則</tspan></text>
<text x="731" y="275.1" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="295.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">適合該特質的介面建議</tspan></text>
<text x="731" y="399" font-size="19" font-weight="400" fill="#646464"><tspan x="731" dy="0">區分研究證據與設計判斷</tspan></text>
<rect x="40" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="468" y="500" width="464" height="490" rx="12" fill="#fff" stroke="#303030" stroke-width="1.5"/>
<rect x="995" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5"/>
<path d="M 357 425 V 462 H 600 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 1032 425 V 462 H 800 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 408 725 H 458" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 935 725 H 985" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<text x="66" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">輸入</tspan></text>
<text x="66" y="579" font-size="26" font-weight="700" fill="#202020"><tspan x="66" dy="0">使用者的</tspan><tspan x="66" dy="35.1">認知特質資訊</tspan></text>
<text x="66" y="695.2" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">記住與運用資訊</tspan><tspan x="66" dy="28.35">所需的負擔</tspan></text>
<text x="66" y="758.5500000000001" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">注意力分配</tspan><tspan x="66" dy="28.35">與說明理解</tspan></text>
<text x="66" y="833.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">本 PoC 也涵蓋</tspan><tspan x="66" dy="27.0">感官與身體特質</tspan></text>
<text x="66" y="894.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">輸入：虛構人物誌</tspan></text>
<text x="494" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="494" dy="0">處理：生成與檢查</tspan></text>
<text x="494" y="580" font-size="30" font-weight="700" fill="#202020"><tspan x="494" dy="0">生成式 AI</tspan></text>
<text x="494" y="632" font-size="23" font-weight="400" fill="#202020"><tspan x="494" dy="0">結合個人資訊與設計知識，</tspan><tspan x="494" dy="31.05">在允許的範圍內</tspan><tspan x="494" dy="31.05">提出介面方案</tspan></text>
<text x="494" y="774.15" font-size="21" font-weight="400" fill="#646464"><tspan x="494" dy="0">可由公式確定的值直接計算</tspan></text>
<text x="682" y="819.15" font-size="28" font-weight="400" fill="#202020"><tspan x="682" dy="0">⇅</tspan></text>
<rect x="490" y="842.15" width="420" height="95" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="512" y="869.15" font-size="21" font-weight="700" fill="#202020"><tspan x="512" dy="0">獨立步驟：</tspan><tspan x="512" dy="28.35">檢查已定義的需求</tspan></text>
<text x="1021" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="1021" dy="0">輸出</tspan></text>
<text x="1021" y="579" font-size="28" font-weight="700" fill="#202020"><tspan x="1021" dy="0">適合該人物誌的介面</tspan></text>
<text x="1021" y="629" font-size="24" font-weight="700" fill="#202020"><tspan x="1021" dy="0">＋ 變更理由與依據</tspan></text>
<rect x="1021" y="730.4" width="311" height="102" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1035" y="744.4" width="90" height="72" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1140" y="744.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1140" y="770.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1140" y="796.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="1021" y="873.4" font-size="20" font-weight="400" fill="#646464"><tspan x="1021" dy="0">決定版面、呈現方式</tspan><tspan x="1021" dy="27.0">與措辭</tspan></text>
<path d="M 40 1038 H 86" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<text x="103" y="1045" font-size="19" font-weight="400" fill="#202020"><tspan x="103" dy="0">處理流程</tspan></text>
<path d="M 310 1038 H 356" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="374" y="1045" font-size="19" font-weight="400" fill="#202020"><tspan x="374" dy="0">知識參照</tspan></text></svg>