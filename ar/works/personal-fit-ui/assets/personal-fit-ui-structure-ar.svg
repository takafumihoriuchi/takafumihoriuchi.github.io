<text x="379" y="894.9000000000001" font-size="20" font-weight="400" fill="#646464" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="379" dy="0">المدخلات: شخصيات افتراضية</tspan></text>
<text x="906" y="539" font-size="18" font-weight="700" fill="#646464" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="906" dy="0">العملية / التوليد والتحقّق</tspan></text>
