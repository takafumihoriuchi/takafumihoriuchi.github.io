<text x="906" y="632" font-size="23" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="906" dy="0">الجمع بين المعلومات الشخصية</tspan><tspan x="906" dy="31.05">والمعارف التصميمية لاقتراح</tspan><tspan x="906" dy="31.05">واجهة ضمن الحدود</tspan><tspan x="906" dy="31.05">المسموح بها</tspan></text>
