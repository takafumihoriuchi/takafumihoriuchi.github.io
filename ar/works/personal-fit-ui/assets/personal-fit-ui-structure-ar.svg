<text x="379" y="579" font-size="26" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="379" dy="0">معلومات عن</tspan><tspan x="379" dy="35.1">الخصائص المعرفية</tspan><tspan x="379" dy="35.1">للمستخدم</tspan></text>
