<text x="649" y="138" font-size="28" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="649" dy="0">المتطلبات الأساسية للواجهة</tspan></text>
<text x="649" y="188" font-size="20" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="649" dy="0">مبادئ التصميم</tspan></text>
<text x="649" y="214" font-size="21" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="649" dy="0">الاتساق · التغذية الراجعة · تجميع المعلومات</tspan></text>
<text x="649" y="256" font-size="20" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="649" dy="0">المتطلبات</tspan></text>
<text x="649" y="282" font-size="21" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="649" dy="0">السلامة · إمكانية الوصول · قيود التفاعل</tspan></text>
<text x="649" y="323" font-size="19" font-weight="400" fill="#646464" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="649" dy="0">تحديد حالات تطبيق المتطلبات وكيفية فحصها</tspan></text>
<text x="1334" y="103" font-size="18" font-weight="700" fill="#646464" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1334" dy="0">المعارف (ب)</tspan></text>
<text x="1334" y="138" font-size="26" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1334" dy="0">توصيات للواجهات تستند</tspan><tspan x="1334" dy="35.1">إلى الخصائص البشرية</tspan></text>
<text x="1334" y="211.1" font-size="20" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1334" dy="0">أبحاث عن الخصائص البشرية</tspan></text>
<text x="1334" y="233.1" font-size="18" font-weight="400" fill="#202020" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"><tspan x="1334" dy="0">↓</tspan></text>
<text x="1334" y="253.1" font-size="20" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1334" dy="0">مبادئ عرض المعلومات</tspan></text>
<text x="1334" y="275.1" font-size="18" font-weight="400" fill="#202020" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"><tspan x="1334" dy="0">↓</tspan></text>
