<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc" lang="ar"><title id="title">المعلومات الشخصية ونوعان من المعارف التصميمية</title><desc id="desc">تُجمع الخصائص المعرفية مع القواعد الأساسية للواجهة والتوصيات المستندة إلى الأبحاث. يقترح الذكاء الاصطناعي واجهة ضمن الحدود المسموح بها، وتُفحص المتطلبات في خطوة منفصلة، وتشمل المخرجات الواجهة المخصّصة وأسباب التغييرات. يشمل نموذج إثبات الفكرة أيضًا خصائص حسية وجسدية وشخصيات افتراضية.</desc><style>text{font-family:Arial,"Noto Sans Arabic",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="1400" height="1080" fill="white" /><text x="1360" y="42" font-size="22" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1360" dy="0">معارف يعدّها المصمّم ويستخدمها الذكاء الاصطناعي</tspan></text>
<rect x="40" y="65" width="635" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="705" y="65" width="655" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
