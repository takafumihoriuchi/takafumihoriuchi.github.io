<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc" lang="ar"><title id="title">رحلة إعداد الواجهة قبل القيادة الأولى</title><desc id="desc">تصوّر مستقبلي من خمس خطوات: بدء الحوار والسيارة متوقفة، ووصف الصعوبات، وتصحيح الفهم، وتجريب الواجهة، ثم بدء استخدامها. تُفصل المعلومات المذكورة في الحوار عن القياسات والتشخيصات.</desc><style>text{font-family:Arial,"Noto Sans Arabic",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="1200" height="1220" fill="white" /><text x="1160" y="55" font-size="33" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1160" dy="0">إعداد الواجهة قبل القيادة الأولى</tspan></text>
<text x="1160" y="99" font-size="21" font-weight="400" fill="#646464" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1160" dy="0">تصوّر مستقبلي / لم يُنفّذ الإعداد عبر الحوار في نموذج إثبات الفكرة</tspan></text>
<text x="650" y="160" font-size="22" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="650" dy="0">أفعال المستخدم وأفكاره</tspan></text>
<text x="1137" y="160" font-size="22" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1137" dy="0">استجابات الذكاء الاصطناعي والنظام</tspan></text>
<rect x="40" y="190" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="176" y="225" font-size="22" font-weight="700" fill="#202020" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"><tspan x="176" dy="0">01</tspan></text>
<text x="176" y="262" font-size="18" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="176" dy="0">الركوب الأول</tspan><tspan x="176" dy="24.3">للسيارة</tspan></text>
<text x="650" y="228" font-size="22" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="650" dy="0">بدء الإعداد والسيارة متوقفة</tspan></text>
<text x="650" y="276" font-size="21" font-weight="400" fill="#646464" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="650" dy="0">«أريد أن أجعل استخدامها سهلًا.»</tspan></text>
<text x="1137" y="228" font-size="22" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1137" dy="0">شرح الغرض والسؤال عن</tspan><tspan x="1137" dy="29.700000000000003">الرغبة في البدء</tspan></text>
<text x="1137" y="284" font-size="21" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1137" dy="0">إتاحة البدء لاحقًا</tspan></text>
<path d="M 85 339 V 356" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="360" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5" />
<text x="176" y="395" font-size="22" font-weight="700" fill="#202020" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"><tspan x="176" dy="0">02</tspan></text>
<text x="176" y="432" font-size="18" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="176" dy="0">المقابلة</tspan></text>
<text x="650" y="398" font-size="22" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="650" dy="0">وصف الصعوبات اليومية</tspan></text>
<text x="650" y="446" font-size="21" font-weight="400" fill="#646464" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="650" dy="0">«أنسى التعليمات السابقة</tspan><tspan x="650" dy="28.35">عندما تصل التالية.»</tspan></text>
<text x="1137" y="398" font-size="22" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1137" dy="0">السؤال عن مواقف محدّدة</tspan></text>
<text x="1137" y="454" font-size="21" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1137" dy="0">تحديد متطلبات الذاكرة والانتباه</tspan></text>
<path d="M 85 509 V 526" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="530" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="176" y="565" font-size="22" font-weight="700" fill="#202020" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"><tspan x="176" dy="0">03</tspan></text>
<text x="176" y="602" font-size="18" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="176" dy="0">التحقّق</tspan><tspan x="176" dy="24.3">من الفهم</tspan></text>
<text x="650" y="568" font-size="22" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="650" dy="0">تأكيد تفسير الذكاء الاصطناعي أو تصحيحه</tspan></text>
<text x="650" y="616" font-size="21" font-weight="400" fill="#646464" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="650" dy="0">«هذا الجزء صحيح، وذاك مختلف.»</tspan></text>
<text x="1137" y="568" font-size="22" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1137" dy="0">تلخيص ما قاله المستخدم</tspan></text>
<text x="1137" y="624" font-size="21" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1137" dy="0">فصل ما يذكره الشخص عن نفسه</tspan><tspan x="1137" dy="28.35">عن نتائج القياس</tspan></text>
<path d="M 85 679 V 696" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="700" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5" />
<text x="176" y="735" font-size="22" font-weight="700" fill="#202020" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"><tspan x="176" dy="0">04</tspan></text>
<text x="176" y="772" font-size="18" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="176" dy="0">المقترح</tspan><tspan x="176" dy="24.3">والتجربة</tspan></text>
<text x="650" y="738" font-size="22" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="650" dy="0">تجريب الواجهة والسيارة متوقفة</tspan></text>
<text x="650" y="786" font-size="21" font-weight="400" fill="#646464" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="650" dy="0">«يساعدني بقاء المعلومات</tspan><tspan x="650" dy="28.35">على الشاشة.»</tspan></text>
<text x="1137" y="738" font-size="22" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1137" dy="0">عرض الواجهة وأسباب</tspan><tspan x="1137" dy="29.700000000000003">التغييرات</tspan></text>
<text x="1137" y="794" font-size="21" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1137" dy="0">إتاحة التعديل أو استعادة</tspan><tspan x="1137" dy="28.35">الواجهة الأصلية</tspan></text>
<path d="M 85 849 V 866" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="870" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="176" y="905" font-size="22" font-weight="700" fill="#202020" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"><tspan x="176" dy="0">05</tspan></text>
<text x="176" y="942" font-size="18" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="176" dy="0">بدء الاستخدام</tspan></text>
<text x="650" y="908" font-size="22" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="650" dy="0">بدء استخدام الواجهة المعتمدة</tspan></text>
<text x="650" y="956" font-size="21" font-weight="400" fill="#646464" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="650" dy="0">«سأجرّب البدء بهذا الإعداد.»</tspan></text>
<text x="1137" y="908" font-size="22" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1137" dy="0">حفظ الواجهة الأولية</tspan></text>
<text x="1137" y="964" font-size="21" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1137" dy="0">الحفاظ على ثبات بنيتها الأساسية</tspan><tspan x="1137" dy="28.35">أثناء القيادة</tspan></text>
<text x="1160" y="1103" font-size="25" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1160" dy="0">تحويل الحوار إلى معلومات شخصية يستطيع المستخدم تأكيدها وتصحيحها.</tspan></text>
<text x="1160" y="1148" font-size="21" font-weight="400" fill="#646464" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="1160" dy="0">فصلها عن القياسات المعرفية والتشخيصات، وتقييم البنود الأخرى عند الحاجة.</tspan></text></svg>