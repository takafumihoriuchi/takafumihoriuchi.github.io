<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1641" viewBox="0 0 480 1641" role="img" aria-labelledby="title desc" lang="ar"><title id="title">المعلومات الشخصية ونوعان من المعارف التصميمية</title><desc id="desc">تُجمع الخصائص المعرفية مع القواعد الأساسية للواجهة والتوصيات المستندة إلى الأبحاث. يقترح الذكاء الاصطناعي واجهة ضمن الحدود المسموح بها، وتُفحص المتطلبات في خطوة منفصلة، وتشمل المخرجات الواجهة المخصّصة وأسباب التغييرات. يشمل نموذج إثبات الفكرة أيضًا خصائص حسية وجسدية وشخصيات افتراضية.</desc><style>text{font-family:Arial,"Noto Sans Arabic",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="480" height="1641" fill="white" /><rect x="24" y="26" width="402" height="222" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="402" y="62" font-size="18" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">المدخلات</tspan></text>
<text x="402" y="95" font-size="25" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">معلومات عن الخصائص</tspan></text>
<text x="402" y="120" font-size="25" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">المعرفية للمستخدم</tspan></text>
<text x="402" y="164" font-size="20" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">يشمل نموذج إثبات الفكرة أيضًا</tspan><tspan x="402" dy="27.0">الخصائص الحسية والجسدية</tspan></text>
<text x="402" y="224" font-size="20" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">المدخلات: شخصيات افتراضية</tspan></text>
<text x="454" y="284" font-size="23" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="454" dy="0">معارف يستخدمها الذكاء الاصطناعي</tspan></text>
<rect x="24" y="329" width="402" height="266.75" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="402" y="365" font-size="18" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">المعارف (أ)</tspan></text>
<text x="402" y="400" font-size="25" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">مبادئ الواجهة الأساسية</tspan><tspan x="402" dy="33.75">ومتطلباتها</tspan></text>
<text x="402" y="476.75" font-size="20" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">الاتساق · التغذية الراجعة · التجميع</tspan></text>
<text x="402" y="510.75" font-size="20" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">السلامة · إمكانية الوصول</tspan></text>
<text x="402" y="544.75" font-size="20" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">حالات تطبيق المتطلبات</tspan><tspan x="402" dy="27.0">وكيفية فحصها</tspan></text>
<rect x="24" y="631.75" width="402" height="329.5" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="402" y="667.75" font-size="18" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">المعارف (ب)</tspan></text>
<text x="402" y="702.75" font-size="25" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">توصيات للواجهات</tspan><tspan x="402" dy="33.75">تستند إلى الخصائص</tspan><tspan x="402" dy="33.75">البشرية</tspan></text>
<text x="402" y="813.25" font-size="20" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">نتائج الأبحاث ← مبادئ</tspan><tspan x="402" dy="27.0">عرض المعلومات</tspan></text>
<text x="402" y="872.25" font-size="20" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">← واجهات موصى بها</tspan></text>
<text x="402" y="910.25" font-size="20" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">فصل نتائج الأبحاث</tspan><tspan x="402" dy="27.0">عن الأحكام التصميمية</tspan></text>
<rect x="24" y="997.25" width="402" height="369.4000000000001" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="402" y="1033.25" font-size="18" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">العملية / التوليد</tspan><tspan x="402" dy="24.3">والتحقّق</tspan></text>
<text x="402" y="1092.55" font-size="28" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">الذكاء الاصطناعي التوليدي</tspan></text>
<text x="402" y="1139.55" font-size="22" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">اقتراح واجهة باستخدام</tspan><tspan x="402" dy="29.700000000000003">المعلومات الشخصية</tspan><tspan x="402" dy="29.700000000000003">والمعارف التصميمية</tspan></text>
<text x="402" y="1239.95" font-size="20" font-weight="400" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">حساب القيم التي تحدّدها</tspan><tspan x="402" dy="27.0">الصيغ الرياضية</tspan></text>
<text x="402" y="1310.95" font-size="22" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">خطوة منفصلة: فحص</tspan><tspan x="402" dy="29.700000000000003">المتطلبات</tspan></text>
<rect x="24" y="1402.65" width="402" height="172.04999999999995" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="402" y="1438.65" font-size="18" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">المخرجات</tspan></text>
<text x="402" y="1473.65" font-size="27" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">واجهة مخصّصة</tspan></text>
<text x="402" y="1516.65" font-size="23" font-weight="700" fill="#202020" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="402" dy="0">+ أسباب التغييرات</tspan><tspan x="402" dy="31.05">والأدلة الداعمة لها</tspan></text>
