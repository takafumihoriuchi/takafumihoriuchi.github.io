<text x="454" y="1610.7" font-size="16" font-weight="400" fill="#646464" direction="rtl" unicode-bidi="plaintext" text-anchor="start"><tspan x="454" dy="0">المتصل: مسار العملية · المتقطّع: الرجوع إلى المعارف</tspan></text></svg>