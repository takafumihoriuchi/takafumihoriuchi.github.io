<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc"><title id="title">Configurare l’interfaccia prima del primo viaggio</title><desc id="desc">Concept futuro in cinque fasi: avvio della configurazione a veicolo fermo, colloquio, verifica della comprensione, proposta e prova, inizio dell’uso. Ogni fase mostra le azioni dell’utente e le risposte dell’IA.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="1200" height="1220" fill="white" /><text x="40" y="55" font-size="33" font-weight="700" fill="#202020"><tspan x="40" dy="0">Configurare l’interfaccia prima del primo viaggio</tspan></text>
<text x="40" y="99" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">Concept futuro / La configurazione tramite dialogo non è implementata nel PoC</tspan></text>
<text x="215" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="215" dy="0">Azioni e pensieri dell’utente</tspan></text>
<text x="697" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="697" dy="0">Risposte dell’IA e del sistema</tspan></text>
<rect x="40" y="190" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="225" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">01</tspan></text>
<text x="62" y="262" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Prima volta</tspan><tspan x="62" dy="24.3">in auto</tspan></text>
<text x="215" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Avviare la configurazione a veicolo fermo</tspan></text>
<text x="215" y="276" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Vorrei renderla facile da usare.»</tspan></text>
<text x="697" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Spiegare lo scopo e chiedere</tspan><tspan x="697" dy="29.700000000000003">se iniziare</tspan></text>
<text x="697" y="284" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Consentire di iniziare più tardi</tspan></text>
<path d="M 85 339 V 356" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="360" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="395" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">02</tspan></text>
<text x="62" y="432" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Colloquio</tspan></text>
<text x="215" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Descrivere le difficoltà quotidiane</tspan></text>
<text x="215" y="446" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Quando arrivano nuove istruzioni,</tspan><tspan x="215" dy="28.35">dimentico quelle precedenti.»</tspan></text>
<text x="697" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Chiedere di situazioni concrete</tspan></text>
<text x="697" y="454" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Individuare il carico su memoria e attenzione</tspan></text>
<path d="M 85 509 V 526" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="530" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="565" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">03</tspan></text>
<text x="62" y="602" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Verificare la</tspan><tspan x="62" dy="24.3">comprensione</tspan></text>
<text x="215" y="568" font-size="20.8" font-weight="400" fill="#202020"><tspan x="215" dy="0">Confermare o correggere l’interpretazione dell’IA</tspan></text>
<text x="215" y="616" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Questa parte è giusta. L’altra è diversa.»</tspan></text>
<text x="697" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Riassumere ciò che l’utente ha detto</tspan></text>
<text x="697" y="624" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Separare le dichiarazioni dell’utente</tspan><tspan x="697" dy="28.35">dalle misurazioni</tspan></text>
<path d="M 85 679 V 696" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="700" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="735" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">04</tspan></text>
<text x="62" y="772" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Proposta</tspan><tspan x="62" dy="24.3">e prova</tspan></text>
<text x="215" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Provare l’interfaccia a veicolo fermo</tspan></text>
<text x="215" y="786" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Mi aiuta quando le informazioni</tspan><tspan x="215" dy="28.35">rimangono sullo schermo.»</tspan></text>
<text x="697" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Presentare l’interfaccia e le ragioni</tspan><tspan x="697" dy="29.700000000000003">delle modifiche</tspan></text>
<text x="697" y="794" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Consentire modifiche o il ripristino</tspan><tspan x="697" dy="28.35">dell’interfaccia originale</tspan></text>
<path d="M 85 849 V 866" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="870" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="905" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">05</tspan></text>
<text x="62" y="942" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Iniziare l’uso</tspan></text>
<text x="215" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Iniziare a usare l’interfaccia confermata</tspan></text>
<text x="215" y="956" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Provo a iniziare con questa configurazione.»</tspan></text>
<text x="697" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Salvare l’interfaccia iniziale</tspan></text>
<text x="697" y="964" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Mantenerne stabile la struttura di base</tspan><tspan x="697" dy="28.35">durante la guida</tspan></text>
<text x="40" y="1103" font-size="25" font-weight="700" fill="#202020"><tspan x="40" dy="0">Ricavare dal dialogo informazioni personali che l’utente possa confermare e correggere.</tspan></text>
<text x="40" y="1148" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">Tenerle separate da misurazioni cognitive e diagnosi; valutare altri aspetti secondo necessità.</tspan></text></svg>