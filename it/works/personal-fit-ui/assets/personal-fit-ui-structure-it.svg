<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc"><title id="title">Informazioni personali e due tipi di conoscenze progettuali</title><desc id="desc">Schema del sistema proposto. Le caratteristiche cognitive si combinano con regole di base dell’interfaccia e raccomandazioni fondate sulle caratteristiche umane. L’IA generativa propone un’interfaccia, un passaggio separato la verifica e il risultato comprende l’interfaccia e le ragioni delle modifiche.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="1400" height="1080" fill="white" /><text x="40" y="42" font-size="22" font-weight="700" fill="#202020"><tspan x="40" dy="0">Conoscenze usate dall’IA, preparate dal progettista</tspan></text>
<rect x="40" y="65" width="635" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="705" y="65" width="655" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="66" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">Conoscenze A</tspan></text>
<text x="66" y="138" font-size="28" font-weight="700" fill="#202020"><tspan x="66" dy="0">Requisiti di base dell’interfaccia</tspan></text>
<text x="66" y="188" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">Principi progettuali</tspan></text>
<text x="66" y="214" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Coerenza · Feedback · Raggruppamento delle informazioni</tspan></text>
<text x="66" y="256" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">Requisiti</tspan></text>
<text x="66" y="282" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Sicurezza · Accessibilità · Limiti di interazione</tspan></text>
<text x="66" y="323" font-size="19" font-weight="400" fill="#646464"><tspan x="66" dy="0">Definire quando i requisiti si applicano e come verificarli</tspan></text>
<text x="731" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="731" dy="0">Conoscenze B</tspan></text>
<text x="731" y="138" font-size="26" font-weight="700" fill="#202020"><tspan x="731" dy="0">Raccomandazioni per l’interfaccia</tspan><tspan x="731" dy="35.1">basate sulle caratteristiche umane</tspan></text>
<text x="731" y="211.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Ricerca sulle caratteristiche umane</tspan></text>
<text x="731" y="239.1" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="267.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Principi di presentazione delle informazioni</tspan></text>
<text x="731" y="295.1" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="323.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Raccomandazioni per l’interfaccia in base alle caratteristiche</tspan></text>
<text x="731" y="399" font-size="19" font-weight="400" fill="#646464"><tspan x="731" dy="0">Distinguere risultati di ricerca e valutazioni progettuali</tspan></text>
<rect x="40" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="468" y="500" width="464" height="490" rx="12" fill="#fff" stroke="#303030" stroke-width="1.5" />
<rect x="995" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5" />
<path d="M 357 425 V 462 H 600 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 1032 425 V 462 H 800 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
