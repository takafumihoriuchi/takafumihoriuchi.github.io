<path d="M 935 725 H 985" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<text x="66" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">INGRESSO</tspan></text>
<text x="66" y="579" font-size="26" font-weight="700" fill="#202020"><tspan x="66" dy="0">Informazioni sulle</tspan><tspan x="66" dy="35.1">caratteristiche cognitive</tspan><tspan x="66" dy="35.1">dell’utente</tspan></text>
<text x="66" y="695.2" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Impegno per tenere a mente</tspan><tspan x="66" dy="28.35">e usare informazioni</tspan></text>
<text x="66" y="758.5500000000001" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Attenzione e comprensione</tspan><tspan x="66" dy="28.35">delle spiegazioni</tspan></text>
<text x="66" y="833.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">Il PoC include anche caratteristiche</tspan><tspan x="66" dy="27.0">sensoriali e fisiche</tspan></text>
<text x="66" y="894.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">Input: personas fittizie</tspan></text>
<text x="494" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="494" dy="0">PROCESSO / GENERAZIONE E VERIFICA</tspan></text>
<text x="494" y="580" font-size="30" font-weight="700" fill="#202020"><tspan x="494" dy="0">IA generativa</tspan></text>
<text x="494" y="632" font-size="23" font-weight="400" fill="#202020"><tspan x="494" dy="0">Combinare informazioni personali</tspan><tspan x="494" dy="31.05">e conoscenze progettuali per</tspan><tspan x="494" dy="31.05">proporre un’interfaccia entro</tspan><tspan x="494" dy="31.05">i limiti consentiti</tspan></text>
<text x="494" y="774.15" font-size="21" font-weight="400" fill="#646464"><tspan x="494" dy="0">Calcolare i valori definiti da formule</tspan></text>
<text x="682" y="819.15" font-size="28" font-weight="400" fill="#202020"><tspan x="682" dy="0">⇅</tspan></text>
<rect x="490" y="842.15" width="420" height="95" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="512" y="869.15" font-size="21" font-weight="700" fill="#202020"><tspan x="512" dy="0">Passaggio separato: verificare</tspan><tspan x="512" dy="28.35">i requisiti definiti</tspan></text>
<text x="1021" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="1021" dy="0">USCITA</tspan></text>
<text x="1021" y="579" font-size="26.5" font-weight="700" fill="#202020"><tspan x="1021" dy="0">Un’interfaccia su misura</tspan></text>
<text x="1021" y="629" font-size="24" font-weight="700" fill="#202020"><tspan x="1021" dy="0">+ Ragioni delle modifiche</tspan><tspan x="1021" dy="32.400000000000006">ed evidenze a sostegno</tspan></text>
<rect x="1021" y="730.4" width="311" height="102" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1035" y="744.4" width="90" height="72" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1140" y="744.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1140" y="770.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1140" y="796.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<text x="1021" y="873.4" font-size="20" font-weight="400" fill="#646464"><tspan x="1021" dy="0">Definire disposizione,</tspan><tspan x="1021" dy="27.0">presentazione e formulazioni</tspan></text>
