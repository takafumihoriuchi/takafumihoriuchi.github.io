<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1641" viewBox="0 0 480 1641" role="img" aria-labelledby="title desc"><title id="title">Generare un’interfaccia a partire da informazioni personali</title><desc id="desc">Schema per dispositivi mobili, da leggere dall’alto verso il basso: informazioni personali; conoscenze A e B; IA generativa e verifica separata; interfaccia su misura con le ragioni delle modifiche.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="480" height="1641" fill="white" /><rect x="24" y="26" width="402" height="222" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="62" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">INGRESSO</tspan></text>
<text x="48" y="89" font-size="22" font-weight="700" fill="#202020"><tspan x="48" dy="0">Informazioni sulle</tspan></text>
<text x="48" y="117" font-size="22" font-weight="700" fill="#202020"><tspan x="48" dy="0">caratteristiche cognitive</tspan><tspan x="48" dy="29.7">dell’utente</tspan></text>
<text x="48" y="181" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Il PoC include anche caratteristiche</tspan><tspan x="48" dy="27.0">sensoriali e fisiche</tspan></text>
<text x="48" y="233" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Input: personas fittizie</tspan></text>
<text x="24" y="284" font-size="23" font-weight="700" fill="#202020"><tspan x="24" dy="0">Conoscenze usate dall’IA</tspan></text>
<rect x="24" y="329" width="402" height="266.75" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="365" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">Conoscenze A</tspan></text>
<text x="48" y="400" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">Principi e requisiti di base</tspan><tspan x="48" dy="33.75">dell’interfaccia</tspan></text>
<text x="48" y="476.75" font-size="19.3" font-weight="400" fill="#202020"><tspan x="48" dy="0">Coerenza · Feedback · Raggruppamento</tspan></text>
<text x="48" y="510.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Sicurezza · Accessibilità</tspan></text>
<text x="48" y="544.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Quando i requisiti si applicano</tspan><tspan x="48" dy="27.0">e come verificarli</tspan></text>
<rect x="24" y="631.75" width="402" height="329.5" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="667.75" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">Conoscenze B</tspan></text>
<text x="48" y="702.75" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">Raccomandazioni</tspan><tspan x="48" dy="33.75">per l’interfaccia basate</tspan><tspan x="48" dy="33.75">sulle caratteristiche umane</tspan></text>
<text x="48" y="813.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Risultati di ricerca → Principi</tspan><tspan x="48" dy="27.0">di presentazione</tspan></text>
<text x="48" y="872.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">→ Interfacce raccomandate</tspan></text>
<text x="48" y="910.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Distinguere risultati di ricerca</tspan><tspan x="48" dy="27.0">e valutazioni progettuali</tspan></text>
<rect x="24" y="997.25" width="402" height="369.4000000000001" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="1033.25" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">PROCESSO / GENERAZIONE</tspan><tspan x="48" dy="24.3">E VERIFICA</tspan></text>
<text x="48" y="1092.55" font-size="28" font-weight="700" fill="#202020"><tspan x="48" dy="0">IA generativa</tspan></text>
<text x="48" y="1139.55" font-size="22" font-weight="400" fill="#202020"><tspan x="48" dy="0">Proporre un’interfaccia usando</tspan><tspan x="48" dy="29.700000000000003">informazioni personali</tspan><tspan x="48" dy="29.700000000000003">e conoscenze progettuali</tspan></text>
<text x="48" y="1239.95" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Calcolare i valori definiti</tspan><tspan x="48" dy="27.0">da formule</tspan></text>
<text x="48" y="1310.95" font-size="22" font-weight="700" fill="#202020"><tspan x="48" dy="0">Passaggio separato:</tspan><tspan x="48" dy="29.700000000000003">verificare i requisiti</tspan></text>
<rect x="24" y="1402.65" width="402" height="172.04999999999995" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="1438.65" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">USCITA</tspan></text>
<text x="48" y="1473.65" font-size="27" font-weight="700" fill="#202020"><tspan x="48" dy="0">Un’interfaccia su misura</tspan></text>
<text x="48" y="1516.65" font-size="23" font-weight="700" fill="#202020"><tspan x="48" dy="0">+ Ragioni delle modifiche</tspan><tspan x="48" dy="31.05">ed evidenze a sostegno</tspan></text>
<path d="M 426 111 H 458 V 1092.25 H 434" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<path d="M 24 404 H 10 V 977.25 H 160 V 990.25" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 226 961.25 V 990.25" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 226 1366.65 V 1395.65" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<text x="24" y="1610.7" font-size="18" font-weight="400" fill="#646464"><tspan x="24" dy="0">Linea continua: processo · Tratteggiata: conoscenze</tspan></text></svg>