<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1641" viewBox="0 0 480 1641" role="img" aria-labelledby="title desc" lang="pt" xml:lang="pt"><title id="title">Gerar uma interface a partir de informações pessoais</title><desc id="desc">Diagrama conceitual para dispositivos móveis, lido de cima para baixo: informações pessoais; conjuntos de conhecimento A e B; IA generativa e validação separada; interface personalizada com as razões das mudanças.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="480" height="1641" fill="white"/><rect x="24" y="26" width="402" height="222" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="62" font-size="18.0" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">ENTRADA</tspan></text>
<text x="48" y="95" font-size="25.0" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">Informações sobre as</tspan></text>
<text x="48" y="120" font-size="20.5" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">características cognitivas da pessoa</tspan></text>
<text x="48" y="164" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48.0" dy="0">A prova de conceito também inclui</tspan><tspan x="48.0" dy="27.0">características sensoriais e físicas</tspan></text>
<text x="48" y="224" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48.0" dy="0">Entradas: personas fictícias</tspan></text>
<text x="24" y="284" font-size="23.0" font-weight="700" fill="#202020"><tspan x="24.0" dy="0">Conhecimento utilizado pela IA</tspan></text>
<rect x="24" y="329" width="402" height="266.75" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="365" font-size="18.0" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">Conhecimento A</tspan></text>
<text x="48" y="400" font-size="25.0" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">Princípios e requisitos</tspan><tspan x="48.0" dy="33.75">básicos de interface</tspan></text>
<text x="48" y="476.75" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48.0" dy="0">Consistência · Retorno · Agrupamento</tspan></text>
<text x="48" y="510.75" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48.0" dy="0">Segurança · Acessibilidade</tspan></text>
<text x="48" y="544.75" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48.0" dy="0">Quando os requisitos se aplicam e</tspan><tspan x="48.0" dy="27.0">como verificá-los</tspan></text>
<rect x="24" y="631.75" width="402" height="329.5" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="667.75" font-size="18.0" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">Conhecimento B</tspan></text>
<text x="48" y="702.75" font-size="25.0" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">Recomendações de interface</tspan><tspan x="48.0" dy="33.75">baseadas em características</tspan><tspan x="48.0" dy="33.75">humanas</tspan></text>
<text x="48" y="813.25" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48.0" dy="0">Resultados de pesquisa → Princípios de</tspan><tspan x="48.0" dy="27.0">apresentação</tspan></text>
<text x="48" y="872.25" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48.0" dy="0">→ Interfaces recomendadas</tspan></text>
<text x="48" y="910.25" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48.0" dy="0">Distinguir resultados de pesquisa de</tspan><tspan x="48.0" dy="27.0">decisões de design</tspan></text>
<rect x="24" y="997.25" width="402" height="369.4000000000001" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="1033.25" font-size="18.0" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">PROCESSO / GERAÇÃO E VALIDAÇÃO</tspan></text>
<text x="48" y="1092.55" font-size="28.0" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">IA generativa</tspan></text>
<text x="48" y="1139.55" font-size="22.0" font-weight="400" fill="#202020"><tspan x="48.0" dy="0">Propor uma interface com base em</tspan><tspan x="48.0" dy="29.700000000000003">informações pessoais e</tspan><tspan x="48.0" dy="29.700000000000003">conhecimento de design</tspan></text>
<text x="48" y="1239.95" font-size="20.0" font-weight="400" fill="#202020"><tspan x="48.0" dy="0">Calcular os valores determinados por</tspan><tspan x="48.0" dy="27.0">fórmulas</tspan></text>
<text x="48" y="1310.95" font-size="22.0" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">Etapa separada: verificar os</tspan><tspan x="48.0" dy="29.700000000000003">requisitos</tspan></text>
<rect x="24" y="1402.65" width="402" height="172.04999999999995" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="1438.65" font-size="18.0" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">SAÍDA</tspan></text>
<text x="48" y="1473.65" font-size="26.5" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">Uma interface personalizada</tspan></text>
<text x="48" y="1516.65" font-size="23.0" font-weight="700" fill="#202020"><tspan x="48.0" dy="0">+ Razões e evidências que</tspan><tspan x="48.0" dy="31.05">fundamentam as mudanças</tspan></text>
