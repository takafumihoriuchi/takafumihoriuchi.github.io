<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc" lang="pt" xml:lang="pt"><title id="title">Configurar a interface antes de dirigir pela primeira vez</title><desc id="desc">Conceito futuro. Cinco etapas: iniciar a configuração com o carro parado, entrevista, confirmação do entendimento, proposta e experimentação e início do uso. Cada etapa mostra as ações da pessoa e a resposta da IA.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="1200" height="1220" fill="white"/><text x="40" y="55" font-size="33.0" font-weight="700" fill="#202020"><tspan x="40.0" dy="0">Configurar a interface antes de dirigir pela primeira vez</tspan></text>
<text x="40" y="99" font-size="21.0" font-weight="400" fill="#646464"><tspan x="40.0" dy="0">Conceito futuro / A configuração por conversa não foi implementada na prova de conceito</tspan></text>
<text x="215" y="160" font-size="22.0" font-weight="700" fill="#202020"><tspan x="215.0" dy="0">Ações e pensamentos da pessoa</tspan></text>
<text x="697" y="160" font-size="22.0" font-weight="700" fill="#202020"><tspan x="697.0" dy="0">Respostas da IA e do sistema</tspan></text>
<rect x="40" y="190" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="225" font-size="22.0" font-weight="700" fill="#202020"><tspan x="62.0" dy="0">01</tspan></text>
<text x="62" y="262" font-size="18.0" font-weight="700" fill="#202020"><tspan x="62.0" dy="0">Primeira vez</tspan><tspan x="62.0" dy="24.3">no carro</tspan></text>
<text x="215" y="228" font-size="22.0" font-weight="400" fill="#202020"><tspan x="215.0" dy="0">Iniciar a configuração com o carro parado</tspan></text>
<text x="215" y="276" font-size="21.0" font-weight="400" fill="#646464"><tspan x="215.0" dy="0">“Quero que seja fácil de usar.”</tspan></text>
<text x="697" y="228" font-size="22.0" font-weight="400" fill="#202020"><tspan x="697.0" dy="0">Explicar o propósito e perguntar se deseja</tspan><tspan x="697.0" dy="29.700000000000003">começar</tspan></text>
<text x="697" y="284" font-size="21.0" font-weight="400" fill="#202020"><tspan x="697.0" dy="0">Permitir que a pessoa comece depois</tspan></text>
<path d="M 85 339 V 356" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="360" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="395" font-size="22.0" font-weight="700" fill="#202020"><tspan x="62.0" dy="0">02</tspan></text>
<text x="62" y="432" font-size="18.0" font-weight="700" fill="#202020"><tspan x="62.0" dy="0">Entrevista</tspan></text>
<text x="215" y="398" font-size="22.0" font-weight="400" fill="#202020"><tspan x="215.0" dy="0">Descrever dificuldades do dia a dia</tspan></text>
<text x="215" y="446" font-size="21.0" font-weight="400" fill="#646464"><tspan x="215.0" dy="0">“Quando chegam novas instruções, esqueço</tspan><tspan x="215.0" dy="28.35">as anteriores.”</tspan></text>
<text x="697" y="398" font-size="22.0" font-weight="400" fill="#202020"><tspan x="697.0" dy="0">Perguntar sobre situações concretas</tspan></text>
<text x="697" y="454" font-size="21.0" font-weight="400" fill="#202020"><tspan x="697.0" dy="0">Identificar demandas de memória e atenção</tspan></text>
<path d="M 85 509 V 526" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="530" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="565" font-size="22.0" font-weight="700" fill="#202020"><tspan x="62.0" dy="0">03</tspan></text>
<text x="62" y="602" font-size="18.0" font-weight="700" fill="#202020"><tspan x="62.0" dy="0">Confirmar o</tspan><tspan x="62.0" dy="24.3">entendimento</tspan></text>
<text x="215" y="568" font-size="22.0" font-weight="400" fill="#202020"><tspan x="215.0" dy="0">Confirmar ou corrigir a interpretação da IA</tspan></text>
<text x="215" y="616" font-size="21.0" font-weight="400" fill="#646464"><tspan x="215.0" dy="0">“Esta parte está certa. Aquela é diferente.”</tspan></text>
<text x="697" y="568" font-size="22.0" font-weight="400" fill="#202020"><tspan x="697.0" dy="0">Resumir o que a pessoa relatou</tspan></text>
<text x="697" y="624" font-size="21.0" font-weight="400" fill="#202020"><tspan x="697.0" dy="0">Distinguir relatos pessoais de medições</tspan></text>
<path d="M 85 679 V 696" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="700" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="735" font-size="22.0" font-weight="700" fill="#202020"><tspan x="62.0" dy="0">04</tspan></text>
<text x="62" y="772" font-size="18.0" font-weight="700" fill="#202020"><tspan x="62.0" dy="0">Proposta e</tspan><tspan x="62.0" dy="24.3">teste</tspan></text>
<text x="215" y="738" font-size="21.25" font-weight="400" fill="#202020"><tspan x="215.0" dy="0">Experimentar a interface com o carro parado</tspan></text>
<text x="215" y="786" font-size="21.0" font-weight="400" fill="#646464"><tspan x="215.0" dy="0">“Ajuda quando a informação fica na tela.”</tspan></text>
<text x="697" y="738" font-size="22.0" font-weight="400" fill="#202020"><tspan x="697.0" dy="0">Apresentar a interface e as razões das</tspan><tspan x="697.0" dy="29.700000000000003">mudanças</tspan></text>
<text x="697" y="794" font-size="21.0" font-weight="400" fill="#202020"><tspan x="697.0" dy="0">Permitir ajustes ou restaurar a interface original</tspan></text>
<path d="M 85 849 V 866" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="870" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="905" font-size="22.0" font-weight="700" fill="#202020"><tspan x="62.0" dy="0">05</tspan></text>
<text x="62" y="942" font-size="18.0" font-weight="700" fill="#202020"><tspan x="62.0" dy="0">Início do uso</tspan></text>
<text x="215" y="908" font-size="22.0" font-weight="400" fill="#202020"><tspan x="215.0" dy="0">Começar a usar a interface confirmada</tspan></text>
<text x="215" y="956" font-size="19.0" font-weight="400" fill="#646464"><tspan x="215.0" dy="0">“Vou começar experimentando esta configuração.”</tspan></text>
<text x="697" y="908" font-size="22.0" font-weight="400" fill="#202020"><tspan x="697.0" dy="0">Salvar a interface inicial</tspan></text>
<text x="697" y="964" font-size="21.0" font-weight="400" fill="#202020"><tspan x="697.0" dy="0">Manter a estrutura básica consistente durante a</tspan><tspan x="697.0" dy="28.35">condução</tspan></text>
<text x="40" y="1103" font-size="25.0" font-weight="700" fill="#202020"><tspan x="40.0" dy="0">Transformar a conversa em informações pessoais que a pessoa possa confirmar e corrigir.</tspan></text>
<text x="40" y="1148" font-size="21.0" font-weight="400" fill="#646464"><tspan x="40.0" dy="0">Distinguir essas informações de medições cognitivas e diagnósticos; avaliar outros aspectos quando necessário.</tspan></text></svg>