<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc" lang="pt" xml:lang="pt"><title id="title">Informações pessoais e dois tipos de conhecimento de design</title><desc id="desc">Diagrama conceitual do sistema proposto. As características cognitivas são combinadas com regras básicas de interface e recomendações baseadas em características humanas. A IA generativa propõe uma interface, uma etapa separada a valida, e a saída inclui a interface e as razões das mudanças.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="1400" height="1080" fill="white"/><text x="40" y="42" font-size="20.75" font-weight="700" fill="#202020"><tspan x="40.0" dy="0">Conhecimento utilizado pela IA, preparado por quem projeta</tspan></text>
<rect x="40" y="65" width="635" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="705" y="65" width="655" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="66" y="103" font-size="18.0" font-weight="700" fill="#646464"><tspan x="66.0" dy="0">Conhecimento A</tspan></text>
<text x="66" y="138" font-size="28.0" font-weight="700" fill="#202020"><tspan x="66.0" dy="0">Requisitos básicos de interface</tspan></text>
<text x="66" y="188" font-size="20.0" font-weight="700" fill="#202020"><tspan x="66.0" dy="0">Princípios de design</tspan></text>
<text x="66" y="214" font-size="21.0" font-weight="400" fill="#202020"><tspan x="66.0" dy="0">Consistência · Retorno · Agrupamento de informações</tspan></text>
<text x="66" y="256" font-size="20.0" font-weight="700" fill="#202020"><tspan x="66.0" dy="0">Requisitos</tspan></text>
<text x="66" y="282" font-size="21.0" font-weight="400" fill="#202020"><tspan x="66.0" dy="0">Segurança · Acessibilidade · Restrições de interação</tspan></text>
<text x="66" y="323" font-size="19.0" font-weight="400" fill="#646464"><tspan x="66.0" dy="0">Definir quando os requisitos se aplicam e como verificá-los</tspan></text>
<text x="731" y="103" font-size="18.0" font-weight="700" fill="#646464"><tspan x="731.0" dy="0">Conhecimento B</tspan></text>
<text x="731" y="138" font-size="26.0" font-weight="700" fill="#202020"><tspan x="731.0" dy="0">Recomendações de interface baseadas em</tspan><tspan x="731.0" dy="35.1">características humanas</tspan></text>
<text x="731" y="211.1" font-size="20.0" font-weight="400" fill="#202020"><tspan x="731.0" dy="0">Pesquisa sobre características humanas</tspan></text>
<text x="731" y="233.1" font-size="18.0" font-weight="400" fill="#202020"><tspan x="731.0" dy="0">↓</tspan></text>
<text x="731" y="253.1" font-size="20.0" font-weight="400" fill="#202020"><tspan x="731.0" dy="0">Princípios de apresentação da informação</tspan></text>
<text x="731" y="275.1" font-size="18.0" font-weight="400" fill="#202020"><tspan x="731.0" dy="0">↓</tspan></text>
<text x="731" y="295.1" font-size="20.0" font-weight="400" fill="#202020"><tspan x="731.0" dy="0">Recomendações de interface para essas características</tspan></text>
<text x="731" y="399" font-size="19.0" font-weight="400" fill="#646464"><tspan x="731.0" dy="0">Distinguir resultados de pesquisa de decisões de design</tspan></text>
<rect x="40" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="468" y="500" width="464" height="490" rx="12" fill="#fff" stroke="#303030" stroke-width="1.5"/>
<rect x="995" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5"/>
<path d="M 357 425 V 462 H 600 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 1032 425 V 462 H 800 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 408 725 H 458" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 935 725 H 985" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)"/>
<text x="66" y="539" font-size="18.0" font-weight="700" fill="#646464"><tspan x="66.0" dy="0">ENTRADA</tspan></text>
<text x="66" y="579" font-size="26.0" font-weight="700" fill="#202020"><tspan x="66.0" dy="0">Informações sobre as</tspan><tspan x="66.0" dy="35.1">características cognitivas</tspan><tspan x="66.0" dy="35.1">da pessoa</tspan></text>
<text x="66" y="695.2" font-size="21.0" font-weight="400" fill="#202020"><tspan x="66.0" dy="0">Demandas de retenção e uso de</tspan><tspan x="66.0" dy="28.35">informações</tspan></text>
<text x="66" y="758.5500000000001" font-size="21.0" font-weight="400" fill="#202020"><tspan x="66.0" dy="0">Atenção e compreensão de</tspan><tspan x="66.0" dy="28.35">explicações</tspan></text>
<text x="66" y="833.9000000000001" font-size="20.0" font-weight="400" fill="#646464"><tspan x="66.0" dy="0">A prova de conceito também inclui</tspan><tspan x="66.0" dy="27.0">características sensoriais e físicas</tspan></text>
<text x="66" y="894.9000000000001" font-size="20.0" font-weight="400" fill="#646464"><tspan x="66.0" dy="0">Entradas: personas fictícias</tspan></text>
<text x="494" y="539" font-size="18.0" font-weight="700" fill="#646464"><tspan x="494.0" dy="0">PROCESSO / GERAÇÃO E VALIDAÇÃO</tspan></text>
<text x="494" y="580" font-size="30.0" font-weight="700" fill="#202020"><tspan x="494.0" dy="0">IA generativa</tspan></text>
<text x="494" y="632" font-size="23.0" font-weight="400" fill="#202020"><tspan x="494.0" dy="0">Combinar informações pessoais e</tspan><tspan x="494.0" dy="31.05">conhecimento de design para propor</tspan><tspan x="494.0" dy="31.05">uma interface dentro dos limites</tspan><tspan x="494.0" dy="31.05">permitidos</tspan></text>
<text x="494" y="774.15" font-size="20.5" font-weight="400" fill="#646464"><tspan x="494.0" dy="0">Calcular os valores determinados por fórmulas</tspan></text>
<text x="682" y="819.15" font-size="28.0" font-weight="400" fill="#202020"><tspan x="682.0" dy="0">⇅</tspan></text>
<rect x="490" y="842.15" width="420" height="95" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="512" y="869.15" font-size="21.0" font-weight="700" fill="#202020"><tspan x="512.0" dy="0">Etapa separada: verificar os requisitos</tspan><tspan x="512.0" dy="28.35">definidos</tspan></text>
<text x="1021" y="539" font-size="18.0" font-weight="700" fill="#646464"><tspan x="1021.0" dy="0">SAÍDA</tspan></text>
<text x="1021" y="579" font-size="23.5" font-weight="700" fill="#202020"><tspan x="1021.0" dy="0">Uma interface personalizada</tspan></text>
<text x="1021" y="629" font-size="24.0" font-weight="700" fill="#202020"><tspan x="1021.0" dy="0">+ Razões e evidências que</tspan><tspan x="1021.0" dy="32.400000000000006">fundamentam as mudanças</tspan></text>
<rect x="1021" y="730.4" width="311" height="102" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1035" y="744.4" width="90" height="72" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1140" y="744.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1140" y="770.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1140" y="796.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="1021" y="873.4" font-size="20.0" font-weight="400" fill="#646464"><tspan x="1021.0" dy="0">Definir a disposição, a</tspan><tspan x="1021.0" dy="27.0">apresentação e os textos</tspan></text>
