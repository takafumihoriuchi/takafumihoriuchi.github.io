<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" width="1200" height="1232" viewBox="0 0 1200 1232" role="img" aria-labelledby="title desc"><title id="title">Configurer l’interface avant le premier trajet</title><desc id="desc">Concept envisagé. Cinq étapes : lancement de la configuration à l’arrêt, entretien, vérification de la compréhension, proposition et essai, puis début de l’utilisation. Chaque étape présente les actions de l’utilisateur et la réponse de l’IA.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="1200" height="1232" fill="white"/><text data-index="2" data-max-width="1120" data-box="" x="40" y="55" font-size="33" font-weight="700" fill="#202020"><tspan x="40" dy="0">Configurer l’interface avant le premier trajet</tspan></text>
<text data-index="3" data-max-width="1120" data-box="" x="40" y="103" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">Concept envisagé / La configuration par dialogue n’est pas réalisée dans cette preuve de concept</tspan></text>
<text data-index="4" data-max-width="435" data-box="" x="215" y="154" font-size="22" font-weight="700" fill="#202020"><tspan x="215" dy="0">Actions et réflexions de l’utilisateur</tspan></text>
<text data-index="5" data-max-width="435" data-box="" x="697" y="154" font-size="22" font-weight="700" fill="#202020"><tspan x="697" dy="0">Réponses de l’IA et du système</tspan></text>
<rect id="stage-1" data-container="true" x="40" y="194" width="1120" height="165.76000000000005" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text data-index="6" data-max-width="125" data-box="stage-1" x="62" y="229" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">01</tspan></text>
<text data-index="7" data-max-width="140" data-box="stage-1" x="62" y="265" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Première fois à</tspan><tspan x="62" dy="23.76">bord</tspan></text>
<text data-index="8" data-max-width="435" data-box="stage-1" x="215" y="232" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Lancer la configuration à l’arrêt</tspan></text>
<text data-index="9" data-max-width="435" data-box="stage-1" x="215" y="270" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">« J’aimerais que ce soit facile à utiliser. »</tspan></text>
<text data-index="10" data-max-width="435" data-box="stage-1" x="697" y="232" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Expliquer l’objectif et demander s’il faut</tspan><tspan x="697" dy="29.040000000000003">commencer</tspan></text>
<text data-index="11" data-max-width="435" data-box="stage-1" x="697" y="299.04" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Permettre à l’utilisateur de commencer plus</tspan><tspan x="697" dy="27.720000000000002">tard</tspan></text>
<path d="M 85 360.76000000000005 V 380.76000000000005" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<rect id="stage-2" data-container="true" x="40" y="385.76000000000005" width="1120" height="165.76000000000005" rx="12" fill="#fff" stroke="#d2d2ca" stroke-width="1.5"/>
<text data-index="12" data-max-width="125" data-box="stage-2" x="62" y="420.76000000000005" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">02</tspan></text>
<text data-index="13" data-max-width="140" data-box="stage-2" x="62" y="456.76000000000005" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Entretien</tspan></text>
<text data-index="14" data-max-width="435" data-box="stage-2" x="215" y="423.76000000000005" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Décrire les difficultés du quotidien</tspan></text>
<text data-index="15" data-max-width="435" data-box="stage-2" x="215" y="461.76000000000005" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">« J’oublie les consignes précédentes quand</tspan><tspan x="215" dy="27.720000000000002">les suivantes arrivent. »</tspan></text>
<text data-index="16" data-max-width="435" data-box="stage-2" x="697" y="423.76000000000005" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Poser des questions sur des situations</tspan><tspan x="697" dy="29.040000000000003">concrètes</tspan></text>
<text data-index="17" data-max-width="435" data-box="stage-2" x="697" y="490.80000000000007" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Identifier les sollicitations de la mémoire et de</tspan><tspan x="697" dy="27.720000000000002">l’attention</tspan></text>
<path d="M 85 552.5200000000001 V 572.5200000000001" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<rect id="stage-3" data-container="true" x="40" y="577.5200000000001" width="1120" height="136.72000000000003" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text data-index="18" data-max-width="125" data-box="stage-3" x="62" y="612.5200000000001" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">03</tspan></text>
<text data-index="19" data-max-width="140" data-box="stage-3" x="62" y="648.5200000000001" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Vérifier la</tspan><tspan x="62" dy="23.76">compréhension</tspan></text>
<text data-index="20" data-max-width="435" data-box="stage-3" x="215" y="615.5200000000001" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Confirmer ou corriger l’interprétation de l’IA</tspan></text>
<text data-index="21" data-max-width="435" data-box="stage-3" x="215" y="653.5200000000001" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">« Cette partie est juste. Pour celle-ci, c’est</tspan><tspan x="215" dy="27.720000000000002">différent. »</tspan></text>
<text data-index="22" data-max-width="435" data-box="stage-3" x="697" y="615.5200000000001" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Résumer les propos de l’utilisateur</tspan></text>
<text data-index="23" data-max-width="435" data-box="stage-3" x="697" y="653.5200000000001" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Distinguer les déclarations de l’utilisateur des</tspan><tspan x="697" dy="27.720000000000002">mesures</tspan></text>
<path d="M 85 715.2400000000001 V 735.2400000000001" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<rect id="stage-4" data-container="true" x="40" y="740.2400000000001" width="1120" height="165.76" rx="12" fill="#fff" stroke="#d2d2ca" stroke-width="1.5"/>
<text data-index="24" data-max-width="125" data-box="stage-4" x="62" y="775.2400000000001" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">04</tspan></text>
<text data-index="25" data-max-width="140" data-box="stage-4" x="62" y="811.2400000000001" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Proposition et</tspan><tspan x="62" dy="23.76">essai</tspan></text>
<text data-index="26" data-max-width="435" data-box="stage-4" x="215" y="778.2400000000001" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Essayer l’interface à l’arrêt</tspan></text>
<text data-index="27" data-max-width="435" data-box="stage-4" x="215" y="816.2400000000001" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">« C’est plus facile quand les informations</tspan><tspan x="215" dy="27.720000000000002">restent à l’écran. »</tspan></text>
<text data-index="28" data-max-width="435" data-box="stage-4" x="697" y="778.2400000000001" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Présenter l’interface et les raisons des</tspan><tspan x="697" dy="29.040000000000003">modifications</tspan></text>
<text data-index="29" data-max-width="435" data-box="stage-4" x="697" y="845.2800000000001" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Permettre des ajustements ou le</tspan><tspan x="697" dy="27.720000000000002">rétablissement de l’interface d’origine</tspan></text>
<path d="M 85 907.0000000000001 V 927.0000000000001" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<rect id="stage-5" data-container="true" x="40" y="932.0000000000001" width="1120" height="136.7199999999999" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text data-index="30" data-max-width="125" data-box="stage-5" x="62" y="967.0000000000001" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">05</tspan></text>
<text data-index="31" data-max-width="140" data-box="stage-5" x="62" y="1003.0000000000001" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Début</tspan><tspan x="62" dy="23.76">d’utilisation</tspan></text>
<text data-index="32" data-max-width="435" data-box="stage-5" x="215" y="970.0000000000001" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Commencer à utiliser l’interface confirmée</tspan></text>
<text data-index="33" data-max-width="435" data-box="stage-5" x="215" y="1008.0000000000001" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">« Je vais essayer avec ces réglages. »</tspan></text>
<text data-index="34" data-max-width="435" data-box="stage-5" x="697" y="970.0000000000001" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Enregistrer l’interface initiale</tspan></text>
<text data-index="35" data-max-width="435" data-box="stage-5" x="697" y="1008.0000000000001" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Conserver sa structure de base pendant la</tspan><tspan x="697" dy="27.720000000000002">conduite</tspan></text>
<text data-index="36" data-max-width="1110" data-box="" x="40" y="1108.72" font-size="25" font-weight="700" fill="#202020"><tspan x="40" dy="0">Transformer le dialogue en informations personnelles que l’utilisateur peut confirmer et</tspan><tspan x="40" dy="33">corriger.</tspan></text>
<text data-index="37" data-max-width="1110" data-box="" x="40" y="1184.72" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">Les distinguer des mesures cognitives et des diagnostics ; évaluer d’autres éléments selon les besoins.</tspan></text></svg>
