<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" width="480" height="1768" viewBox="0 0 480 1768" role="img" aria-labelledby="title desc"><title id="title">Générer une interface à partir d’informations personnelles</title><desc id="desc">Schéma conceptuel pour mobile, à lire de haut en bas : informations personnelles en entrée ; ensembles de connaissances A et B ; IA générative et validation distincte ; interface adaptée accompagnée des raisons des modifications.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="480" height="1768" fill="white"/><rect id="input" data-container="true" x="24" y="26" width="402" height="289.8" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5"/>
<text data-index="2" data-max-width="350" data-box="input" x="50" y="64" font-size="18" font-weight="700" fill="#646464"><tspan x="50" dy="0">ENTRÉE</tspan></text>
<text data-index="3 4" data-max-width="350" data-box="input" x="50" y="94" font-size="25" font-weight="700" fill="#202020"><tspan x="50" dy="0">Informations sur les</tspan><tspan x="50" dy="33">caractéristiques cognitives</tspan><tspan x="50" dy="33">de l’utilisateur</tspan></text>
<text data-index="5" data-max-width="350" data-box="input" x="50" y="203" font-size="20" font-weight="400" fill="#202020"><tspan x="50" dy="0">La preuve de concept inclut aussi les</tspan><tspan x="50" dy="26.400000000000002">caractéristiques sensorielles et</tspan><tspan x="50" dy="26.400000000000002">physiques</tspan></text>
<text data-index="6" data-max-width="350" data-box="input" x="50" y="288.8" font-size="20" font-weight="400" fill="#202020"><tspan x="50" dy="0">Données d’entrée : personas fictifs</tspan></text>
<text data-index="7" data-max-width="420" data-box="" x="24" y="353.8" font-size="23" font-weight="700" fill="#202020"><tspan x="24" dy="0">Connaissances utilisées par l’IA</tspan></text>
<rect id="knowledge-a" data-container="true" x="24" y="398.8" width="402" height="290.7999999999999" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text data-index="8" data-max-width="350" data-box="knowledge-a" x="50" y="436.8" font-size="18" font-weight="700" fill="#646464"><tspan x="50" dy="0">Connaissances A</tspan></text>
<text data-index="9" data-max-width="350" data-box="knowledge-a" x="50" y="469.8" font-size="25" font-weight="700" fill="#202020"><tspan x="50" dy="0">Principes et exigences de</tspan><tspan x="50" dy="33">base de l’interface</tspan></text>
<text data-index="10" data-max-width="350" data-box="knowledge-a" x="50" y="543.8" font-size="20" font-weight="400" fill="#202020"><tspan x="50" dy="0">Cohérence · Retour d’information ·</tspan><tspan x="50" dy="26.400000000000002">Regroupement</tspan></text>
<text data-index="11" data-max-width="350" data-box="knowledge-a" x="50" y="603.1999999999999" font-size="20" font-weight="400" fill="#202020"><tspan x="50" dy="0">Sécurité · Accessibilité</tspan></text>
<text data-index="12" data-max-width="350" data-box="knowledge-a" x="50" y="636.1999999999999" font-size="20" font-weight="400" fill="#202020"><tspan x="50" dy="0">Quand les exigences s’appliquent et</tspan><tspan x="50" dy="26.400000000000002">comment les vérifier</tspan></text>
<rect id="knowledge-b" data-container="true" x="24" y="729.5999999999999" width="402" height="324.79999999999995" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text data-index="13" data-max-width="350" data-box="knowledge-b" x="50" y="767.5999999999999" font-size="18" font-weight="700" fill="#646464"><tspan x="50" dy="0">Connaissances B</tspan></text>
<text data-index="14" data-max-width="350" data-box="knowledge-b" x="50" y="800.5999999999999" font-size="25" font-weight="700" fill="#202020"><tspan x="50" dy="0">Recommandations</tspan><tspan x="50" dy="33">d’interface fondées sur les</tspan><tspan x="50" dy="33">caractéristiques humaines</tspan></text>
<text data-index="15" data-max-width="350" data-box="knowledge-b" x="50" y="907.5999999999999" font-size="20" font-weight="400" fill="#202020"><tspan x="50" dy="0">Résultats de recherche → Principes de</tspan><tspan x="50" dy="26.400000000000002">présentation</tspan></text>
<text data-index="16" data-max-width="350" data-box="knowledge-b" x="50" y="963.9999999999999" font-size="20" font-weight="400" fill="#202020"><tspan x="50" dy="0">→ Interfaces recommandées</tspan></text>
<text data-index="17" data-max-width="350" data-box="knowledge-b" x="50" y="1000.9999999999999" font-size="20" font-weight="400" fill="#202020"><tspan x="50" dy="0">Distinguer les résultats de recherche</tspan><tspan x="50" dy="26.400000000000002">des choix de conception</tspan></text>
<rect id="process" data-container="true" x="24" y="1094.3999999999999" width="402" height="363.28" rx="12" fill="#fff" stroke="#303030" stroke-width="1.5"/>
<text data-index="18" data-max-width="350" data-box="process" x="50" y="1132.3999999999999" font-size="18" font-weight="700" fill="#646464"><tspan x="50" dy="0">TRAITEMENT / GÉNÉRATION ET</tspan><tspan x="50" dy="23.76">VALIDATION</tspan></text>
<text data-index="19" data-max-width="350" data-box="process" x="50" y="1189.1599999999999" font-size="28" font-weight="700" fill="#202020"><tspan x="50" dy="0">IA générative</tspan></text>
<text data-index="20" data-max-width="350" data-box="process" x="50" y="1234.1599999999999" font-size="22" font-weight="400" fill="#202020"><tspan x="50" dy="0">Proposer une interface à partir des</tspan><tspan x="50" dy="29.040000000000003">informations personnelles et des</tspan><tspan x="50" dy="29.040000000000003">connaissances de conception</tspan></text>
<text data-index="21" data-max-width="350" data-box="process" x="50" y="1331.2399999999998" font-size="20" font-weight="400" fill="#202020"><tspan x="50" dy="0">Calculer les valeurs définies par des</tspan><tspan x="50" dy="26.400000000000002">formules</tspan></text>
<text data-index="22" data-max-width="350" data-box="process" x="50" y="1399.6399999999999" font-size="22" font-weight="700" fill="#202020"><tspan x="50" dy="0">Étape distincte : vérifier les</tspan><tspan x="50" dy="29.040000000000003">exigences</tspan></text>
<rect id="output" data-container="true" x="24" y="1497.6799999999998" width="402" height="173.3599999999999" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5"/>
<text data-index="23" data-max-width="350" data-box="output" x="50" y="1535.6799999999998" font-size="18" font-weight="700" fill="#646464"><tspan x="50" dy="0">SORTIE</tspan></text>
<text data-index="24" data-max-width="350" data-box="output" x="50" y="1568.6799999999998" font-size="27" font-weight="700" fill="#202020"><tspan x="50" dy="0">Une interface adaptée</tspan></text>
<text data-index="25" data-max-width="350" data-box="output" x="50" y="1610.6799999999998" font-size="23" font-weight="700" fill="#202020"><tspan x="50" dy="0">+ Raisons et éléments étayant</tspan><tspan x="50" dy="30.360000000000003">les modifications</tspan></text>
<path d="M 426 111 H 458 V 1189.3999999999999 H 434" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 24 473.8 H 10 V 1074.3999999999999 H 160 V 1087.3999999999999" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 226 1054.3999999999999 V 1087.3999999999999" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 226 1457.6799999999998 V 1490.6799999999998" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<text data-index="26" data-max-width="420" data-box="" x="24" y="1711.0399999999997" font-size="18" font-weight="400" fill="#646464"><tspan x="24" dy="0">Trait plein : flux du processus · Pointillés :</tspan><tspan x="24" dy="23.76">consultation des connaissances</tspan></text></svg>
