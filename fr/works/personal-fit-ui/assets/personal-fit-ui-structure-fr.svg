<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" width="1400" height="1034" viewBox="0 0 1400 1034" role="img" aria-labelledby="title desc"><title id="title">Informations personnelles et deux types de connaissances de conception</title><desc id="desc">Schéma conceptuel du système proposé. Les caractéristiques cognitives sont associées aux règles de base de l’interface et aux recommandations fondées sur les caractéristiques humaines. L’IA générative propose une interface, une étape distincte la valide, et le résultat comprend l’interface ainsi que les raisons des modifications.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="1400" height="1034" fill="white"/><text data-index="2" data-max-width="1320" data-box="" x="40" y="42" font-size="22" font-weight="700" fill="#202020"><tspan x="40" dy="0">Connaissances préparées par le concepteur pour l’IA</tspan></text>
<rect id="knowledge-a" data-container="true" x="40" y="82" width="635" height="308.32" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text data-index="3" data-max-width="583" data-box="knowledge-a" x="66" y="120" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">Connaissances A</tspan></text>
<text data-index="4" data-max-width="583" data-box="knowledge-a" x="66" y="153" font-size="28" font-weight="700" fill="#202020"><tspan x="66" dy="0">Exigences de base de l’interface</tspan></text>
<text data-index="5" data-max-width="583" data-box="knowledge-a" x="66" y="199" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">Principes de conception</tspan></text>
<text data-index="6" data-max-width="583" data-box="knowledge-a" x="66" y="223" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Cohérence · Retour d’information · Regroupement des</tspan><tspan x="66" dy="27.720000000000002">informations</tspan></text>
<text data-index="7" data-max-width="583" data-box="knowledge-a" x="66" y="289.72" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">Exigences</tspan></text>
<text data-index="8" data-max-width="583" data-box="knowledge-a" x="66" y="313.72" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Sécurité · Accessibilité · Restrictions d’interaction</tspan></text>
<text data-index="9" data-max-width="583" data-box="knowledge-a" x="66" y="350.72" font-size="19" font-weight="400" fill="#646464"><tspan x="66" dy="0">Définir quand les exigences s’appliquent et comment les vérifier</tspan></text>
<rect id="knowledge-b" data-container="true" x="705" y="82" width="655" height="308.32" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text data-index="10" data-max-width="603" data-box="knowledge-b" x="731" y="120" font-size="18" font-weight="700" fill="#646464"><tspan x="731" dy="0">Connaissances B</tspan></text>
<text data-index="11" data-max-width="603" data-box="knowledge-b" x="731" y="153" font-size="26" font-weight="700" fill="#202020"><tspan x="731" dy="0">Recommandations d’interface fondées sur les</tspan><tspan x="731" dy="34.32">caractéristiques humaines</tspan></text>
<text data-index="12" data-max-width="603" data-box="knowledge-b" x="731" y="225.32" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Recherches sur les caractéristiques humaines</tspan></text>
<text data-index="13" data-max-width="603" data-box="knowledge-b" x="731" y="247.32" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text data-index="14" data-max-width="603" data-box="knowledge-b" x="731" y="273.32" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Principes de présentation de l’information</tspan></text>
<text data-index="15" data-max-width="603" data-box="knowledge-b" x="731" y="295.32" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text data-index="16" data-max-width="603" data-box="knowledge-b" x="731" y="321.32" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Recommandations d’interface adaptées à ces caractéristiques</tspan></text>
<text data-index="17" data-max-width="603" data-box="knowledge-b" x="731" y="364.32" font-size="19" font-weight="400" fill="#646464"><tspan x="731" dy="0">Distinguer les résultats de recherche des choix de conception</tspan></text>
<rect id="input" data-container="true" x="40" y="466.32" width="365" height="477.52000000000004" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5"/>
<text data-index="18" data-max-width="313" data-box="input" x="66" y="504.32" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">ENTRÉE</tspan></text>
<text data-index="19" data-max-width="313" data-box="input" x="66" y="542.3199999999999" font-size="26" font-weight="700" fill="#202020"><tspan x="66" dy="0">Informations sur les</tspan><tspan x="66" dy="34.32">caractéristiques</tspan><tspan x="66" dy="34.32">cognitives de l’utilisateur</tspan></text>
<text data-index="20" data-max-width="313" data-box="input" x="66" y="655.9599999999999" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Sollicitations liées au maintien en</tspan><tspan x="66" dy="27.720000000000002">mémoire et à l’utilisation</tspan><tspan x="66" dy="27.720000000000002">d’informations</tspan></text>
<text data-index="21" data-max-width="313" data-box="input" x="66" y="745.4" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Attention et compréhension des</tspan><tspan x="66" dy="27.720000000000002">explications</tspan></text>
<text data-index="22" data-max-width="313" data-box="input" x="66" y="818.12" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">La preuve de concept inclut aussi</tspan><tspan x="66" dy="26.400000000000002">les caractéristiques sensorielles et</tspan><tspan x="66" dy="26.400000000000002">physiques</tspan></text>
<text data-index="23" data-max-width="313" data-box="input" x="66" y="903.92" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">Données d’entrée : personas fictifs</tspan></text>
<rect id="process" data-container="true" x="468" y="466.32" width="464" height="477.52000000000004" rx="12" fill="#fff" stroke="#303030" stroke-width="1.5"/>
<text data-index="24" data-max-width="412" data-box="process" x="494" y="504.32" font-size="18" font-weight="700" fill="#646464"><tspan x="494" dy="0">TRAITEMENT / GÉNÉRATION ET VALIDATION</tspan></text>
<text data-index="25" data-max-width="412" data-box="process" x="494" y="542.3199999999999" font-size="30" font-weight="700" fill="#202020"><tspan x="494" dy="0">IA générative</tspan></text>
<text data-index="26" data-max-width="412" data-box="process" x="494" y="592.3199999999999" font-size="23" font-weight="400" fill="#202020"><tspan x="494" dy="0">Associer les informations personnelles</tspan><tspan x="494" dy="30.360000000000003">aux connaissances de conception pour</tspan><tspan x="494" dy="30.360000000000003">proposer une interface dans les limites</tspan><tspan x="494" dy="30.360000000000003">autorisées</tspan></text>
<text data-index="27" data-max-width="412" data-box="process" x="494" y="728.4" font-size="21" font-weight="400" fill="#646464"><tspan x="494" dy="0">Calculer les valeurs définies par des</tspan><tspan x="494" dy="27.720000000000002">formules</tspan></text>
<text data-index="28" data-max-width="50" data-box="process" x="686" y="793.12" font-size="28" font-weight="400" fill="#202020"><tspan x="686" dy="0">⇅</tspan></text>
<rect id="validation" data-container="true" x="490" y="838.12" width="420" height="90.72000000000003" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text data-index="29" data-max-width="376" data-box="validation" x="512" y="868.12" font-size="21" font-weight="700" fill="#202020"><tspan x="512" dy="0">Étape distincte : vérifier les</tspan><tspan x="512" dy="27.720000000000002">exigences définies</tspan></text>
<rect id="output" data-container="true" x="995" y="466.32" width="365" height="477.52000000000004" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5"/>
<text data-index="30" data-max-width="313" data-box="output" x="1021" y="504.32" font-size="18" font-weight="700" fill="#646464"><tspan x="1021" dy="0">SORTIE</tspan></text>
<text data-index="31" data-max-width="313" data-box="output" x="1021" y="542.3199999999999" font-size="28" font-weight="700" fill="#202020"><tspan x="1021" dy="0">Une interface adaptée</tspan></text>
<text data-index="32" data-max-width="313" data-box="output" x="1021" y="590.3199999999999" font-size="24" font-weight="700" fill="#202020"><tspan x="1021" dy="0">+ Raisons et éléments</tspan><tspan x="1021" dy="31.68">étayant les modifications</tspan></text>
