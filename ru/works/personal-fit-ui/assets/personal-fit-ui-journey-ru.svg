<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc" lang="ru"><title id="title">Настройка интерфейса перед первой поездкой</title><desc id="desc">Концепция будущего взаимодействия. Пять этапов: начало настройки в неподвижном автомобиле, беседа, проверка понимания, предложение и опробование, начало использования. На каждом этапе показаны действия пользователя и ответ ИИ.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="1200" height="1220" fill="white" /><text x="40" y="55" font-size="33" font-weight="700" fill="#202020"><tspan x="40" dy="0">Настройка интерфейса перед первой поездкой</tspan></text>
<text x="40" y="99" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">Концепция будущего взаимодействия / Настройка в диалоге не реализована в PoC</tspan></text>
<text x="215" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="215" dy="0">Действия и мысли пользователя</tspan></text>
<text x="697" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="697" dy="0">Ответы ИИ и системы</tspan></text>
<rect x="40" y="190" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="225" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">01</tspan></text>
<text x="62" y="262" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Впервые</tspan><tspan x="62" dy="24.3">в автомобиле</tspan></text>
<text x="215" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Начать настройку в неподвижном авто</tspan></text>
<text x="215" y="276" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Хочу, чтобы пользоваться было удобно».</tspan></text>
<text x="697" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Объяснить цель и спросить,</tspan><tspan x="697" dy="29.700000000000003">можно ли начать</tspan></text>
<text x="697" y="284" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Дать возможность начать позже</tspan></text>
<path d="M 85 339 V 356" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="360" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="395" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">02</tspan></text>
<text x="62" y="432" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Беседа</tspan></text>
<text x="215" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Описать повседневные трудности</tspan></text>
<text x="215" y="446" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Когда появляются новые указания,</tspan><tspan x="215" dy="28.35">я забываю предыдущие».</tspan></text>
<text x="697" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Спросить о конкретных ситуациях</tspan></text>
<text x="697" y="454" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Выявить нагрузку на память</tspan><tspan x="697" dy="28.35">и внимание</tspan></text>
<path d="M 85 509 V 526" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="530" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="565" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">03</tspan></text>
<text x="62" y="602" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Проверка</tspan><tspan x="62" dy="24.3">понимания</tspan></text>
<text x="215" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Подтвердить или исправить</tspan><tspan x="215" dy="29.700000000000003">интерпретацию ИИ</tspan></text>
<text x="215" y="630.0" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Здесь верно. А здесь — иначе».</tspan></text>
<text x="697" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Обобщить слова пользователя</tspan></text>
<text x="697" y="624" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Отделить самоотчёт пользователя</tspan><tspan x="697" dy="28.35">от результатов измерений</tspan></text>
<path d="M 85 679 V 696" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="700" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="735" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">04</tspan></text>
<text x="62" y="772" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Предложение</tspan><tspan x="62" dy="24.3">и проба</tspan></text>
<text x="215" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Опробовать интерфейс</tspan><tspan x="215" dy="29.700000000000003">в неподвижном автомобиле</tspan></text>
<text x="215" y="800.0" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Удобно, когда информация</tspan><tspan x="215" dy="28.35">остаётся на экране».</tspan></text>
<text x="697" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Представить интерфейс</tspan><tspan x="697" dy="29.700000000000003">и причины изменений</tspan></text>
<text x="697" y="794" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Дать возможность внести изменения</tspan><tspan x="697" dy="28.35">или вернуть исходный интерфейс</tspan></text>
<path d="M 85 849 V 866" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="870" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="905" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">05</tspan></text>
<text x="62" y="942" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Начало</tspan><tspan x="62" dy="24.3">использования</tspan></text>
<text x="215" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Начать пользоваться</tspan><tspan x="215" dy="29.700000000000003">подтверждённым интерфейсом</tspan></text>
<text x="215" y="970.0" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">«Попробую начать с этих настроек».</tspan></text>
<text x="697" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Сохранить начальный интерфейс</tspan></text>
<text x="697" y="964" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Сохранять базовую структуру</tspan><tspan x="697" dy="28.35">интерфейса во время движения</tspan></text>
<text x="40" y="1103" font-size="25" font-weight="700" fill="#202020"><tspan x="40" dy="0">Из беседы — сведения о пользователе, которые можно подтвердить и исправить.</tspan></text>
<text x="40" y="1148" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">Отделять эти сведения от когнитивных измерений и диагнозов; при необходимости оценивать другие параметры.</tspan></text></svg>