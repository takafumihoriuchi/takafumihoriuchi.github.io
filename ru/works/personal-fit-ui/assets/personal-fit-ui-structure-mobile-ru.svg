<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1641" viewBox="0 0 480 1641" role="img" aria-labelledby="title desc" lang="ru"><title id="title">Создание интерфейса на основе сведений о пользователе</title><desc id="desc">Концептуальная схема для мобильного экрана, читаемая сверху вниз: индивидуальные данные; знания A и B; генеративный ИИ и отдельная проверка; адаптированный интерфейс с причинами изменений.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="480" height="1641" fill="white" /><rect x="24" y="26" width="402" height="222" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="62" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">ВХОДНЫЕ ДАННЫЕ</tspan></text>
<text x="48" y="95" font-size="24" font-weight="700" fill="#202020"><tspan x="48" dy="0">Сведения о когнитивных</tspan></text>
<text x="48" y="126" font-size="24" font-weight="700" fill="#202020"><tspan x="48" dy="0">особенностях пользователя</tspan></text>
<text x="48" y="164" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">PoC также учитывает сенсорные</tspan><tspan x="48" dy="27.0">и физические особенности</tspan></text>
<text x="48" y="224" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Данные: вымышленные персоны</tspan></text>
<text x="24" y="284" font-size="23" font-weight="700" fill="#202020"><tspan x="24" dy="0">Знания, используемые ИИ</tspan></text>
<rect x="24" y="329" width="402" height="266.75" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="365" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">Знания A</tspan></text>
<text x="48" y="400" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">Базовые принципы</tspan><tspan x="48" dy="33.75">и требования к интерфейсу</tspan></text>
<text x="48" y="467.75" font-size="18" font-weight="400" fill="#202020"><tspan x="48" dy="0">Согласованность · Обратная связь</tspan><tspan x="48" dy="24.3">Группировка</tspan></text>
<text x="48" y="517.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Безопасность · Доступность</tspan></text>
<text x="48" y="548.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Условия применения требований</tspan><tspan x="48" dy="27.0">и способы их проверки</tspan></text>
<rect x="24" y="631.75" width="402" height="329.5" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="667.75" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">Знания B</tspan></text>
<text x="48" y="702.75" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">Рекомендации для</tspan><tspan x="48" dy="33.75">интерфейса на основе</tspan><tspan x="48" dy="33.75">особенностей человека</tspan></text>
<text x="48" y="813.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Результаты исследований →</tspan><tspan x="48" dy="27.0">принципы представления</tspan></text>
<text x="48" y="872.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">→ Рекомендуемые интерфейсы</tspan></text>
<text x="48" y="910.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Отделять результаты исследований</tspan><tspan x="48" dy="27.0">от проектных решений</tspan></text>
<rect x="24" y="997.25" width="402" height="369.4000000000001" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="1033.25" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">ПРОЦЕСС / ГЕНЕРАЦИЯ</tspan><tspan x="48" dy="24.3">И ПРОВЕРКА</tspan></text>
<text x="48" y="1092.55" font-size="28" font-weight="700" fill="#202020"><tspan x="48" dy="0">Генеративный ИИ</tspan></text>
<text x="48" y="1139.55" font-size="22" font-weight="400" fill="#202020"><tspan x="48" dy="0">Предложить интерфейс на основе</tspan><tspan x="48" dy="29.700000000000003">сведений о пользователе и знаний</tspan><tspan x="48" dy="29.700000000000003">о проектировании</tspan></text>
<text x="48" y="1239.95" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Вычислить значения, заданные</tspan><tspan x="48" dy="27.0">формулами</tspan></text>
<text x="48" y="1310.95" font-size="22" font-weight="700" fill="#202020"><tspan x="48" dy="0">Отдельный этап:</tspan><tspan x="48" dy="29.700000000000003">проверка требований</tspan></text>
<rect x="24" y="1402.65" width="402" height="172.04999999999995" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="1438.65" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">РЕЗУЛЬТАТ</tspan></text>
<text x="48" y="1473.65" font-size="24.5" font-weight="700" fill="#202020"><tspan x="48" dy="0">Адаптированный интерфейс</tspan></text>
<text x="48" y="1516.65" font-size="23" font-weight="700" fill="#202020"><tspan x="48" dy="0">+ Причины изменений</tspan><tspan x="48" dy="31.05">и их обоснование</tspan></text>
<path d="M 426 111 H 458 V 1092.25 H 434" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<path d="M 24 404 H 10 V 977.25 H 160 V 990.25" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 226 961.25 V 990.25" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 226 1366.65 V 1395.65" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<text x="24" y="1598" font-size="17" font-weight="400" fill="#646464"><tspan x="24" dy="0">Сплошная: ход процесса</tspan><tspan x="24" dy="22.950000000000003">Пунктир: обращение к знаниям</tspan></text></svg>