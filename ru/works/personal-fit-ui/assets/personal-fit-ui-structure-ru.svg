<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc" lang="ru"><title id="title">Индивидуальные данные и два вида знаний о проектировании</title><desc id="desc">Схема предлагаемой системы. Когнитивные особенности сочетаются с базовыми правилами интерфейса и рекомендациями, основанными на особенностях человека. Генеративный ИИ предлагает интерфейс, отдельный этап проверяет его, а результат включает интерфейс и причины изменений.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="1400" height="1080" fill="white" /><text x="40" y="42" font-size="22" font-weight="700" fill="#202020"><tspan x="40" dy="0">Знания для ИИ, подготовленные дизайнером</tspan></text>
<rect x="40" y="65" width="635" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="705" y="65" width="655" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="66" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">Знания A</tspan></text>
<text x="66" y="138" font-size="28" font-weight="700" fill="#202020"><tspan x="66" dy="0">Базовые требования к интерфейсу</tspan></text>
<text x="66" y="188" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">Принципы проектирования</tspan></text>
<text x="66" y="214" font-size="19.5" font-weight="400" fill="#202020"><tspan x="66" dy="0">Согласованность · Обратная связь · Группировка информации</tspan></text>
<text x="66" y="256" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">Требования</tspan></text>
<text x="66" y="282" font-size="20.5" font-weight="400" fill="#202020"><tspan x="66" dy="0">Безопасность · Доступность · Ограничения взаимодействия</tspan></text>
<text x="66" y="323" font-size="18.5" font-weight="400" fill="#646464"><tspan x="66" dy="0">Определить условия применения и способы проверки требований</tspan></text>
<text x="731" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="731" dy="0">Знания B</tspan></text>
<text x="731" y="138" font-size="26" font-weight="700" fill="#202020"><tspan x="731" dy="0">Рекомендации для интерфейса</tspan><tspan x="731" dy="35.1">на основе особенностей человека</tspan></text>
<text x="731" y="211.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Исследования особенностей человека</tspan></text>
<text x="731" y="233.1" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="259.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Принципы представления информации</tspan></text>
<text x="731" y="283.1" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="307.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Рекомендации для интерфейса с учётом этих особенностей</tspan></text>
<text x="731" y="399" font-size="19" font-weight="400" fill="#646464"><tspan x="731" dy="0">Отделять результаты исследований от проектных решений</tspan></text>
<rect x="40" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="468" y="500" width="464" height="490" rx="12" fill="#fff" stroke="#303030" stroke-width="1.5" />
<rect x="995" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5" />
<path d="M 357 425 V 462 H 600 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 1032 425 V 462 H 800 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 408 725 H 458" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<path d="M 935 725 H 985" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<text x="66" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">ВХОДНЫЕ ДАННЫЕ</tspan></text>
<text x="66" y="579" font-size="24.5" font-weight="700" fill="#202020"><tspan x="66" dy="0">Сведения о когнитивных</tspan><tspan x="66" dy="33.075">особенностях</tspan><tspan x="66" dy="33.075">пользователя</tspan></text>
<text x="66" y="695.2" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Нагрузка при удержании</tspan><tspan x="66" dy="28.35">и использовании информации</tspan></text>
<text x="66" y="758.5500000000001" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Внимание и понимание</tspan><tspan x="66" dy="28.35">объяснений</tspan></text>
<text x="66" y="833.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">PoC также учитывает сенсорные</tspan><tspan x="66" dy="27.0">и физические особенности</tspan></text>
<text x="66" y="894.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">Входные данные:</tspan><tspan x="66" dy="27.0">вымышленные персоны</tspan></text>
<text x="494" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="494" dy="0">ПРОЦЕСС / ГЕНЕРАЦИЯ И ПРОВЕРКА</tspan></text>
<text x="494" y="580" font-size="30" font-weight="700" fill="#202020"><tspan x="494" dy="0">Генеративный ИИ</tspan></text>
<text x="494" y="632" font-size="23" font-weight="400" fill="#202020"><tspan x="494" dy="0">Объединить сведения о пользователе</tspan><tspan x="494" dy="31.05">со знаниями о проектировании</tspan><tspan x="494" dy="31.05">и предложить интерфейс</tspan><tspan x="494" dy="31.05">в допустимых пределах</tspan></text>
<text x="494" y="774.15" font-size="20" font-weight="400" fill="#646464"><tspan x="494" dy="0">Вычислить значения, заданные формулами</tspan></text>
<text x="682" y="819.15" font-size="28" font-weight="400" fill="#202020"><tspan x="682" dy="0">⇅</tspan></text>
<rect x="490" y="842.15" width="420" height="95" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="512" y="869.15" font-size="21" font-weight="700" fill="#202020"><tspan x="512" dy="0">Отдельный этап: проверка</tspan><tspan x="512" dy="28.35">заданных требований</tspan></text>
<text x="1021" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="1021" dy="0">РЕЗУЛЬТАТ</tspan></text>
<text x="1021" y="579" font-size="28" font-weight="700" fill="#202020"><tspan x="1021" dy="0">Адаптированный</tspan><tspan x="1021" dy="37.800000000000004">интерфейс</tspan></text>
<text x="1021" y="660" font-size="24" font-weight="700" fill="#202020"><tspan x="1021" dy="0">+ Причины изменений</tspan><tspan x="1021" dy="32.400000000000006">и их обоснование</tspan></text>
<rect x="1021" y="730.4" width="311" height="102" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1035" y="744.4" width="90" height="72" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1140" y="744.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1140" y="770.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1140" y="796.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<text x="1021" y="873.4" font-size="20" font-weight="400" fill="#646464"><tspan x="1021" dy="0">Определить компоновку,</tspan><tspan x="1021" dy="27.0">представление и формулировки</tspan></text>
<path d="M 40 1038 H 86" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<text x="103" y="1045" font-size="19" font-weight="400" fill="#202020"><tspan x="103" dy="0">Ход процесса</tspan></text>
<path d="M 310 1038 H 356" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<text x="374" y="1045" font-size="19" font-weight="400" fill="#202020"><tspan x="374" dy="0">Обращение к знаниям</tspan></text></svg>