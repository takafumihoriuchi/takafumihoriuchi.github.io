<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Share card source — Takafumi Horiuchi</title>
<!-- Source for og.png, not a page of the site. Rendered to a 1200×630 PNG with
     headless Chrome; see OPERATIONS.md §7 for the command.

     The design tokens are duplicated from style.css rather than linked, so that
     re-rendering the card can never be affected by a later change to the shared
     stylesheet — a share card that silently shifts after it has been cached is
     worse than one that has to be updated deliberately. -->
<style>
  /* The card commits to one ground and states it here rather than asking
     `prefers-color-scheme`. A PNG has no theme to follow: whichever way the
     machine that renders it happens to be set is the way it ships, and the
     same command run on another machine would ship the other one. That is the
     silent shift this file is written to avoid, so the choice is in the file.

     The light ground is the one in use, and it is a choice about the first
     impression rather than a default: the card is what a link to this site
     looks like before anyone has read a word of it, and it should open
     bright. The site itself still follows the reader's own setting; only the
     card is fixed, because a PNG cannot follow anything.

     To switch, swap in the dark values kept below — deliberately, and
     re-render. */
  :root {
    --fg: #1a1a1a;
    --fg-muted: #6b6b68;
    --bg: #fdfdfc;
    --accent: #7c6553;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
            Arial, "Noto Sans", "Liberation Sans", sans-serif;
  }

  /* Dark ground, unused:
       --fg: #e8e8e5;  --fg-muted: #96968f;  --bg: #141413;  --accent: #b49780; */

  * { box-sizing: border-box; }

  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    justify-content: center;
    /* The domain line at the bottom adds visual mass there, so the name block
       is lifted by roughly half its height to keep the composition centred. */
    padding: 0 96px 56px;
  }

  h1 {
    margin: 0;
    font-size: 64px;
    font-weight: 600;
    letter-spacing: -0.02em;   /* large type needs less tracking, not more */
    line-height: 1.1;
  }

  .tagline {
    margin: 20px 0 0;
    font-size: 32px;
    line-height: 1.4;
    color: var(--fg-muted);
  }

  /* The treatment the site gives its section headings, so the card speaks the
     page's own visual language rather than inventing a second one. */
  .domain {
    position: absolute;
    left: 96px;
    bottom: 72px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
</style>
</head>
<body>
  <h1>Takafumi Horiuchi (Design Engineer)</h1>
  <p class="tagline">We design what AI designs.</p>
  <span class="domain">takafumihoriuchi.github.io</span>
</body>
</html>
