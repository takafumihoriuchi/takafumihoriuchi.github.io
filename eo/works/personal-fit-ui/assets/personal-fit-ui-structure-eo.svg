<path d="M 935 725 H 985" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<text x="66" y="539" font-size="18" font-weight="700" fill="#646464" data-text-width="313"><tspan x="66" dy="0">ENIGO</tspan></text>
<text x="66" y="579" font-size="26" font-weight="700" fill="#202020" data-text-width="313"><tspan x="66" dy="0">Informoj pri la</tspan><tspan x="66" dy="35.1">kognaj trajtoj</tspan><tspan x="66" dy="35.1">de la uzanto</tspan></text>
<text x="66" y="695.2" font-size="21" font-weight="400" fill="#202020" data-text-width="313"><tspan x="66" dy="0">Postuloj de memorado</tspan><tspan x="66" dy="28.35">kaj uzado de informoj</tspan></text>
<text x="66" y="758.5500000000001" font-size="21" font-weight="400" fill="#202020" data-text-width="313"><tspan x="66" dy="0">Atento kaj kompreno</tspan><tspan x="66" dy="28.35">de klarigoj</tspan></text>
<text x="66" y="833.9000000000001" font-size="20" font-weight="400" fill="#646464" data-text-width="313"><tspan x="66" dy="0">La PoC ankaŭ inkluzivas</tspan><tspan x="66" dy="27.0">sensajn kaj fizikajn trajtojn</tspan></text>
<text x="66" y="894.9000000000001" font-size="20" font-weight="400" fill="#646464" data-text-width="313"><tspan x="66" dy="0">Enigoj: fikciaj uzantprofiloj</tspan></text>
<text x="494" y="539" font-size="18" font-weight="700" fill="#646464" data-text-width="408"><tspan x="494" dy="0">PROCEZO / GENERADO KAJ KONTROLO</tspan></text>
<text x="494" y="580" font-size="30" font-weight="700" fill="#202020" data-text-width="408"><tspan x="494" dy="0">Generativa AI</tspan></text>
<text x="494" y="632" font-size="23" font-weight="400" fill="#202020" data-text-width="408"><tspan x="494" dy="0">Kunigi personajn informojn</tspan><tspan x="494" dy="31.05">kun dezajna scio por proponi</tspan><tspan x="494" dy="31.05">interfacon ene de la</tspan><tspan x="494" dy="31.05">permesitaj limoj</tspan></text>
<text x="494" y="774.15" font-size="21" font-weight="400" fill="#646464" data-text-width="408"><tspan x="494" dy="0">Kalkuli valorojn difinitajn per formuloj</tspan></text>
<text x="682" y="819.15" font-size="28" font-weight="400" fill="#202020" data-text-width="408"><tspan x="682" dy="0">⇅</tspan></text>
<rect x="490" y="842.15" width="420" height="95" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="512" y="869.15" font-size="21" font-weight="700" fill="#202020" data-text-width="376"><tspan x="512" dy="0">Aparta paŝo: kontroli</tspan><tspan x="512" dy="28.35">la difinitajn postulojn</tspan></text>
<text x="1021" y="539" font-size="18" font-weight="700" fill="#646464" data-text-width="313"><tspan x="1021" dy="0">ELIGO</tspan></text>
<text x="1021" y="579" font-size="28" font-weight="700" fill="#202020" data-text-width="313"><tspan x="1021" dy="0">Personigita interfaco</tspan></text>
<text x="1021" y="629" font-size="24" font-weight="700" fill="#202020" data-text-width="313"><tspan x="1021" dy="0">+ Kialoj kaj evidenteco</tspan><tspan x="1021" dy="32.4">por la ŝanĝoj</tspan></text>
<rect x="1021" y="730.4" width="311" height="102" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1035" y="744.4" width="90" height="72" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1140" y="744.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1140" y="770.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="1140" y="796.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5" />
<text x="1021" y="873.4" font-size="20" font-weight="400" fill="#646464" data-text-width="313"><tspan x="1021" dy="0">Difini aranĝon, prezenton</tspan><tspan x="1021" dy="27.0">kaj vortumon</tspan></text>
<path d="M 40 1038 H 86" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<text x="103" y="1045" font-size="19" font-weight="400" fill="#202020" data-text-width="180"><tspan x="103" dy="0">Proceza fluo</tspan></text>
