<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc" xml:lang="eo"><title id="title">Personaj enigoj kaj du specoj de dezajna scio</title><desc id="desc">Koncepta diagramo de la proponita sistemo. Kognaj trajtoj estas kunigitaj kun bazaj interfacaj reguloj kaj rekomendoj bazitaj sur homaj trajtoj. Generativa AI proponas interfacon, aparta paŝo kontrolas ĝin, kaj la eligo inkluzivas la interfacon kaj kialojn de la ŝanĝoj.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="1400" height="1080" fill="white" /><text x="40" y="42" font-size="22" font-weight="700" fill="#202020" data-text-width="1320"><tspan x="40" dy="0">Scioj uzataj de AI, preparitaj de la dezajnisto</tspan></text>
<rect x="40" y="65" width="635" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="705" y="65" width="655" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="66" y="103" font-size="18" font-weight="700" fill="#646464" data-text-width="583"><tspan x="66" dy="0">Sciaro A</tspan></text>
<text x="66" y="138" font-size="28" font-weight="700" fill="#202020" data-text-width="583"><tspan x="66" dy="0">Bazaj postuloj por la interfaco</tspan></text>
<text x="66" y="188" font-size="20" font-weight="700" fill="#202020" data-text-width="583"><tspan x="66" dy="0">Dezajnaj principoj</tspan></text>
<text x="66" y="214" font-size="21" font-weight="400" fill="#202020" data-text-width="583"><tspan x="66" dy="0">Konsekvenceco · Reagoj · Grupigo de informoj</tspan></text>
<text x="66" y="256" font-size="20" font-weight="700" fill="#202020" data-text-width="583"><tspan x="66" dy="0">Postuloj</tspan></text>
<text x="66" y="282" font-size="21" font-weight="400" fill="#202020" data-text-width="583"><tspan x="66" dy="0">Sekureco · Alireblo · Limigoj de interago</tspan></text>
<text x="66" y="323" font-size="19" font-weight="400" fill="#646464" data-text-width="583"><tspan x="66" dy="0">Difini kiam postuloj validas kaj kiel kontroli ilin</tspan></text>
<text x="731" y="103" font-size="18" font-weight="700" fill="#646464" data-text-width="603"><tspan x="731" dy="0">Sciaro B</tspan></text>
<text x="731" y="138" font-size="26" font-weight="700" fill="#202020" data-text-width="603"><tspan x="731" dy="0">Rekomendoj pri interfacoj laŭ</tspan><tspan x="731" dy="35.1">homaj trajtoj</tspan></text>
<text x="731" y="211.1" font-size="20" font-weight="400" fill="#202020" data-text-width="603"><tspan x="731" dy="0">Esploroj pri homaj trajtoj</tspan></text>
<text x="731" y="233.1" font-size="18" font-weight="400" fill="#202020" data-text-width="603"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="253.1" font-size="20" font-weight="400" fill="#202020" data-text-width="603"><tspan x="731" dy="0">Principoj por prezenti informojn</tspan></text>
<text x="731" y="275.1" font-size="18" font-weight="400" fill="#202020" data-text-width="603"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="295.1" font-size="20" font-weight="400" fill="#202020" data-text-width="603"><tspan x="731" dy="0">Rekomendoj pri interfacoj por tiuj trajtoj</tspan></text>
<text x="731" y="399" font-size="19" font-weight="400" fill="#646464" data-text-width="603"><tspan x="731" dy="0">Distingi esplorajn rezultojn de dezajnaj decidoj</tspan></text>
<rect x="40" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5" />
<rect x="468" y="500" width="464" height="490" rx="12" fill="#fff" stroke="#303030" stroke-width="1.5" />
<rect x="995" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5" />
<path d="M 357 425 V 462 H 600 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 1032 425 V 462 H 800 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
