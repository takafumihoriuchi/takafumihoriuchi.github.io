<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc" xml:lang="eo"><title id="title">Agordi la interfacon antaŭ la unua veturo</title><desc id="desc">Estonta koncepto kun kvin etapoj: komenci agordadon dum la aŭto staras, intervjuo, kontrolo de la kompreno, propono kaj provo, kaj ekuzo. Ĉiu etapo montras la agojn de la uzanto kaj la respondon de AI.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="1200" height="1220" fill="white" /><text x="40" y="55" font-size="33" font-weight="700" fill="#202020" data-text-width="1120"><tspan x="40" dy="0">Agordi la interfacon antaŭ la unua veturo</tspan></text>
<text x="40" y="99" font-size="21" font-weight="400" fill="#646464" data-text-width="1120"><tspan x="40" dy="0">Estonta koncepto / Agordado per konversacio ne estas realigita en la PoC</tspan></text>
<text x="215" y="160" font-size="22" font-weight="700" fill="#202020" data-text-width="442"><tspan x="215" dy="0">Agoj kaj pensoj de la uzanto</tspan></text>
<text x="697" y="160" font-size="22" font-weight="700" fill="#202020" data-text-width="443"><tspan x="697" dy="0">Respondoj de AI kaj la sistemo</tspan></text>
<rect x="40" y="190" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="225" font-size="22" font-weight="700" fill="#202020" data-text-width="139"><tspan x="62" dy="0">01</tspan></text>
<text x="62" y="262" font-size="18" font-weight="700" fill="#202020" data-text-width="139"><tspan x="62" dy="0">Unua fojo</tspan><tspan x="62" dy="24.3">en la aŭto</tspan></text>
<text x="215" y="228" font-size="22" font-weight="400" fill="#202020" data-text-width="442"><tspan x="215" dy="0">Komenci agordadon dum la aŭto staras</tspan></text>
<text x="215" y="276" font-size="21" font-weight="400" fill="#646464" data-text-width="442"><tspan x="215" dy="0">«Mi volas, ke tio estu facile uzebla.»</tspan></text>
<text x="697" y="228" font-size="22" font-weight="400" fill="#202020" data-text-width="443"><tspan x="697" dy="0">Klarigi la celon kaj demandi,</tspan><tspan x="697" dy="29.7">ĉu komenci</tspan></text>
<text x="697" y="284" font-size="21" font-weight="400" fill="#202020" data-text-width="443"><tspan x="697" dy="0">Ebligi al la uzanto komenci poste</tspan></text>
<path d="M 85 339 V 356" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="360" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="395" font-size="22" font-weight="700" fill="#202020" data-text-width="139"><tspan x="62" dy="0">02</tspan></text>
<text x="62" y="432" font-size="18" font-weight="700" fill="#202020" data-text-width="139"><tspan x="62" dy="0">Intervjuo</tspan></text>
<text x="215" y="398" font-size="22" font-weight="400" fill="#202020" data-text-width="442"><tspan x="215" dy="0">Priskribi ĉiutagajn malfacilaĵojn</tspan></text>
<text x="215" y="446" font-size="21" font-weight="400" fill="#646464" data-text-width="442"><tspan x="215" dy="0">«Mi forgesas la antaŭajn instrukciojn,</tspan><tspan x="215" dy="28.35">kiam venas la sekvaj.»</tspan></text>
<text x="697" y="398" font-size="22" font-weight="400" fill="#202020" data-text-width="443"><tspan x="697" dy="0">Demandi pri konkretaj situacioj</tspan></text>
<text x="697" y="454" font-size="21" font-weight="400" fill="#202020" data-text-width="443"><tspan x="697" dy="0">Identigi postulojn pri memoro kaj atento</tspan></text>
<path d="M 85 509 V 526" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="530" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="565" font-size="22" font-weight="700" fill="#202020" data-text-width="139"><tspan x="62" dy="0">03</tspan></text>
<text x="62" y="602" font-size="18" font-weight="700" fill="#202020" data-text-width="139"><tspan x="62" dy="0">Kontroli la</tspan><tspan x="62" dy="24.3">komprenon</tspan></text>
<text x="215" y="568" font-size="22" font-weight="400" fill="#202020" data-text-width="442"><tspan x="215" dy="0">Konfirmi aŭ korekti la interpreton de AI</tspan></text>
<text x="215" y="616" font-size="21" font-weight="400" fill="#646464" data-text-width="442"><tspan x="215" dy="0">«Tio ĝustas. Tiu parto estas alia.»</tspan></text>
<text x="697" y="568" font-size="22" font-weight="400" fill="#202020" data-text-width="443"><tspan x="697" dy="0">Resumi tion, kion diris la uzanto</tspan></text>
<text x="697" y="624" font-size="21" font-weight="400" fill="#202020" data-text-width="443"><tspan x="697" dy="0">Distingi la raportojn de la uzanto</tspan><tspan x="697" dy="28.35">de mezuroj</tspan></text>
<path d="M 85 679 V 696" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="700" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="735" font-size="22" font-weight="700" fill="#202020" data-text-width="139"><tspan x="62" dy="0">04</tspan></text>
<text x="62" y="772" font-size="18" font-weight="700" fill="#202020" data-text-width="139"><tspan x="62" dy="0">Propono</tspan><tspan x="62" dy="24.3">kaj provo</tspan></text>
<text x="215" y="738" font-size="22" font-weight="400" fill="#202020" data-text-width="442"><tspan x="215" dy="0">Provi la interfacon dum la aŭto staras</tspan></text>
<text x="215" y="786" font-size="21" font-weight="400" fill="#646464" data-text-width="442"><tspan x="215" dy="0">«Helpas, kiam la informoj restas</tspan><tspan x="215" dy="28.35">sur la ekrano.»</tspan></text>
<text x="697" y="738" font-size="22" font-weight="400" fill="#202020" data-text-width="443"><tspan x="697" dy="0">Prezenti la interfacon kaj kialojn</tspan><tspan x="697" dy="29.7">de la ŝanĝoj</tspan></text>
<text x="697" y="794" font-size="21" font-weight="400" fill="#202020" data-text-width="443"><tspan x="697" dy="0">Ebligi alĝustigojn aŭ restarigi</tspan><tspan x="697" dy="28.35">la originan interfacon</tspan></text>
<path d="M 85 849 V 866" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<rect x="40" y="870" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5" />
<text x="62" y="905" font-size="22" font-weight="700" fill="#202020" data-text-width="139"><tspan x="62" dy="0">05</tspan></text>
<text x="62" y="942" font-size="18" font-weight="700" fill="#202020" data-text-width="139"><tspan x="62" dy="0">Ekuzi</tspan></text>
<text x="215" y="908" font-size="22" font-weight="400" fill="#202020" data-text-width="442"><tspan x="215" dy="0">Ekuzi la konfirmitan interfacon</tspan></text>
<text x="215" y="956" font-size="21" font-weight="400" fill="#646464" data-text-width="442"><tspan x="215" dy="0">«Mi provos komenci per ĉi tiu agordo.»</tspan></text>
<text x="697" y="908" font-size="22" font-weight="400" fill="#202020" data-text-width="443"><tspan x="697" dy="0">Konservi la komencan interfacon</tspan></text>
<text x="697" y="964" font-size="21" font-weight="400" fill="#202020" data-text-width="443"><tspan x="697" dy="0">Konservi ĝian bazan strukturon</tspan><tspan x="697" dy="28.35">dum veturado</tspan></text>
<text x="40" y="1103" font-size="25" font-weight="700" fill="#202020" data-text-width="1120"><tspan x="40" dy="0">Derivi el la konversacio personajn informojn, kiujn la uzanto povas konfirmi kaj korekti.</tspan></text>
<text x="40" y="1148" font-size="21" font-weight="400" fill="#646464" data-text-width="1120"><tspan x="40" dy="0">Distingi ilin de kognaj mezuroj kaj diagnozoj; taksi aliajn aspektojn laŭbezone.</tspan></text></svg>