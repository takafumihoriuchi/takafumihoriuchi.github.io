<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1641" viewBox="0 0 480 1641" role="img" aria-labelledby="title desc" xml:lang="eo"><title id="title">Generi interfacon el personaj informoj</title><desc id="desc">Koncepta diagramo por poŝtelefona ekrano, legata de supre malsupren: personaj enigoj; sciaroj A kaj B; generativa AI kaj aparta kontrolo; personigita interfaco kun kialoj de la ŝanĝoj.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4" /></marker></defs><rect width="480" height="1641" fill="white" /><rect x="24" y="26" width="402" height="222" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="62" font-size="18" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">ENIGO</tspan></text>
<text x="48" y="95" font-size="25" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Informoj pri la kognaj</tspan></text>
<text x="48" y="120" font-size="25" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">trajtoj de la uzanto</tspan></text>
<text x="48" y="164" font-size="20" font-weight="400" fill="#202020" data-text-width="354"><tspan x="48" dy="0">La PoC ankaŭ inkluzivas sensajn</tspan><tspan x="48" dy="27.0">kaj fizikajn trajtojn</tspan></text>
<text x="48" y="224" font-size="20" font-weight="400" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Enigoj: fikciaj uzantprofiloj</tspan></text>
<text x="24" y="284" font-size="23" font-weight="700" fill="#202020" data-text-width="432"><tspan x="24" dy="0">Scioj uzataj de AI</tspan></text>
<rect x="24" y="329" width="402" height="266.75" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="365" font-size="18" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Sciaro A</tspan></text>
<text x="48" y="400" font-size="25" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Bazaj principoj kaj</tspan><tspan x="48" dy="33.75">postuloj por interfacoj</tspan></text>
<text x="48" y="476.75" font-size="20" font-weight="400" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Konsekvenceco · Reagoj · Grupigo</tspan></text>
<text x="48" y="510.75" font-size="20" font-weight="400" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Sekureco · Alireblo</tspan></text>
<text x="48" y="544.75" font-size="20" font-weight="400" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Kiam postuloj validas kaj kiel</tspan><tspan x="48" dy="27.0">kontroli ilin</tspan></text>
<rect x="24" y="631.75" width="402" height="329.5" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="667.75" font-size="18" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Sciaro B</tspan></text>
<text x="48" y="702.75" font-size="25" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Rekomendoj pri</tspan><tspan x="48" dy="33.75">interfacoj laŭ</tspan><tspan x="48" dy="33.75">homaj trajtoj</tspan></text>
<text x="48" y="813.25" font-size="20" font-weight="400" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Esploraj rezultoj → Principoj</tspan><tspan x="48" dy="27.0">por prezenti informojn</tspan></text>
<text x="48" y="872.25" font-size="20" font-weight="400" fill="#202020" data-text-width="354"><tspan x="48" dy="0">→ Rekomendataj interfacoj</tspan></text>
<text x="48" y="910.25" font-size="20" font-weight="400" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Distingi esplorajn rezultojn</tspan><tspan x="48" dy="27.0">de dezajnaj decidoj</tspan></text>
<rect x="24" y="997.25" width="402" height="369.4000000000001" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="1033.25" font-size="18" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">PROCEZO / GENERADO KAJ</tspan><tspan x="48" dy="24.3">KONTROLO</tspan></text>
<text x="48" y="1092.55" font-size="28" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Generativa AI</tspan></text>
<text x="48" y="1139.55" font-size="22" font-weight="400" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Proponi interfacon per</tspan><tspan x="48" dy="29.7">personaj informoj kaj</tspan><tspan x="48" dy="29.7">dezajna scio</tspan></text>
<text x="48" y="1239.95" font-size="20" font-weight="400" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Kalkuli valorojn difinitajn</tspan><tspan x="48" dy="27.0">per formuloj</tspan></text>
<text x="48" y="1310.95" font-size="22" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Aparta paŝo: kontroli</tspan><tspan x="48" dy="29.7">la postulojn</tspan></text>
<rect x="24" y="1402.65" width="402" height="172.04999999999995" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5" />
<text x="48" y="1438.65" font-size="18" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">ELIGO</tspan></text>
<text x="48" y="1473.65" font-size="27" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">Personigita interfaco</tspan></text>
<text x="48" y="1516.65" font-size="23" font-weight="700" fill="#202020" data-text-width="354"><tspan x="48" dy="0">+ Kialoj kaj evidenteco</tspan><tspan x="48" dy="31.05">por la ŝanĝoj</tspan></text>
<path d="M 426 111 H 458 V 1092.25 H 434" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<path d="M 24 404 H 10 V 977.25 H 160 V 990.25" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 226 961.25 V 990.25" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<path d="M 226 1366.65 V 1395.65" fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)" />
<text x="24" y="1610.7" font-size="18" font-weight="400" fill="#646464" data-text-width="432"><tspan x="24" dy="0">Plenlinioj: procezo · Streklinioj: konsulto de scioj</tspan></text></svg>