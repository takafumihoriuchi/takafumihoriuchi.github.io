<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 350"><style>:root{--fg:#1a1a1a;--muted:#6b6b68;--bg:#fdfdfc;--accent:#7c6553;--wash:#ede8e2;--line:#ccc9c4}@media(prefers-color-scheme:dark){:root{--fg:#e8e8e5;--muted:#96968f;--bg:#141413;--accent:#b49780;--wash:#2b2a27;--line:#595952}}.ink{stroke:var(--fg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;fill:none}.quiet{stroke:var(--line);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.solid{fill:var(--fg);stroke:none}.paper{fill:var(--bg)}.wash{fill:var(--wash)}.accent{stroke:var(--accent);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:6 6}.label{font:16px system-ui,sans-serif;fill:var(--accent)}#light:target~.art{--fg:#1a1a1a;--muted:#6b6b68;--bg:#fdfdfc;--accent:#7c6553;--wash:#ede8e2;--line:#ccc9c4}#dark:target~.art{--fg:#e8e8e5;--muted:#96968f;--bg:#141413;--accent:#b49780;--wash:#2b2a27;--line:#595952}</style><g id="light"/><g id="dark"/><g class="art">
