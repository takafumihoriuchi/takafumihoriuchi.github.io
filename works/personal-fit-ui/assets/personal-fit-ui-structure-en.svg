<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc"><title id="title">Personal inputs and two types of design knowledge</title><desc id="desc">Concept diagram of the proposed system. Cognitive characteristics are combined with basic interface rules and recommendations based on human characteristics. Generative AI proposes an interface, a separate step validates it, and the output includes the interface and reasons for the changes.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="1400" height="1080" fill="white"/><text x="40" y="42" font-size="22" font-weight="700" fill="#202020"><tspan x="40" dy="0">Knowledge used by the AI, prepared by the designer</tspan></text>
<rect x="40" y="65" width="635" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="705" y="65" width="655" height="360" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="66" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">Knowledge A</tspan></text>
<text x="66" y="138" font-size="28" font-weight="700" fill="#202020"><tspan x="66" dy="0">Basic interface requirements</tspan></text>
<text x="66" y="188" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">Design principles</tspan></text>
<text x="66" y="214" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Consistency · Feedback · Information grouping</tspan></text>
<text x="66" y="256" font-size="20" font-weight="700" fill="#202020"><tspan x="66" dy="0">Requirements</tspan></text>
<text x="66" y="282" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Safety · Accessibility · Interaction restrictions</tspan></text>
<text x="66" y="323" font-size="19" font-weight="400" fill="#646464"><tspan x="66" dy="0">Define when requirements apply and how to check them</tspan></text>
<text x="731" y="103" font-size="18" font-weight="700" fill="#646464"><tspan x="731" dy="0">Knowledge B</tspan></text>
<text x="731" y="138" font-size="26" font-weight="700" fill="#202020"><tspan x="731" dy="0">Interface recommendations based on human</tspan><tspan x="731" dy="35.1">characteristics</tspan></text>
<text x="731" y="211.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Research on human characteristics</tspan></text>
<text x="731" y="233.1" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="253.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Principles for presenting information</tspan></text>
<text x="731" y="275.1" font-size="18" font-weight="400" fill="#202020"><tspan x="731" dy="0">↓</tspan></text>
<text x="731" y="295.1" font-size="20" font-weight="400" fill="#202020"><tspan x="731" dy="0">Interface recommendations for those characteristics</tspan></text>
<text x="731" y="399" font-size="19" font-weight="400" fill="#646464"><tspan x="731" dy="0">Separate research findings from design judgments</tspan></text>
<rect x="40" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="468" y="500" width="464" height="490" rx="12" fill="#fff" stroke="#303030" stroke-width="1.5"/>
<rect x="995" y="500" width="365" height="490" rx="12" fill="#fff" stroke="#a8a8a1" stroke-width="1.5"/>
<path d="M 357 425 V 462 H 600 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 1032 425 V 462 H 800 V 494" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M 408 725 H 458" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 935 725 H 985" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="66" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="66" dy="0">INPUT</tspan></text>
<text x="66" y="579" font-size="26" font-weight="700" fill="#202020"><tspan x="66" dy="0">Information about the</tspan><tspan x="66" dy="35.1">user’s cognitive</tspan><tspan x="66" dy="35.1">characteristics</tspan></text>
<text x="66" y="695.2" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Demands of holding and using</tspan><tspan x="66" dy="28.35">information</tspan></text>
<text x="66" y="758.5500000000001" font-size="21" font-weight="400" fill="#202020"><tspan x="66" dy="0">Attention and understanding</tspan><tspan x="66" dy="28.35">explanations</tspan></text>
<text x="66" y="833.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">The PoC also includes sensory and</tspan><tspan x="66" dy="27">physical characteristics</tspan></text>
<text x="66" y="894.9000000000001" font-size="20" font-weight="400" fill="#646464"><tspan x="66" dy="0">Inputs: fictional personas</tspan></text>
<text x="494" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="494" dy="0">PROCESS / GENERATION AND VALIDATION</tspan></text>
<text x="494" y="580" font-size="30" font-weight="700" fill="#202020"><tspan x="494" dy="0">Generative AI</tspan></text>
<text x="494" y="632" font-size="23" font-weight="400" fill="#202020"><tspan x="494" dy="0">Combine personal information with</tspan><tspan x="494" dy="31.05">design knowledge to propose an</tspan><tspan x="494" dy="31.05">interface within the permitted</tspan><tspan x="494" dy="31.05">boundaries</tspan></text>
<text x="494" y="774.15" font-size="21" font-weight="400" fill="#646464"><tspan x="494" dy="0">Calculate values determined by formulas</tspan></text>
<text x="682" y="819.15" font-size="28" font-weight="400" fill="#202020"><tspan x="682" dy="0">⇅</tspan></text>
<rect x="490" y="842.15" width="420" height="95" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="512" y="869.15" font-size="21" font-weight="700" fill="#202020"><tspan x="512" dy="0">Separate step: check the defined</tspan><tspan x="512" dy="28.35">requirements</tspan></text>
<text x="1021" y="539" font-size="18" font-weight="700" fill="#646464"><tspan x="1021" dy="0">OUTPUT</tspan></text>
<text x="1021" y="579" font-size="28" font-weight="700" fill="#202020"><tspan x="1021" dy="0">A tailored interface</tspan></text>
<text x="1021" y="629" font-size="24" font-weight="700" fill="#202020"><tspan x="1021" dy="0">+ Reasons and evidence</tspan><tspan x="1021" dy="32.400000000000006">for the changes</tspan></text>
<rect x="1021" y="730.4" width="311" height="102" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1035" y="744.4" width="90" height="72" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1140" y="744.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1140" y="770.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<rect x="1140" y="796.4" width="177" height="19" rx="12" fill="white" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="1021" y="873.4" font-size="20" font-weight="400" fill="#646464"><tspan x="1021" dy="0">Define layout, presentation, and</tspan><tspan x="1021" dy="27">wording</tspan></text>
<path d="M 40 1038 H 86" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="103" y="1045" font-size="19" font-weight="400" fill="#202020"><tspan x="103" dy="0">Process flow</tspan></text>
<path d="M 310 1038 H 356" fill="none" stroke="#303030" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="374" y="1045" font-size="19" font-weight="400" fill="#202020"><tspan x="374" dy="0">Knowledge reference</tspan></text></svg>