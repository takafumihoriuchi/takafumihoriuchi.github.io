<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
<title id="title">最初の乗車から、使い始めのUIを整える</title><desc id="desc">将来構想。停車中に開始、インタビュー、理解の確認、提案と試用、利用開始の5段階を、利用者の行動とAIの対応で示す。</desc>
<style>text{font-family:"Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#202020}.muted{fill:#646464}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#202020" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="1030" fill="white"/>
<text x="40" y="54" font-size="33" font-weight="700" style="fill:#202020" text-anchor="start">最初の乗車から、使い始めのUIを整える</text>
<text x="40" y="97" font-size="21" font-weight="400" style="fill:#646464" text-anchor="start">将来構想 / 会話による初期設定はPoCでは未実装</text>
<text x="186" y="153" font-size="21" font-weight="700" style="fill:#202020" text-anchor="start">利用者の行動・気持ち</text>
<text x="680" y="153" font-size="21" font-weight="700" style="fill:#202020" text-anchor="start">AI・システムの対応</text>
<rect x="40" y="180" width="1120" height="126" rx="10" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1"/>
<text x="62" y="219" font-size="22" font-weight="700" style="fill:#202020" text-anchor="start">01</text>
<text x="62" y="257" font-size="17" font-weight="700" style="fill:#202020" text-anchor="start">初回乗車</text>
<text x="186" y="225" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">停車中に、初期設定を始める</text>
<text x="186" y="263" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">「まずは使いやすく整えたい」</text>
<text x="680" y="225" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">目的を説明し、開始を尋ねる</text>
<text x="680" y="263" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">後から始めることも選べる</text>
<path d="M 83 307 V 325" fill="none" stroke="#202020" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40" y="327" width="1120" height="126" rx="10" fill="#ffffff" stroke="#d2d2ca" stroke-width="1"/>
<text x="62" y="366" font-size="22" font-weight="700" style="fill:#202020" text-anchor="start">02</text>
<text x="62" y="404" font-size="17" font-weight="700" style="fill:#202020" text-anchor="start">インタビュー</text>
<text x="186" y="372" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">普段の困りごとを話す</text>
<text x="186" y="410" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">「案内が続くと、前の内容を忘れる」</text>
<text x="680" y="372" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">具体的な場面を聞き取る</text>
<text x="680" y="410" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">情報の保持や注意の負担を整理</text>
<path d="M 83 454 V 472" fill="none" stroke="#202020" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40" y="474" width="1120" height="126" rx="10" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1"/>
<text x="62" y="513" font-size="22" font-weight="700" style="fill:#202020" text-anchor="start">03</text>
<text x="62" y="551" font-size="17" font-weight="700" style="fill:#202020" text-anchor="start">理解の確認</text>
<text x="186" y="519" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">AIの理解を確認・訂正する</text>
<text x="186" y="557" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">「ここは合っている。ここは違う」</text>
<text x="680" y="519" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">受け取った内容を言葉で返す</text>
<text x="680" y="557" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">自己申告と測定値を分けて扱う</text>
<path d="M 83 601 V 619" fill="none" stroke="#202020" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40" y="621" width="1120" height="126" rx="10" fill="#ffffff" stroke="#d2d2ca" stroke-width="1"/>
<text x="62" y="660" font-size="22" font-weight="700" style="fill:#202020" text-anchor="start">04</text>
<text x="62" y="698" font-size="17" font-weight="700" style="fill:#202020" text-anchor="start">提案と試用</text>
<text x="186" y="666" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">停車中に画面を試す</text>
<text x="186" y="704" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">「必要な情報が残ると助かる」</text>
<text x="680" y="666" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">UI案と変更理由を提示する</text>
<text x="680" y="704" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">調整や、元のUIへの復帰に対応</text>
<path d="M 83 748 V 766" fill="none" stroke="#202020" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40" y="768" width="1120" height="126" rx="10" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1"/>
<text x="62" y="807" font-size="22" font-weight="700" style="fill:#202020" text-anchor="start">05</text>
<text x="62" y="845" font-size="17" font-weight="700" style="fill:#202020" text-anchor="start">利用開始</text>
<text x="186" y="813" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">確認したUIで使い始める</text>
<text x="186" y="851" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">「この状態から使ってみよう」</text>
<text x="680" y="813" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">初期UIを保存する</text>
<text x="680" y="851" font-size="22" font-weight="400" style="fill:#202020" text-anchor="start">走行中は基本構成を維持</text>
<text x="40" y="958" font-size="23" font-weight="700" style="fill:#202020" text-anchor="start">会話の内容から、本人が確認・訂正できる個人情報へ。</text>
<text x="40" y="999" font-size="20" font-weight="400" style="fill:#646464" text-anchor="start">認知機能の測定や診断とは分けて扱い、必要な項目は別途確かめる。</text>
</svg>
