<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1414" viewBox="0 126 480 1414" role="img" aria-labelledby="title desc">
<title id="title">個人の情報からUIを生成する構想</title><desc id="desc">入力、参照する知識AとB、生成AIと別工程の検査、UIと変更理由の出力を縦に読むモバイル用の図。</desc>
<style>text{font-family:"Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#202020}.muted{fill:#646464}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#202020" stroke-width="1.4"/></marker></defs>
<rect width="480" height="1540" fill="white"/>
<rect x="24" y="146" width="402" height="208" rx="12" fill="#ffffff" stroke="#9a9a94" stroke-width="1.5"/>
<text x="46" y="183" font-size="18" font-weight="700" style="fill:#646464" text-anchor="start">INPUT / 入力</text>
<text x="46" y="225" font-size="25" font-weight="700" style="fill:#202020" text-anchor="start">そのユーザー個人の</text>
<text x="46" y="260" font-size="25" font-weight="700" style="fill:#202020" text-anchor="start">認知特性についての情報</text>
<text x="46" y="304" font-size="19" font-weight="400" style="fill:#646464" text-anchor="start">PoCでは感覚・身体特性も含む</text>
<text x="46" y="332" font-size="19" font-weight="400" style="fill:#646464" text-anchor="start">入力は架空ペルソナ</text>
<path d="M 426 251 H 455 V 1120 H 428" fill="none" stroke="#202020" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="24" y="398" font-size="21" font-weight="700" style="fill:#202020" text-anchor="start">AIが参照する知識</text>
<rect x="24" y="421" width="402" height="235" rx="12" fill="#f3f3ef" stroke="#9a9a94" stroke-width="1.5"/>
<text x="46" y="458" font-size="18" font-weight="700" style="fill:#646464" text-anchor="start">知識 A</text>
<text x="46" y="500" font-size="24" font-weight="700" style="fill:#202020" text-anchor="start">UIの基本ルールと守る条件</text>
<text x="46" y="540" font-size="20" font-weight="400" style="fill:#202020" text-anchor="start">一貫性・フィードバック・群化</text>
<text x="46" y="575" font-size="20" font-weight="400" style="fill:#202020" text-anchor="start">安全性・アクセシビリティ</text>
<text x="46" y="610" font-size="20" font-weight="400" style="fill:#202020" text-anchor="start">適用する状況と確認方法</text>
<rect x="24" y="678" width="402" height="237" rx="12" fill="#f3f3ef" stroke="#9a9a94" stroke-width="1.5"/>
<text x="46" y="715" font-size="18" font-weight="700" style="fill:#646464" text-anchor="start">知識 B</text>
<text x="46" y="754" font-size="22" font-weight="700" style="fill:#202020" text-anchor="start">人の特性に応じた推奨UIの知識</text>
<text x="46" y="795" font-size="20" font-weight="400" style="fill:#202020" text-anchor="start">特性の研究知見 → 情報提示の原則</text>
<text x="46" y="830" font-size="20" font-weight="400" style="fill:#202020" text-anchor="start">→ その特徴を持つ人への推奨UI</text>
<text x="46" y="882" font-size="19" font-weight="400" style="fill:#646464" text-anchor="start">研究知見と設計上の導出を区別</text>
<path d="M 24 538 H 10 V 944 H 150 V 978" fill="none" stroke="#202020" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<path d="M 268 915 V 978" fill="none" stroke="#202020" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<rect x="24" y="985" width="402" height="268" rx="12" fill="#ffffff" stroke="#202020" stroke-width="2.2"/>
<text x="46" y="1023" font-size="18" font-weight="700" style="fill:#646464" text-anchor="start">PROCESS / 生成と検査</text>
<text x="46" y="1070" font-size="29" font-weight="700" style="fill:#202020" text-anchor="start">生成AI</text>
<text x="46" y="1110" font-size="20" font-weight="400" style="fill:#202020" text-anchor="start">個人の情報と知識からUI案を具体化</text>
<text x="46" y="1144" font-size="20" font-weight="400" style="fill:#202020" text-anchor="start">式で決まる値は計算で確定</text>
<rect x="43" y="1171" width="364" height="58" rx="8" fill="#f3f3ef" stroke="#c9c9c3" stroke-width="1"/>
<text x="62" y="1207" font-size="21" font-weight="700" style="fill:#202020" text-anchor="start">別工程：条件への適合を検査</text>
<path d="M 224 1254 V 1284" fill="none" stroke="#202020" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="24" y="1293" width="402" height="155" rx="12" fill="#ffffff" stroke="#9a9a94" stroke-width="1.5"/>
<text x="46" y="1331" font-size="18" font-weight="700" style="fill:#646464" text-anchor="start">OUTPUT / 出力</text>
<text x="46" y="1377" font-size="25" font-weight="700" style="fill:#202020" text-anchor="start">その人に合わせたUI</text>
<text x="46" y="1419" font-size="23" font-weight="700" style="fill:#202020" text-anchor="start">＋ 変更理由・根拠</text>
<text x="24" y="1494" font-size="18" font-weight="400" style="fill:#646464" text-anchor="start">実線：処理の流れ　破線：知識の参照</text>
</svg>
