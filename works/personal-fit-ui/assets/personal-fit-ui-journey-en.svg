<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc"><title id="title">Setting up the interface before the first drive</title><desc id="desc">Future concept. Five stages: starting setup while stationary, interview, checking understanding, proposal and trial, and beginning use. Each stage shows the user’s actions and the AI’s response.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="1200" height="1220" fill="white"/><text x="40" y="55" font-size="33" font-weight="700" fill="#202020"><tspan x="40" dy="0">Setting up the interface before the first drive</tspan></text>
<text x="40" y="99" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">Future concept / Conversational setup is not implemented in the PoC</tspan></text>
<text x="215" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="215" dy="0">User actions and thoughts</tspan></text>
<text x="697" y="160" font-size="22" font-weight="700" fill="#202020"><tspan x="697" dy="0">AI and system responses</tspan></text>
<rect x="40" y="190" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="225" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">01</tspan></text>
<text x="62" y="262" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">First time in</tspan><tspan x="62" dy="24.3">the car</tspan></text>
<text x="215" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Begin setup while stationary</tspan></text>
<text x="215" y="276" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“I’d like to make this easy to use.”</tspan></text>
<text x="697" y="228" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Explain the purpose and ask whether to</tspan><tspan x="697" dy="29.700000000000003">begin</tspan></text>
<text x="697" y="284" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Allow the user to start later</tspan></text>
<path d="M 85 339 V 356" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="40" y="360" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="395" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">02</tspan></text>
<text x="62" y="432" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Interview</tspan></text>
<text x="215" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Describe everyday difficulties</tspan></text>
<text x="215" y="446" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“I forget earlier instructions when the next</tspan><tspan x="215" dy="28.35">ones arrive.”</tspan></text>
<text x="697" y="398" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Ask about specific situations</tspan></text>
<text x="697" y="454" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Identify memory and attention demands</tspan></text>
<path d="M 85 509 V 526" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="40" y="530" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="565" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">03</tspan></text>
<text x="62" y="602" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Check</tspan><tspan x="62" dy="24.3">understanding</tspan></text>
<text x="215" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Confirm or correct the AI’s interpretation</tspan></text>
<text x="215" y="616" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“This part is right. That part is different.”</tspan></text>
<text x="697" y="568" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Summarize what the user has said</tspan></text>
<text x="697" y="624" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Keep self-reports separate from</tspan><tspan x="697" dy="28.35">measurements</tspan></text>
<path d="M 85 679 V 696" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="40" y="700" width="1120" height="148" rx="12" fill="white" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="735" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">04</tspan></text>
<text x="62" y="772" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Proposal and</tspan><tspan x="62" dy="24.3">trial</tspan></text>
<text x="215" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Try the interface while stationary</tspan></text>
<text x="215" y="786" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“It helps when the information stays on</tspan><tspan x="215" dy="28.35">screen.”</tspan></text>
<text x="697" y="738" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Present the interface and reasons for the</tspan><tspan x="697" dy="29.700000000000003">changes</tspan></text>
<text x="697" y="794" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Allow adjustments or restore the original</tspan><tspan x="697" dy="28.35">interface</tspan></text>
<path d="M 85 849 V 866" fill="none" stroke="#303030" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="40" y="870" width="1120" height="148" rx="12" fill="#f3f3ef" stroke="#d2d2ca" stroke-width="1.5"/>
<text x="62" y="905" font-size="22" font-weight="700" fill="#202020"><tspan x="62" dy="0">05</tspan></text>
<text x="62" y="942" font-size="18" font-weight="700" fill="#202020"><tspan x="62" dy="0">Begin use</tspan></text>
<text x="215" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="215" dy="0">Start using the confirmed interface</tspan></text>
<text x="215" y="956" font-size="21" font-weight="400" fill="#646464"><tspan x="215" dy="0">“I’ll try starting with this setup.”</tspan></text>
<text x="697" y="908" font-size="22" font-weight="400" fill="#202020"><tspan x="697" dy="0">Save the initial interface</tspan></text>
<text x="697" y="964" font-size="21" font-weight="400" fill="#202020"><tspan x="697" dy="0">Keep its basic structure consistent while</tspan><tspan x="697" dy="28.35">driving</tspan></text>
<text x="40" y="1103" font-size="25" font-weight="700" fill="#202020"><tspan x="40" dy="0">Turn the conversation into personal information the user can confirm and correct.</tspan></text>
<text x="40" y="1148" font-size="21" font-weight="400" fill="#646464"><tspan x="40" dy="0">Keep it separate from cognitive measurements and diagnoses; assess other items as needed.</tspan></text></svg>