<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1641" viewBox="0 0 480 1641" role="img" aria-labelledby="title desc"><title id="title">Generating an interface from personal information</title><desc id="desc">Mobile concept diagram, read from top to bottom: personal input; knowledge sets A and B; generative AI and separate validation; a tailored interface with reasons for the changes.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.4"/></marker></defs><rect width="480" height="1641" fill="white"/><rect x="24" y="26" width="402" height="222" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="62" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">INPUT</tspan></text>
<text x="48" y="95" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">Information about the user’s</tspan></text>
<text x="48" y="120" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">cognitive characteristics</tspan></text>
<text x="48" y="164" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">The PoC also includes sensory and</tspan><tspan x="48" dy="27">physical characteristics</tspan></text>
<text x="48" y="224" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Inputs: fictional personas</tspan></text>
<text x="24" y="284" font-size="23" font-weight="700" fill="#202020"><tspan x="24" dy="0">Knowledge used by the AI</tspan></text>
<rect x="24" y="329" width="402" height="266.75" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="365" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">Knowledge A</tspan></text>
<text x="48" y="400" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">Basic interface principles</tspan><tspan x="48" dy="33.75">and requirements</tspan></text>
<text x="48" y="476.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Consistency · Feedback · Grouping</tspan></text>
<text x="48" y="510.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Safety · Accessibility</tspan></text>
<text x="48" y="544.75" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">When requirements apply and how to</tspan><tspan x="48" dy="27">check them</tspan></text>
<rect x="24" y="631.75" width="402" height="329.5" rx="12" fill="#f3f3ef" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="667.75" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">Knowledge B</tspan></text>
<text x="48" y="702.75" font-size="25" font-weight="700" fill="#202020"><tspan x="48" dy="0">Interface recommendations</tspan><tspan x="48" dy="33.75">based on human</tspan><tspan x="48" dy="33.75">characteristics</tspan></text>
<text x="48" y="813.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Research findings → Presentation</tspan><tspan x="48" dy="27">principles</tspan></text>
<text x="48" y="872.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">→ Recommended interfaces</tspan></text>
<text x="48" y="910.25" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Separate research findings from design</tspan><tspan x="48" dy="27">judgments</tspan></text>
<rect x="24" y="997.25" width="402" height="369.4000000000001" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="1033.25" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">PROCESS / GENERATION AND</tspan><tspan x="48" dy="24.3">VALIDATION</tspan></text>
<text x="48" y="1092.55" font-size="28" font-weight="700" fill="#202020"><tspan x="48" dy="0">Generative AI</tspan></text>
<text x="48" y="1139.55" font-size="22" font-weight="400" fill="#202020"><tspan x="48" dy="0">Propose an interface using</tspan><tspan x="48" dy="29.700000000000003">personal information and design</tspan><tspan x="48" dy="29.700000000000003">knowledge</tspan></text>
<text x="48" y="1239.95" font-size="20" font-weight="400" fill="#202020"><tspan x="48" dy="0">Calculate values determined by</tspan><tspan x="48" dy="27">formulas</tspan></text>
<text x="48" y="1310.95" font-size="22" font-weight="700" fill="#202020"><tspan x="48" dy="0">Separate step: check the</tspan><tspan x="48" dy="29.700000000000003">requirements</tspan></text>
<rect x="24" y="1402.65" width="402" height="172.04999999999995" rx="12" fill="#ffffff" stroke="#a8a8a1" stroke-width="1.5"/>
<text x="48" y="1438.65" font-size="18" font-weight="700" fill="#202020"><tspan x="48" dy="0">OUTPUT</tspan></text>
<text x="48" y="1473.65" font-size="27" font-weight="700" fill="#202020"><tspan x="48" dy="0">A tailored interface</tspan></text>
<text x="48" y="1516.65" font-size="23" font-weight="700" fill="#202020"><tspan x="48" dy="0">+ Reasons and evidence for the</tspan><tspan x="48" dy="31.05">changes</tspan></text>
