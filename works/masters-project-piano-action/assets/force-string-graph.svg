<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 750" role="img" aria-labelledby="title desc">
  <title id="title">String reaction force</title>
  <desc id="desc">The string reaction force reaches a sharp peak of 31 newtons at the moment of impact, 1.07 seconds.</desc>
  <rect width="1060" height="750" fill="#fff"/>

  <g fill="none" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="2 3">
    <line x1="150" y1="660" x2="1015" y2="660"/>
    <line x1="150" y1="500" x2="1015" y2="500"/>
    <line x1="150" y1="340" x2="1015" y2="340"/>
    <line x1="150" y1="180" x2="1015" y2="180"/>
    <line x1="150" y1="100" x2="150" y2="660"/>
    <line x1="285" y1="100" x2="285" y2="660"/>
    <line x1="420" y1="100" x2="420" y2="660"/>
    <line x1="555" y1="100" x2="555" y2="660"/>
    <line x1="691" y1="100" x2="691" y2="660"/>
    <line x1="826" y1="100" x2="826" y2="660"/>
    <line x1="961" y1="100" x2="961" y2="660"/>
  </g>

  <g fill="none" stroke="#111" stroke-width="1.5">
    <rect x="150" y="100" width="865" height="560"/>
    <line x1="439" y1="660" x2="439" y2="670"/>
    <line x1="150" y1="180" x2="140" y2="180"/>
    <line x1="150" y1="340" x2="140" y2="340"/>
    <line x1="150" y1="500" x2="140" y2="500"/>
  </g>

  <g fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="25">
    <text x="130" y="668" text-anchor="end">0</text>
    <text x="130" y="508" text-anchor="end">10</text>
    <text x="130" y="348" text-anchor="end">20</text>
    <text x="130" y="188" text-anchor="end">30</text>
    <text x="150" y="700" text-anchor="middle">0</text>
    <text x="285" y="700" text-anchor="middle">0.5</text>
    <text x="420" y="700" text-anchor="middle">1.0</text>
    <text x="555" y="700" text-anchor="middle">1.5</text>
    <text x="691" y="700" text-anchor="middle">2.0</text>
    <text x="826" y="700" text-anchor="middle">2.5</text>
    <text x="961" y="700" text-anchor="middle">3.0</text>
    <text x="582" y="738" text-anchor="middle">Time (s)</text>
    <text x="54" y="380" text-anchor="middle" transform="rotate(-90 54 380)">Reaction Force (N)</text>
  </g>

  <g fill="none" stroke="#111">
    <line x1="439" y1="164" x2="439" y2="660" stroke-width="1" stroke-dasharray="2 3"/>
    <path d="M150 660 H429 L439 164 L450 660 H1015" stroke-width="3" stroke-linejoin="round"/>
    <rect x="432" y="157" width="14" height="14" fill="#fff" stroke-width="3"/>
  </g>

  <g fill="#111" font-family="Arial, Helvetica, sans-serif">
    <text x="462" y="154" font-size="23">31 N</text>
    <text x="462" y="184" font-size="21">t = 1.07 s</text>
  </g>

  <g fill="#111" stroke="#111" font-family="Arial, Helvetica, sans-serif" font-size="26">
    <line x1="405" y1="55" x2="450" y2="55" stroke-width="3"/>
    <rect x="421" y="48" width="14" height="14" fill="#fff" stroke-width="3"/>
    <text x="468" y="64" stroke="none">V_string</text>
  </g>
</svg>
