<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 750" role="img" aria-labelledby="title desc">
  <title id="title">Key force input</title>
  <desc id="desc">The key force begins increasing at 1.0 seconds, reaches 15 newtons, remains constant, and returns to zero.</desc>
  <rect width="1060" height="750" fill="#fff"/>

  <g fill="none" stroke="#b8b8b8" stroke-width="1" stroke-dasharray="2 3">
    <line x1="150" y1="660" x2="1015" y2="660"/>
    <line x1="150" y1="485" x2="1015" y2="485"/>
    <line x1="150" y1="310" x2="1015" y2="310"/>
    <line x1="150" y1="135" x2="1015" y2="135"/>
    <line x1="150" y1="100" x2="150" y2="660"/>
    <line x1="285" y1="100" x2="285" y2="660"/>
    <line x1="420" y1="100" x2="420" y2="660"/>
    <line x1="555" y1="100" x2="555" y2="660"/>
    <line x1="691" y1="100" x2="691" y2="660"/>
    <line x1="826" y1="100" x2="826" y2="660"/>
    <line x1="961" y1="100" x2="961" y2="660"/>
  </g>

  <g fill="none" stroke="#111" stroke-width="1.5">
    <rect x="150" y="100" width="865" height="560"/>
    <line x1="420" y1="660" x2="420" y2="670"/>
    <line x1="691" y1="660" x2="691" y2="670"/>
    <line x1="150" y1="135" x2="140" y2="135"/>
    <line x1="150" y1="310" x2="140" y2="310"/>
    <line x1="150" y1="485" x2="140" y2="485"/>
  </g>

  <g fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="25">
    <text x="130" y="668" text-anchor="end">0</text>
    <text x="130" y="493" text-anchor="end">5</text>
    <text x="130" y="318" text-anchor="end">10</text>
    <text x="130" y="143" text-anchor="end">15</text>
    <text x="150" y="700" text-anchor="middle">0</text>
    <text x="285" y="700" text-anchor="middle">0.5</text>
    <text x="420" y="700" text-anchor="middle">1.0</text>
    <text x="555" y="700" text-anchor="middle">1.5</text>
    <text x="691" y="700" text-anchor="middle">2.0</text>
    <text x="826" y="700" text-anchor="middle">2.5</text>
    <text x="961" y="700" text-anchor="middle">3.0</text>
    <text x="582" y="738" text-anchor="middle">Time (s)</text>
    <text x="54" y="380" text-anchor="middle" transform="rotate(-90 54 380)">Force (N)</text>
  </g>

  <g fill="none" stroke="#111" stroke-width="3">
    <path d="M150 660 H420 L474 135 H691 L745 660 H1015" stroke-linejoin="round"/>
    <circle cx="150" cy="660" r="7" fill="#fff"/>
    <circle cx="420" cy="660" r="7" fill="#fff"/>
    <circle cx="474" cy="135" r="7" fill="#fff"/>
    <circle cx="691" cy="135" r="7" fill="#fff"/>
    <circle cx="745" cy="660" r="7" fill="#fff"/>
    <circle cx="1015" cy="660" r="7" fill="#fff"/>
  </g>

  <g fill="#111" stroke="#111" font-family="Arial, Helvetica, sans-serif" font-size="26">
    <line x1="430" y1="55" x2="475" y2="55" stroke-width="3"/>
    <circle cx="452" cy="55" r="7" fill="#fff" stroke-width="3"/>
    <text x="492" y="64" stroke="none">F_key</text>
  </g>
</svg>
